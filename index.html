    .replaceAll('{jumlah}', suratSPRupiah(d.jumlah)).replaceAll('{sudah_diangsur}', suratSPRupiah(d.sudahDiangsur))
    .replaceAll('{sisa_angsuran}', suratSPRupiah(d.sisaKewajiban))
    .replaceAll('{hari_telat}', String(d.hariTelat)).replaceAll('{batas_hari}', String(s.batasHari))
    .replaceAll('{tanggal_batas}', suratSPTanggal(tanggalBatas));
}
function suratSPBuildNomor(s, urut){
  const t = s.tanggalSurat ? new Date(s.tanggalSurat) : new Date();
  return s.formatNomor
    .replaceAll('{urut}', String(urut).padStart(3,'0'))
    .replaceAll('{bulan_romawi}', SURAT_SP_ROMAN[t.getMonth()])
    .replaceAll('{bulan}', String(t.getMonth()+1).padStart(2,'0'))
    .replaceAll('{tahun}', String(t.getFullYear()));
}
function suratSPBuatPage(d, s, urut){
  const tglSurat = s.tanggalSurat ? new Date(s.tanggalSurat) : new Date();
  const batas = new Date(tglSurat); batas.setDate(batas.getDate() + s.batasHari);
  const nomorSurat = suratSPBuildNomor(s, urut);
  const pembuka = suratSPFill(s.tplPembuka, d, s, nomorSurat, batas);
  const isi = suratSPFill(s.tplIsi, d, s, nomorSurat, batas);
  const penutup = suratSPFill(s.tplPenutup, d, s, nomorSurat, batas).split('\n\n').map(p=>'<p>'+escapeHtml(p).replace(/\n/g,'<br>')+'</p>').join('');
  const ttds = (s.ttdList && s.ttdList.length ? s.ttdList : [{jabatan:'',nama:''}]);
  const logoAktif = s.tampilLogo && s.logo;
  const kopLogo = logoAktif ? '<img src="'+s.logo+'" alt="logo">' : '';
  const kopCenter = logoAktif ? 'flex:1;text-align:center;' : 'text-align:center;';
  const signers = (ttds.length<=1
    ? '<div class="blok" style="margin-left:auto;"><div>'+escapeHtml(ttds[0].jabatan||'Jabatan')+'</div><div class="ssp-space"></div><div><b><u>'+escapeHtml(ttds[0].nama||'Nama Penandatangan')+'</u></b></div></div>'
    : ttds.map(t=>'<div class="blok"><div>'+escapeHtml(t.jabatan||'Jabatan')+'</div><div class="ssp-space"></div><div><b><u>'+escapeHtml(t.nama||'Nama')+'</u></b></div></div>').join(''));
  return '' +
  '<div class="ssp-page">' +
    '<div class="ssp-kop">'+kopLogo+'<div style="'+kopCenter+'"><div class="nm">'+escapeHtml(s.namaLembaga||'Nama Lembaga')+'</div><div class="al">'+escapeHtml(s.alamatLembaga||'')+'</div></div>'+(logoAktif?'<img src="'+s.logo+'" alt="" style="visibility:hidden;">':'')+'</div>' +
    '<div class="ssp-meta">' +
      '<table><tr><td>Nomor</td><td>&nbsp;:&nbsp;</td><td>'+escapeHtml(nomorSurat)+'</td></tr><tr><td>Lampiran</td><td>&nbsp;:&nbsp;</td><td>-</td></tr><tr><td>Perihal</td><td>&nbsp;:&nbsp;</td><td><b>Surat Peringatan Tunggakan Angsuran</b></td></tr></table>' +
      '<div>'+escapeHtml(s.kota||'')+(s.kota?', ':'')+suratSPTanggal(tglSurat)+'</div>' +
    '</div>' +
    '<div style="margin-bottom:14px;">Kepada Yth.<br><b>'+escapeHtml(d.nama)+'</b><br>di '+escapeHtml(d.alamat||'Tempat')+'</div>' +
    '<div class="ssp-judul">SURAT PERINGATAN</div>' +
    '<div class="ssp-isi"><p>Dengan hormat,</p><p>'+escapeHtml(pembuka)+'</p><p>'+escapeHtml(isi)+'</p>' +
      '<table class="ssp-rincian"><tr><th>Uraian</th><th>Jumlah</th></tr>' +
        '<tr><td>Pokok Pinjaman</td><td class="num">'+suratSPRupiah(d.pokok)+'</td></tr>' +
        '<tr><td>Jasa / Laba</td><td class="num">'+suratSPRupiah(d.laba)+'</td></tr>' +
        '<tr><td>Total Kewajiban</td><td class="num">'+suratSPRupiah(d.jumlah)+'</td></tr>' +
        '<tr><td>Sudah Diangsur</td><td class="num">'+suratSPRupiah(d.sudahDiangsur)+'</td></tr>' +
        '<tr><td><b>Sisa Kewajiban</b></td><td class="num"><b>'+suratSPRupiah(d.sisaKewajiban)+'</b></td></tr>' +
      '</table>' + penutup + '</div>' +
    '<div class="ssp-ttd">'+signers+'</div>' +
  '</div>';
}
function suratSPBuat(){
  if(!suratSPSelected.length){ toast('Pilih nasabah dulu'); return; }
  const s = suratSPReadSettings();
  suratSPSave(s);
  const chosen = suratSPOverdue().filter(d=>suratSPSelected.includes(d.pembId)).sort((a,b)=>b.hariTelat-a.hariTelat);
  let html = '<div class="ssp-toolbar no-print" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;">' +
    '<div style="font-size:13px;color:var(--muted);">'+chosen.length+' surat siap</div>' +
    '<button class="btn btn-primary" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div>';
  let urut = s.nomorAwal;
  chosen.forEach(d=>{ html += suratSPBuatPage(d, s, urut); urut++; });
  document.getElementById('ssp-preview').innerHTML = html;
  document.getElementById('ssp-preview').scrollIntoView({behavior:'smooth'});
  toast('Surat berhasil dibuat');
}

function suratSPUseKoperasiLogo(){

  suratSPLogo = logo;

  }

function suratSPClearLogo(){
  suratSPLogo = '';
  const hid = document.getElementById('ssp-logo');
  const prev = document.getElementById('ssp-logo-prev');
  if(hid) hid.value = '';
  if(prev) prev.innerHTML = '<span style="font-size:11px;color:var(--muted);">Belum ada logo</span>';
  toast('Logo dihapus. Klik Simpan Pengaturan.');
}
function suratSPLoadLogoFile(input){
  const f = input.files && input.files[0];
  if(!f){ return; }
  if(!/image\/(png|jpe?g|webp)/.test(f.type)){ toast('Pilih file gambar (PNG/JPG/WebP)'); return; }
  if(f.size > 1024*1024){ toast('Ukuran maksimal 1 MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const logo = e.target.result;
    suratSPLogo = logo;
    const hid = document.getElementById('ssp-logo');
    const prev = document.getElementById('ssp-logo-prev');
    if(hid) hid.value = logo;
    if(prev) prev.innerHTML = '<img src="'+logo+'" alt="logo">';
    toast('Logo siap digunakan');
  };
  reader.readAsDataURL(f);
}

function renderKoorSaham(user){
  const jns = DB.koperasi.saham.jenis||[];
  const allKs = DB.kepemilikanSaham||[];
  const anggotaIds = nasabahOfKelompok(user.kelompokId).map(u=>u.id);
  const ks = allKs.filter(k=>
    k.kelompokId===user.kelompokId ||
    (k.anggotaId && anggotaIds.includes(k.anggotaId)) ||
    ownerKelompokId(k.nama)===user.kelompokId
  );
  const daftarPemilik = [];
  const seen = {};
  ks.forEach(k=>{ if(!seen[k.nama]){ seen[k.nama]=true; daftarPemilik.push(k.nama); } });
  const totalLembar = ks.reduce((s,k)=>s+k.lembar,0);
  const totalNilaiAwal = ks.reduce((s,k)=>{ const j=jns.find(j=>j.id===k.jenisId); return s+(j?k.lembar*(j.nominalPerLembar||0):0); },0);
  const totalNilaiSesudah = ks.reduce((s,k)=>{ const j=jns.find(j=>j.id===k.jenisId); return s+(j?k.lembar*nilaiSahamPerLembar(j):0); },0);
  const pct = DB.koperasi.saham.pemupukanPersen||0;
  return `
    <div class="page-title">Saham<span class="sub">${kelompokName(user.kelompokId)}</span></div>

    </div>
    <div class="stat-grid" style="margin-bottom:14px;">
      ${jns.map(j=>{
        const total = ks.filter(k=>k.jenisId===j.id).reduce((s,k)=>s+k.lembar,0);
        return `<div class="stat-box"><div class="n">${total} lembar</div><div class="l">${j.nama}<br><span class="sub">${rupiah(nilaiSahamPerLembar(j))}/lbr &middot; Nilai ${rupiah(total*nilaiSahamPerLembar(j))}</span></div></div>`;
      }).join('')}
    </div>
    <div class="section-label">Pemilik saham (${daftarPemilik.length})</div>
    <div class="card" style="padding:6px 18px;">
      ${daftarPemilik.length ? daftarPemilik.map((nama,i)=>{

async function submitPengajuanKoor(){
  const userId = document.getElementById('pemb-user').value;
  const jumlah = parseIdr(document.getElementById('pemb-jumlah').value);
  const tenor = parseIdr(document.getElementById('pemb-tenor').value);
  const atur = DB.koperasi.aturKeuangan||{};
  const mMin = atur.marginNominal||50000, mMax = atur.marginMaxNominal||200000;
   const mp = parseIdr(document.getElementById('pemb-margin').value)||mMin;
   if(!jumlah || !tenor){ toast('Lengkapi jumlah dan jangka waktu'); return; }
   if(mp < mMin || mp > mMax){ toast('Keuntungan harus antara '+rupiah(mMin)+'-'+rupiah(mMax)); return; }
   const total = jumlah + mp;
   const p = {id:uid('pemb'), userId, jumlahPinjaman:jumlah, tenor, marginPersen:0, marginNominal:mp, angsuranPerBulan: Math.ceil(total/tenor/1000)*1000, mulai: nowISO(), sisaAngsuran:tenor, status:'berjalan', riwayatAngsuran:[], statusPengajuan:'pending'};
  DB.pembiayaan.push(p);
  const btn = document.querySelector('button[onclick="submitPengajuanKoor()"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const result = await persistNow();
  if(!result.ok){
    // Gagal simpan ke server -> batalkan biar tidak "hilang" pas refresh & user tau ada masalah
    DB.pembiayaan = DB.pembiayaan.filter(x=>x.id!==p.id);
    toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek koneksi internet, lalu coba lagi'));
    if(btn){ btn.disabled = false; btn.textContent = 'Ajukan'; }
    renderContent();
    return;
  }
   addLog('Ajukan pembiayaan', userById(userId).nama + ' - ' + rupiah(jumlah) + ' / ' + tenor + ' bulan (keuntungan '+rupiah(mp)+')');
  notifAdminWA(waHeader('PENGISUAN PEMBIAYAAN BARU')
    + waAnggotaInfo(userById(userId))
    + '\nJumlah Pembiayaan : ' + rupiah(jumlah)
    + '\nJangka Waktu : ' + tenor + ' bulan'
    + '\nKeuntungan : ' + rupiah(mp)
+ '\nAngsuran / Bulan : ' + rupiah(Math.ceil(total/tenor/1000)*1000)
     + '\nDiajukan oleh Koordinator : ' + userById(getSession().userId).nama
    + '\nWaktu : ' + waTanggal()
    + waFooter());
  bigSuccess('Pengajuan pembiayaan dikirim, menunggu ACC admin');
  closeModal();
  renderContent();
}

function bayarAngsuranPrompt(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  const angsuranKe = p.tenor - p.sisaAngsuran + 1;
  const totalKew = p.jumlahPinjaman + marginNominalOf(p);
  const totalDibayar = p.riwayatAngsuran.reduce((s,a)=>s+a.jumlah, 0);
  const sisaTagihan = totalKew - totalDibayar;
  const todayStr = new Date().toISOString().slice(0,10);
  openModal(`
    <h3>Bayar Angsuran</h3>
    <div class="card" style="margin-bottom:14px;">
      <div class="list-row"><div class="info"><div class="title">${userById(p.userId).nama}</div><div class="sub">Angsuran ke-${angsuranKe} dari ${p.tenor} &middot; Sisa tagihan ${rupiah(sisaTagihan)}</div></div></div>
    </div>
    <div class="form-row"><label>Jumlah bayar (Rp)</label><input type="number" id="bayar-angsuran-jumlah" min="0" step="5000" value="${Math.min(p.angsuranPerBulan, sisaTagihan)}"></div>
    <div class="form-row"><label>Tanggal bayar</label><input type="date" id="bayar-angsuran-tanggal" max="${todayStr}" value="${todayStr}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="confirmBayarAngsuran('${p.id}')">Konfirmasi bayar</button>
    </div>
  `);
}
async function confirmBayarAngsuran(pembId){
  const jumlah = parseIdr(document.getElementById('bayar-angsuran-jumlah').value);
  if(!jumlah || jumlah<=0){ toast('Masukkan jumlah yang valid'); return; }
  const tglInput = document.getElementById('bayar-angsuran-tanggal').value;
  if(!tglInput){ toast('Pilih tanggal bayar'); return; }
  const now = new Date();
  const [ty,tm,td] = tglInput.split('-').map(Number);
  const tglDate = new Date(ty, tm-1, td, now.getHours(), now.getMinutes(), now.getSeconds());
  if(tglDate > now){ toast('Tanggal tidak boleh di masa depan'); return; }
  const s = getSession();
  const p = DB.pembiayaan.find(x=>x.id===pembId);
  const snapshot = p ? {
    riwayatLen: p.riwayatAngsuran.length,
    sisaAngsuran: p.sisaAngsuran,
    status: p.status,
    setoranLen: DB.setoran.length,
    dana: JSON.parse(JSON.stringify(DB.koperasi.aturKeuangan.dana||{}))
  } : null;
  const r = doBayarAngsuran(pembId, s.userId, jumlah, tglDate.toISOString());
  if(!r.ok){ toast(r.msg); return; }
  const btn = document.querySelector('button[onclick="confirmBayarAngsuran(\''+pembId+'\')"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const result = await persistNow();
  if(!result.ok){
    // Gagal simpan ke server -> batalkan biar tidak "hilang diam-diam" pas refresh & user tau ada masalah
    if(p && snapshot){
      p.riwayatAngsuran.length = snapshot.riwayatLen;
      p.sisaAngsuran = snapshot.sisaAngsuran;
      p.status = snapshot.status;
      DB.setoran.length = snapshot.setoranLen;
      DB.koperasi.aturKeuangan.dana = snapshot.dana;
    }
    toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek koneksi internet, lalu coba lagi'));
    if(btn){ btn.disabled = false; btn.textContent = 'Konfirmasi bayar'; }
    renderContent();
    return;
  }
  bigSuccess('Angsuran berhasil dicatat');
  closeModal();
  renderContent();
}

function renderNasTabungan(user){
  const accs = userAccounts(user.id);
  if(!accs.length){
    return `
      <div class="page-title">Buku Tabungan<span class="sub">${user.nama}</span></div>
      <div class="hint">Belum ada rekening tabungan yang dibuka.</div>
    `;
  }
  const activeJenisId = currentSubState.tabJenisId && accs.some(x=>x.j.id===currentSubState.tabJenisId)
    ? currentSubState.tabJenisId
    : accs[0].j.id;
  currentSubState.tabJenisId = activeJenisId;
  const selected = accs.find(x=>x.j.id===activeJenisId) || accs[0];
  const tx = txForUser(user.id).filter(t=>t.jenisId===activeJenisId);
  return `
    <div class="page-title">Buku Tabungan<span class="sub">${user.nama}</span></div>
    ${accs.length>1 ? `<div class="tabs">${accs.map(({j})=>`<button class="${j.id===activeJenisId?'active':''}" onclick="currentSubState.tabJenisId='${j.id}'; renderContent()">${j.nama}</button>`).join('')}</div>` : ''}
    <div class="hero-balance">
      <div class="greet">Saldo ${selected.j.nama}</div>
      <div class="amount">${rupiah(selected.acc.saldo)}</div>
      <div class="rekening">NO. REK ${selected.acc.noRekening || user.noRekening}</div>
    </div>
    <div class="section-label" style="margin-top:0;">Riwayat transaksi &middot; ${selected.j.nama}</div>
    <div class="card" style="padding:2px 16px;">
      ${tx.length ? tx.map(t=>`
        <div class="tx-list-item">
          <div class="tx-ic ${t.tipe==='setor'?'in':'out'}">${t.tipe==='setor'?ICONS.down:ICONS.up}</div>
          <div class="tx-info"><div class="t">${jenisName(t.jenisId)}</div><div class="s">${fmtDateShort(t.tanggal)} &middot; ${t.tipe==='setor'?'Setor':'Tarik'}</div></div>
          <div class="tx-amt ${t.tipe==='setor'?'plus':'minus'}">${t.tipe==='setor'?'+':'-'}${rupiah(t.jumlah)}</div>

function renderNasPembiayaan(user){
  const list = pembiayaanForUser(user.id);
  if(!list.length){
    return `
      <div class="page-title">Pembiayaan<span class="sub">${user.nama}</span></div>
      <div class="empty-state"><div class="ic">📄</div><div class="t">Belum ada pembiayaan</div><div class="d">Hubungi koordinator kelompok untuk mengajukan pembiayaan.</div></div>
    `;
  }
  return `
    <div class="page-title">Pembiayaan<span class="sub">${user.nama}</span></div>
    ${list.map(p=>{
      const totalKew = p.jumlahPinjaman + marginNominalOf(p);
      const totalDibayar = (p.riwayatAngsuran||[]).reduce((a,x)=>a+x.jumlah,0);
      const sisaTagihan = Math.max(totalKew - totalDibayar, 0);
      return `
      <div class="card">
        <div class="flex-between" style="margin-bottom:10px;">
          <div><div style="font-weight:700;font-size:16px;">${rupiah(p.jumlahPinjaman)}</div><div class="hint">Mulai ${fmtDateShort(p.mulai)}</div></div>
          <span class="badge ${pembBadge(p).cls}">${pembBadge(p).label}</span>
        </div>
        <div class="bar-row"><div class="lbl"><span>Progres angsuran</span><span>${p.tenor-p.sisaAngsuran}/${p.tenor}</span></div><div class="bar-track"><div class="bar-fill" style="width:${((p.tenor-p.sisaAngsuran)/p.tenor*100).toFixed(0)}%"></div></div></div>
        <div class="portfolio-grid" style="grid-template-columns:1fr 1fr;margin-top:12px;margin-bottom:0;">
          <div class="portfolio-box"><div class="v">${rupiah(p.angsuranPerBulan)}</div><div class="l">Per bulan</div></div>
          <div class="portfolio-box"><div class="v">${rupiah(sisaTagihan)}</div><div class="l">Sisa tagihan</div></div>
        </div>
        ${p.riwayatAngsuran.length ? `
          <div class="section-label">Riwayat angsuran</div>
          ${p.riwayatAngsuran.map(a=>`
            <div class="tx-list-item">
              <div class="tx-ic out">${ICONS.up}</div>
              <div class="tx-info"><div class="t">Angsuran ke-${a.angsuranKe}</div><div class="s">${fmtDateShort(a.tanggal)}</div></div>
              <div class="tx-amt minus">-${rupiah(a.jumlah)}</div>
            </div>
          `).join('')}
        ` : ''}
      </div>
    `;}).join('')}
  `;
}

let deferredPrompt = null;
const installOverlay = document.getElementById('install-overlay');
const installBtn = document.getElementById('install-btn');
const installSkip = document.getElementById('install-skip');
const installIcon = document.getElementById('install-icon');
const installTitle = document.getElementById('install-title');

window.addEventListener('beforeinstallprompt', e => {
  if (localStorage.getItem('pwa-skip') === '1') return;
  e.preventDefault();
  deferredPrompt = e;
  if (installIcon && DB.koperasi) {
    if (DB.koperasi.iconImage) installIcon.innerHTML = '<img src="'+DB.koperasi.iconImage+'" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">';
    else installIcon.textContent = DB.koperasi.icon || '🏦';
  }
  if (installTitle && DB.koperasi) installTitle.textContent = DB.koperasi.nama || 'UB Rukun Barokah';
  installOverlay.style.display = 'flex';
});

if (installBtn) installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installOverlay.style.display = 'none';
});

if (installSkip) installSkip.addEventListener('click', () => {
  installOverlay.style.display = 'none';
  localStorage.setItem('pwa-skip', '1');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* =========================================================
   CUSTOM SEARCHABLE SELECT (auto-enhances every <select>)
========================================================= */
(function(){
  const SEARCH_THRESHOLD = 7; // tampilkan kotak cari kalau opsi lebih dari ini
  const CHEVRON = '<svg class="csel-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  const SEARCH_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
  const CHECK_ICON = '<svg class="csel-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  let activeOverlay = null;

  function closeActive(){
    if(activeOverlay){ activeOverlay.remove(); activeOverlay=null; document.body.style.overflow=''; }
    document.querySelectorAll('.csel-trigger.csel-open').forEach(t=>t.classList.remove('csel-open'));
  }

  function titleFor(sel){
    const row = sel.closest('.form-row');
    if(row){
      const lbl = row.querySelector('label');
      if(lbl && lbl.textContent.trim()) return lbl.textContent.trim();
    }
    return 'Pilih';
  }

  function syncTrigger(sel, trigger){
    const opt = sel.options[sel.selectedIndex];
    const txt = trigger.querySelector('.csel-trigger-text');
    const label = opt ? opt.textContent.trim() : '';
    txt.textContent = label || 'Pilih...';
    trigger.classList.toggle('csel-placeholder', !label);
    const isDisabled = sel.disabled || sel.options.length===0;
    trigger.classList.toggle('csel-disabled', isDisabled);
    trigger.disabled = isDisabled;
  }

  function openPanel(sel, trigger){
    closeActive();
    trigger.classList.add('csel-open');
    const showSearch = sel.options.length > SEARCH_THRESHOLD;

    const overlay = document.createElement('div');
    overlay.className = 'csel-overlay';
    const sheet = document.createElement('div');
    sheet.className = 'csel-sheet';
    sheet.innerHTML =
      '<div class="csel-sheet-head"><div class="csel-sheet-title"></div><button type="button" class="csel-close" aria-label="Tutup">&times;</button></div>' +
      (showSearch ? '<div class="csel-search-wrap">'+SEARCH_ICON+'<input type="text" class="csel-search" placeholder="Cari..." autocomplete="off"></div>' : '') +
      '<div class="csel-list"></div>';
    sheet.querySelector('.csel-sheet-title').textContent = titleFor(sel);
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
    document.body.style.overflow = 'hidden';
    activeOverlay = overlay;

    const listEl = sheet.querySelector('.csel-list');

    function renderList(filter){
      const f = (filter||'').trim().toLowerCase();
      listEl.innerHTML = '';
      let any = false;
      Array.from(sel.options).forEach(o=>{
        const label = o.textContent.trim();
        if(f && !label.toLowerCase().includes(f)) return;
        any = true;
        const item = document.createElement('div');
        item.className = 'csel-item' + (o.disabled ? ' csel-item-disabled' : '') + (o.index===sel.selectedIndex ? ' csel-item-active' : '');
        const span = document.createElement('span');
        span.textContent = label || '(kosong)';
        item.appendChild(span);
        if(o.index===sel.selectedIndex) item.insertAdjacentHTML('beforeend', CHECK_ICON);
        if(!o.disabled){
          item.addEventListener('click', ()=>{
            if(sel.selectedIndex !== o.index){
              sel.selectedIndex = o.index;
              sel.dispatchEvent(new Event('change', {bubbles:true}));
            }
            syncTrigger(sel, trigger);
            closeActive();
          });
        }
        listEl.appendChild(item);
      });
      if(!any) listEl.innerHTML = '<div class="csel-empty">Tidak ditemukan</div>';
    }
    renderList('');

    overlay.addEventListener('click', e=>{ if(e.target===overlay) closeActive(); });
    sheet.querySelector('.csel-close').addEventListener('click', closeActive);
    if(showSearch){
      const search = sheet.querySelector('.csel-search');
      search.addEventListener('input', ()=>renderList(search.value));
      setTimeout(()=>search.focus(), 60);
    }
  }

  function enhance(sel){
    if(!sel || sel.tagName!=='SELECT' || sel.dataset.cselDone || sel.multiple) return;
    sel.dataset.cselDone = '1';

    const wrap = document.createElement('div');
    wrap.className = 'csel';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    sel.classList.add('csel-native');
    sel.tabIndex = -1;

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'csel-trigger';
    trigger.innerHTML = '<span class="csel-trigger-text"></span>' + CHEVRON;
    wrap.appendChild(trigger);

    syncTrigger(sel, trigger);
    trigger.addEventListener('click', ()=>{
      if(sel.disabled || sel.options.length===0) return;
      openPanel(sel, trigger);
    });

    sel.addEventListener('change', ()=>syncTrigger(sel, trigger));
    // opsi select bisa diganti ulang lewat kode lain (innerHTML) -> pantau perubahan
    new MutationObserver(()=>syncTrigger(sel, trigger)).observe(sel, {childList:true, attributes:true, attributeFilter:['disabled']});
  }

  function scan(root){
    if(!root || !root.querySelectorAll) return;
    root.querySelectorAll('select').forEach(enhance);
  }

  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeActive(); });

  scan(document);
  new MutationObserver(muts=>{
    muts.forEach(m=>{
      m.addedNodes.forEach(n=>{
        if(n.nodeType!==1) return;
        if(n.tagName==='SELECT') enhance(n);
        else scan(n);
      });
    });
  }).observe(document.body, {childList:true, subtree:true});
})();

/* keep --header-h in sync with the real rendered height of .app-header,
   so sticky elements below it (search box, toolbar) stick right under it
   instead of at top:0 (which would hide behind the header). */
(function(){
  const headerEl = document.querySelector('.app-header');
  if(!headerEl) return;
  function syncHeaderHeight(){
    document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
  }
  syncHeaderHeight();
  window.addEventListener('resize', syncHeaderHeight);
  new ResizeObserver(syncHeaderHeight).observe(headerEl);
})();
