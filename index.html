// ---- Transform snake_case (DB Supabase) ke camelCase (JS) ----
function toCamel(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toCamel);
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    const ck = k.replace(/_([a-z])/g, (_, l) => l.toUpperCase());
    out[ck] = toCamel(v);
  }
  return out;
}

async function loadDB(){
  try {
    const [
      usersRes, anggotaRes, kelompokRes, jenisTabunganRes, tabunganAccountsRes, tabunganTxRes,
      pembiayaanRes, angsuranRes, jenisSahamRes, kepemilikanSahamRes, pengaturanRes,
      setoranRes, logsRes, kasPenarikanKoorRes, hutangKoordinatorRes
    ] = await Promise.all([
      supabaseClient.from(TABLES.users).select('*'),
      supabaseClient.from(TABLES.anggota).select('*'),
      supabaseClient.from(TABLES.kelompok).select('*'),
      supabaseClient.from(TABLES.jenis_tabungan).select('*'),
      supabaseClient.from(TABLES.tabungan_accounts).select('*'),
      supabaseClient.from(TABLES.tabungan_tx).select('*'),
      supabaseClient.from(TABLES.pembiayaan).select('*'),
      supabaseClient.from(TABLES.angsuran).select('*'),
      supabaseClient.from(TABLES.jenis_saham).select('*'),
      supabaseClient.from(TABLES.kepemilikan_saham).select('*'),
      supabaseClient.from(TABLES.pengaturan_koperasi).select('*').eq('id','koperasi').maybeSingle(),
      supabaseClient.from(TABLES.setoran).select('*'),
      supabaseClient.from(TABLES.logs).select('*').order('created_at',{ascending:false}).limit(100),
      supabaseClient.from(TABLES.kas_penarikan_koor).select('*'),
      supabaseClient.from(TABLES.hutang_koordinator).select('*')
    ]);

    const U = toCamel(usersRes.data||[]);
    const A = toCamel(anggotaRes.data||[]);
    const K = toCamel(kelompokRes.data||[]);
    const JT = toCamel(jenisTabunganRes.data||[]);
    const TA = toCamel(tabunganAccountsRes.data||[]);
    const TTX = toCamel(tabunganTxRes.data||[]);
    const PB = toCamel(pembiayaanRes.data||[]);
    const AN = toCamel(angsuranRes.data||[]);
    const JS = toCamel(jenisSahamRes.data||[]);
    const KS = toCamel(kepemilikanSahamRes.data||[]);
    const PG = toCamel(pengaturanRes.data);
    const ST = toCamel(setoranRes.data||[]);
    const LG = toCamel(logsRes.data||[]);
    const KPK = toCamel(kasPenarikanKoorRes.data||[]);
    const HK = toCamel(hutangKoordinatorRes.data||[]);

    // Index bantu
    const aggById = {}; A.forEach(x=>aggById[x.id]=x);
    const kelById = {}; K.forEach(x=>kelById[x.id]=x);
    const koorOfKel = {}; K.forEach(x=>{ if(x.koorId) koorOfKel[x.id]=x.koorId; });

    // ---- USERS: gabung akun login (users) + data anggota (anggota) ----
    const matchedAggIds = new Set();
    const users = U.map(usr=>{
      const agg = usr.anggotaId ? aggById[usr.anggotaId] : null;
      if(agg) matchedAggIds.add(agg.id);
      const kelId = agg ? agg.kelompokId : null;
      const koordinatorId = kelId ? (koorOfKel[kelId]||null) : null;
      // koordinator: cari kelompok yang dipimpinnya
      if(usr.role==='koordinator'){
        const kel = K.find(x=>x.koorId===usr.id);
        return {
          id:usr.id, username:usr.username, password:usr.password, role:usr.role, nama:usr.nama,
          status:'aktif', avatar:'🧑🏽‍💼', kelompok_id: kel?kel.id:null, koordinator_id:null,
          no_rekening:null, nik:null, no_hp:null, alamat:null, wilayah: kel?kel.nama:null
        };
      }
      return {
        id:usr.id, username:usr.username, password:usr.password, role:usr.role, nama:usr.nama,
        status:(agg&&agg.status)||'aktif', avatar: usr.role==='nasabah'?'👨🏽':'👩🏻‍💼',
        kelompok_id: kelId, koordinator_id: koordinatorId,
        no_rekening:(agg&&agg.noRekening)||null, nik:(agg&&agg.nik)||null,
        no_hp:(agg&&agg.noHp)||null, alamat:(agg&&agg.alamat)||null,
        wilayah: kelId ? (kelById[kelId]&&kelById[kelId].nama) : null
      };
    });
    // anggota tanpa akun login tetap tampil di daftar
    A.forEach(agg=>{
      if(matchedAggIds.has(agg.id)) return;
      const kelId = agg.kelompokId;
      users.push({
        id:agg.id, username:null, password:null, role:'nasabah', nama:agg.nama,
        status:agg.status||'aktif', avatar:'👨🏽', kelompok_id:kelId,
        koordinator_id: kelId?(koorOfKel[kelId]||null):null,
        no_rekening:agg.noRekening||null, nik:agg.nik||null, no_hp:agg.noHp||null,
        alamat:agg.alamat||null, wilayah: kelId?(kelById[kelId]&&kelById[kelId].nama):null,
        _noAkun:true
      });
    });

    // ---- JENIS ----
    const jenis_tabungan = JT.map(j=>({
      id:j.id, nama:j.nama,
      akad: /wadi|titip/i.test(j.nama) ? 'wadiah' : 'mudharabah',
      nisbah_anggota:0, setoran_min:Number(j.wajibMinimal)||0, keterangan:''
    }));
    const jenis_saham = JS.map(j=>({ id:j.id, nama:j.nama, nilai_lembar:Number(j.nominalPerLembar)||0, keterangan:'' }));
    const jenis_pembiayaan = [];

    // ---- TABUNGAN ----
    const tabungan = TA.map(t=>({
      id:t.id, anggota_id:t.userId, jenis_id:t.jenisId, saldo:Number(t.saldo)||0, no_rekening:t.noRekening||null
    }));
    const transaksi_tabungan = TTX.map(t=>({
      id:t.id, anggota_id:t.userId, jenis_id:t.jenisId, tipe:t.tipe,
      jumlah:Number(t.jumlah)||0, via:/koor/i.test(t.oleh||'')?'koordinator':'admin',
      koordinator_id:null, status:'selesai', keterangan:t.keterangan||'', tanggal:t.tanggal||null
    }));

    // ---- SAHAM (kepemilikan_saham; pasangkan ke anggota lewat nama bila anggota_id kosong) ----
    const byNama = {};
    users.concat(A).forEach(x=>{ const nm=(x.nama||'').trim().toLowerCase(); if(nm && !byNama[nm]) byNama[nm]=x.id; });
    const saham = KS.map(k=>({
      id:k.id, anggota_id:k.anggotaId || byNama[(k.nama||'').trim().toLowerCase()] || null,
      jenis_id:k.jenisId, lembar:Number(k.lembar)||0, kelompok_id:k.kelompokId||null
    }));

    // ---- PEMBIAYAAN ----
    const pembiayaan = PB.map(p=>{
      const plafon = Number(p.jumlahPinjaman)||0;
      const margin = p.marginNominal!=null ? Number(p.marginNominal) : Math.round(plafon*(Number(p.marginPersen)||0)/100);
      const riwayat = Array.isArray(p.riwayatAngsuran) ? p.riwayatAngsuran : [];
      const total = plafon + margin;
      const sisaAngsuran = Number(p.sisaAngsuran);
      const paidCount = riwayat.length>0 ? riwayat.length : (isNaN(sisaAngsuran)?0:Math.max(0,(Number(p.tenor)||1)-sisaAngsuran));
      const terbayar = riwayat.length>0 ? riwayat.reduce((s,r)=>s+(Number(r.jumlah)||0),0) : paidCount*(Number(p.angsuranPerBulan)||0);
      const pj = p.statusPengajuan;
      let status;
      if(pj==='pending') status='pending';
      else if(pj==='ditolak'||pj==='rejected') status='ditolak';
      else if(p.status==='ditolak'||p.status==='macet') status='ditolak';
      else status = p.status==='lunas'?'lunas':'berjalan';
      return {
        id:p.id, anggota_id:p.userId, jenis_id:null, plafon, tenor:Number(p.tenor)||1,
        sisa:Math.max(0,total-terbayar), status, tanggal:p.mulai||p.createdAt||null,
        marginNominal:margin, angsuranPerBulan:p.angsuranPerBulan||null,
        riwayat:riwayat.slice(), statusPengajuan:pj||'approved',
        disetujuiOleh:p.disetujuiOleh||null, waktuAcc:p.waktuAcc||null,
        ditolakOleh:p.ditolakOleh||null, waktuTolak:p.waktuTolak||null,
        pengaju: p.createdBy==='koordinator'?'koordinator':null, createdBy:p.createdBy||null,
        createdAt:p.createdAt||null, keterangan:p.keterangan||null, _marginPersen:p.marginPersen||0,
        _angsuranBase: isNaN(sisaAngsuran)?null:sisaAngsuran
      };
    });

    // ---- TRANSAKSI PEMBIAYAAN (riwayat_angsuran + tabel angsuran) ----
    const transaksi_pembiayaan = [];
    pembiayaan.forEach(p=>{
      p.riwayat.forEach(r=>{
        transaksi_pembiayaan.push({ id:'tp_'+p.id+'_'+(r.angsuranKe||'x'), pembiayaan_id:p.id, jumlah:Number(r.jumlah)||0, tanggal:r.tanggal||p.tanggal||null });
      });
    });
    AN.forEach(r=>{
      if(!transaksi_pembiayaan.some(t=>t.pembiayaan_id===r.pembiayaanId && t.id===r.id)){
        transaksi_pembiayaan.push({ id:r.id, pembiayaan_id:r.pembiayaanId, jumlah:Number(r.jumlah)||0, tanggal:r.tanggal||null });
      }
    });

    // ---- KAS KOORDINATOR (perkiraan dari setoran di_koordinator - kas_penarikan_koor) ----
    const kas_koordinator = {};
    ST.forEach(r=>{
      const nas = users.find(x=>x.id===r.userId && x.role==='nasabah');
      if(!nas || !nas.koordinator_id) return;
      if(r.status==='di_koordinator') kas_koordinator[nas.koordinator_id]=(kas_koordinator[nas.koordinator_id]||0)+(Number(r.jumlah)||0);
    });
    KPK.forEach(r=>{
      const korId = r.koordinatorId;
      if(korId) kas_koordinator[korId]=(kas_koordinator[korId]||0)-(Number(r.jumlah)||0);
    });

    // ---- HUTANG ----
    const hutang = HK.map(h=>({
      id:h.id, koordinator_id:h.koordinatorId||h.koordinator_id, jumlah:Number(h.jumlah)||0,
      jenis:h.jenis||'', keterangan:h.keterangan||'', status:h.status||'belum_lunas', tanggal:h.tanggal||null
    }));

    // ---- LOG ----
    const log = LG.map(l=>({ id:l.id, user:l.oleh||'-', role:l.peran||'-', aksi:l.aksi, tanggal:l.waktu||l.createdAt||null }));

    // ---- PENGATURAN ----
    const atur = (PG&&PG.aturKeuangan&&typeof PG.aturKeuangan==='object')?PG.aturKeuangan:{};
    const info = (PG&&PG.info&&typeof PG.info==='object')?PG.info:{};
    const pengaturan = {
      nama_koperasi:(PG&&PG.nama)||'Koperasi UB Rukun Barokah',
      alamat:info.alamat||'', telp:info.telp||'', tahun_buku:'2026',
      biaya_admin_tabungan:0, denda_telat_persen:1, cadangan_koperasi:0,
      pendapatan_lain:0, beban_operasional:0, beban_lain:0, shu_tahun_berjalan:0,
      persen_shu_saham:40, persen_shu_tabungan:30,
      margin_min: atur.marginNominal!=null?Number(atur.marginNominal):50000,
      margin_max: atur.marginMaxNominal!=null?Number(atur.marginMaxNominal):200000
    };

    _pembIds = new Set(pembiayaan.map(p=>p.id));
    _angsuranBase = {};
    pembiayaan.forEach(p=>{ if(p._angsuranBase!=null) _angsuranBase[p.id]=p._angsuranBase; });
    _paidThisSession = {};

    return {
      users, jenis_tabungan, jenis_saham, jenis_pembiayaan,
      tabungan, saham, pembiayaan, transaksi_tabungan, transaksi_pembiayaan,
      kas_koordinator, hutang, notifikasi: [], log, pengaturan
    };
  }catch(err){
    console.error('Gagal load dari Supabase, memakai seed lokal:', err);
    return seedDB();
  }
}

let _saveTimer = null;
let _saving = false;
async function doSaveDB(){
  if(_saving) return;
  _saving = true;
  try {
    if(_pembDirty){ await syncPembiayaan(); _pembDirty = false; }
    await syncLogs();
  }catch(e){ console.error('saveDB exception:', e); }
  finally { _saving = false; }
}
function saveDB(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(doSaveDB, 400);
}

async function syncPembiayaan(){
  const rows = (DB.pembiayaan||[]).map(p=>{
    const plafon = Number(p.plafon)||0;
    const tenor = Math.max(1, Number(p.tenor)||1);
    const margin = marginNominalOf(p);
    const riwayat = (DB.transaksi_pembiayaan||[])
      .filter(t=>t.pembiayaan_id===p.id)
      .slice().sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1)
      .map((t,i)=>({angsuranKe:i+1, jumlah:Number(t.jumlah)||0, tanggal:t.tanggal||nowISO()}));
    let status, statusPengajuan;
    if(p.status==='pending'){ status='berjalan'; statusPengajuan='pending'; }
    else if(p.status==='ditolak'){ status='ditolak'; statusPengajuan='ditolak'; }
    else { status = p.status==='lunas'?'lunas':'berjalan'; statusPengajuan='approved'; }
    const base = p._angsuranBase!=null ? Number(p._angsuranBase) : tenor;
    return {
      id:p.id, user_id:p.anggota_id, jumlah_pinjaman:plafon, tenor,
      margin_persen: Number(p._marginPersen)||0, margin_nominal:margin,
      angsuran_per_bulan: p.angsuranPerBulan || Math.ceil((plafon+margin)/tenor),
      sisa_angsuran: Math.max(0, base - (Number(_paidThisSession[p.id])||0)),
      status, status_pengajuan:statusPengajuan,
      keterangan: p.keterangan||null,
      mulai: (p.tanggal||nowISO()).split('T')[0],
      riwayat_angsuran: riwayat,
      disetujui_oleh: p.disetujuiOleh||null, waktu_acc:p.waktuAcc||null,
      ditolak_oleh: p.ditolakOleh||null, waktu_tolak:p.waktuTolak||null,
      created_by: p.pengaju==='koordinator' ? (p.createdBy||'koordinator') : (p.createdBy||null),
      created_at: p.createdAt || nowISO()
    };
  });
  if(rows.length){
    const { error } = await supabaseClient.from(TABLES.pembiayaan).upsert(rows,{onConflict:'id'});
    if(error) console.error('sync pembiayaan error:', error);
  }
  // tabel angsuran
  const angRows = (DB.transaksi_pembiayaan||[]).map(t=>{
    const ke = (DB.transaksi_pembiayaan||[])
      .filter(x=>x.pembiayaan_id===t.pembiayaan_id && (x.tanggal||'')<=(t.tanggal||''))
      .length;
    return { id:t.id, pembiayaan_id:t.pembiayaan_id, angsuran_ke:ke, jumlah:Number(t.jumlah)||0, tanggal:t.tanggal||nowISO(), status:'lunas' };
  });
  if(angRows.length){
    const { error } = await supabaseClient.from(TABLES.angsuran).upsert(angRows,{onConflict:'id'});
    if(error) console.error('sync angsuran error:', error);
  }
  // hapus pembiayaan yang dihapus di aplikasi
  const removed = [..._pembIds].filter(id=>!(DB.pembiayaan||[]).some(p=>p.id===id));
  for(const id of removed){
    try {
      await supabaseClient.from(TABLES.pembiayaan).delete().eq('id',id);
      await supabaseClient.from(TABLES.angsuran).delete().eq('pembiayaan_id',id);
    }catch(e){ console.error('hapus pembiayaan error:', e); }
  }
  _pembIds = new Set([...(DB.pembiayaan||[]).map(p=>p.id), ..._pembIds]);
}

async function syncLogs(){
  const rows = (DB.log||[]).filter(l=>_sessionLogIds.has(l.id)).map(l=>({
    id:l.id, aksi:l.aksi, detail:null, waktu:l.tanggal||nowISO(), oleh:l.user||'Sistem', peran:l.role||'-'
  }));
  if(!rows.length) return;
  const { error } = await supabaseClient.from(TABLES.logs).upsert(rows,{onConflict:'id'});
  if(error) console.error('sync logs error:', error);
}

/* ---------- HELPERS: lookups ---------- */
function userById(id){ return DB.users.find(u=>u.id===id); }

function koordinatorList(){ return DB.users.filter(u=>u.role==='koordinator'); }
function jt(id){ return DB.jenis_tabungan.find(j=>j.id===id); }
function jsx(id){ return DB.jenis_saham.find(j=>j.id===id); }
function jp(id){ return DB.jenis_pembiayaan.find(j=>j.id===id); }
function tabunganNasabah(uidd){ return DB.tabungan.filter(t=>t.anggota_id===uidd); }
function sahamNasabah(uidd){ return DB.saham.filter(s=>s.anggota_id===uidd); }
function pembiayaanNasabah(uidd){ return DB.pembiayaan.filter(p=>p.anggota_id===uidd); }
function totalTabunganKoperasi(){ return DB.tabungan.reduce((a,t)=>a+t.saldo,0); }
function totalSahamKoperasi(){ return DB.saham.reduce((a,s)=>a + s.lembar*(jsx(s.jenis_id)?.nilai_lembar||0),0); }
function totalPembiayaanOutstanding(){ return DB.pembiayaan.filter(p=>p.status==='berjalan').reduce((a,p)=>a+p.sisa,0); }
function totalHutangBelumLunas(){ return DB.hutang.filter(h=>h.status==='belum_lunas').reduce((a,h)=>a+h.jumlah,0); }
function nextNoRekening(){
  const nums = DB.users.filter(u=>u.no_rekening).map(u=>parseInt(String(u.no_rekening).replace(/\D/g,''),10)||0);
  const next = (nums.length? Math.max(...nums) : 0) + 1;
  return 'RB' + String(next).padStart(4,'0');
}
function marginNominalOf(p){
  if(p && p.marginNominal != null) return Math.round(Number(p.marginNominal)||0);
  const j = jp(p.jenis_id);
  return Math.round((p.plafon||0) * ((j?.margin)||0) / 100);
}
function pembNama(p){
  return (jp(p && p.jenis_id)?.nama) || 'Pembiayaan';
}
function angsuranPerBulanOf(p){
  if(p && p.angsuranPerBulan) return p.angsuranPerBulan;
  if(!p || !p.tenor) return 0;
  return Math.ceil(((p.plafon||0) + marginNominalOf(p)) / p.tenor);
}
function angsuranTerbayarCount(p){ return DB.transaksi_pembiayaan.filter(t=>t.pembiayaan_id===p.id).length; }
function pembBadge(p){
  if(p.status==='pending') return {cls:'badge-gold', label:'Menunggu ACC'};
  if(p.status==='ditolak') return {cls:'badge-red', label:'Ditolak'};
  if(p.status==='lunas') return {cls:'badge-green', label:'Lunas'};
  return {cls:'badge-gold', label:'Berjalan'};
}

function akadLabel(akad){

}
function totalTabunganByAkad(akad){
  return DB.tabungan.reduce((a,t)=>{ const j=jt(t.jenis_id); return j && j.akad===akad ? a+t.saldo : a; },0);
}
function tabunganNasabahByAkad(uidd, akad){
  return DB.tabungan.filter(t=>t.anggota_id===uidd).reduce((a,t)=>{ const j=jt(t.jenis_id); return j && j.akad===akad ? a+t.saldo : a; },0);
}

/* ---------- PHU (PERHITUNGAN HASIL USAHA / LABA RUGI) ---------- */
function pendapatanMarginPembiayaan(){
  return DB.pembiayaan.filter(p=>['berjalan','lunas'].includes(p.status)).reduce((a,p)=>a+marginNominalOf(p),0);
}
function computePHU(){
  const p = DB.pengaturan;
  const pendapatanMargin = pendapatanMarginPembiayaan();
  const pendapatanLain = Number(p.pendapatan_lain)||0;
  const totalPendapatan = pendapatanMargin + pendapatanLain;
  const bebanOperasional = Number(p.beban_operasional)||0;
  const bebanLain = Number(p.beban_lain)||0;
  const totalBeban = bebanOperasional + bebanLain;
  const shu = totalPendapatan - totalBeban;
  return { pendapatanMargin, pendapatanLain, totalPendapatan, bebanOperasional, bebanLain, totalBeban, shu };
}

/* ---------- SHU (SISA HASIL USAHA) — SAHAM & TABUNGAN ---------- */
function computeSHUDistribution(){
  const p = DB.pengaturan;
  const shuTotal = Number(p.shu_tahun_berjalan)||0;
  const persenSaham = Number(p.persen_shu_saham)||0;
  const persenTabungan = Number(p.persen_shu_tabungan)||0;
  const poolSaham = shuTotal * persenSaham/100;
  const poolTabungan = shuTotal * persenTabungan/100;
  const totalSaham = totalSahamKoperasi();
  const totalTabMudharabah = totalTabunganByAkad('mudharabah');
  const list = anggotaList().map(a=>{
    const nilaiSaham = sahamNasabah(a.id).reduce((s,x)=>s+x.lembar*(jsx(x.jenis_id)?.nilai_lembar||0),0);
    const saldoMudharabah = tabunganNasabahByAkad(a.id,'mudharabah');
    const shuSaham = totalSaham>0 ? (nilaiSaham/totalSaham)*poolSaham : 0;
    const shuTabungan = totalTabMudharabah>0 ? (saldoMudharabah/totalTabMudharabah)*poolTabungan : 0;
    return { anggota:a, nilaiSaham, saldoMudharabah, shuSaham, shuTabungan, total: shuSaham+shuTabungan };
  }).filter(r=>r.nilaiSaham>0 || r.saldoMudharabah>0);
  return { shuTotal, poolSaham, poolTabungan, persenSaham, persenTabungan, totalSaham, totalTabMudharabah, list,
    sisaCadangan: shuTotal - poolSaham - poolTabungan };
}

// SETOR TABUNGAN
function setorTabungan(anggotaId, jenisId, jumlah, via, keterangan){
  jumlah = Number(jumlah);
  let tb = DB.tabungan.find(t=>t.anggota_id===anggotaId && t.jenis_id===jenisId);
  if(!tb){ tb = {id:uid('tb_'), anggota_id:anggotaId, jenis_id:jenisId, saldo:0}; DB.tabungan.push(tb); }
  tb.saldo += jumlah;

  const nasabah = userById(anggotaId);
  const status = via==='koordinator' ? 'dipegang_koordinator' : 'selesai';
  const trx = {id:uid('tt_'), anggota_id:anggotaId, jenis_id:jenisId, tipe:'setor', jumlah, via,
    koordinator_id: via==='koordinator' ? nasabah.koordinator_id : null,
    status, keterangan: keterangan||'', tanggal: nowISO()};
  DB.transaksi_tabungan.unshift(trx);

  if(via==='koordinator'){
    DB.kas_koordinator[nasabah.koordinator_id] = (DB.kas_koordinator[nasabah.koordinator_id]||0) + jumlah;
    const kor = userById(nasabah.koordinator_id);
    notify('admin', 'Setoran dipegang koordinator',
      `${kor.nama} sedang membawa dana setoran ${rp(jumlah)} dari ${nasabah.nama} (${jt(jenisId)?.nama}), belum disetor ke koperasi.`, 'setoran');
  }
  addLog(`Setor ${jt(jenisId)?.nama} ${rp(jumlah)} a.n ${nasabah.nama} (${via==='koordinator'?'via koordinator':'langsung ke admin'})`);
  saveDB();
}

// Koordinator menyerahkan kas yang dipegang ke admin
function koordinatorSetorKeAdmin(korId, jumlah){
  jumlah = Number(jumlah);
  DB.kas_koordinator[korId] = Math.max(0,(DB.kas_koordinator[korId]||0) - jumlah);
  DB.transaksi_tabungan.filter(t=>t.koordinator_id===korId && t.status==='dipegang_koordinator')
    .forEach(t=>{ t.status='selesai'; });
  const kor = userById(korId);
  notify('admin', 'Koordinator menyetorkan kas',
    `${kor.nama} menyerahkan ${rp(jumlah)} hasil setoran nasabah ke koperasi. Mohon dikonfirmasi.`, 'setoran');
  addLog(`${kor.nama} menyerahkan kas ${rp(jumlah)} ke admin`);
  saveDB();
}

// Koordinator TALANGI penarikan (bayar dulu dari kantong sendiri) -> admin berhutang ke koordinator
function koordinatorTalangi(trxId){
  const trx = DB.transaksi_tabungan.find(t=>t.id===trxId); if(!trx) return;
  const tb = DB.tabungan.find(t=>t.anggota_id===trx.anggota_id && t.jenis_id===trx.jenis_id);
  if(tb) tb.saldo -= trx.jumlah;
  trx.status = 'selesai_ditalangi';
  const kor = userById(trx.koordinator_id); const nasabah = userById(trx.anggota_id);
  DB.hutang.unshift({id:uid('ht_'), koordinator_id: trx.koordinator_id, jumlah: trx.jumlah,
    jenis:'admin_hutang_ke_koordinator', keterangan:`Talangan tarik tabungan ${nasabah.nama} (${jt(trx.jenis_id)?.nama})`,
    status:'belum_lunas', tanggal: nowISO(), ref_trx: trx.id});
  notify('admin', 'Koordinator menalangi penarikan',
    `${kor.nama} menalangi tarikan ${rp(trx.jumlah)} untuk ${nasabah.nama}. Koperasi kini berhutang ke ${kor.nama}.`, 'hutang');
  addLog(`${kor.nama} menalangi tarik ${rp(trx.jumlah)} a.n ${nasabah.nama} — tercatat hutang admin ke koordinator`);
  saveDB();
}

// Koordinator TERUSKAN ke admin (tidak menalangi, admin yang cairkan)
function koordinatorTeruskan(trxId){
  const trx = DB.transaksi_tabungan.find(t=>t.id===trxId); if(!trx) return;
  trx.status = 'diteruskan_admin';
  const kor = userById(trx.koordinator_id); const nasabah = userById(trx.anggota_id);

// Admin memproses/mencairkan penarikan langsung
function adminProsesTarik(trxId){
  const trx = DB.transaksi_tabungan.find(t=>t.id===trxId); if(!trx) return;
  const tb = DB.tabungan.find(t=>t.anggota_id===trx.anggota_id && t.jenis_id===trx.jenis_id);
  if(tb) tb.saldo -= trx.jumlah;
  trx.status = 'selesai';
  addLog(`Admin mencairkan tarik ${rp(trx.jumlah)} a.n ${userById(trx.anggota_id)?.nama}`);
  saveDB();
}

// Admin/Koordinator mencatat penarikan yang sudah selesai (tunai langsung saat itu juga)
function catatTarikTabungan(anggotaId, jenisId, jumlah){
  jumlah = Number(jumlah);
  const tb = DB.tabungan.find(t=>t.anggota_id===anggotaId && t.jenis_id===jenisId);
  if(tb) tb.saldo -= jumlah;
  const nasabah = userById(anggotaId);
  const u = currentUser();
  const trx = {id:uid('tt_'), anggota_id:anggotaId, jenis_id:jenisId, tipe:'tarik', jumlah,
    via: u.role==='koordinator' ? 'koordinator' : 'admin',
    koordinator_id: u.role==='koordinator' ? u.id : null,
    status:'selesai', keterangan:'', tanggal: nowISO()};
  DB.transaksi_tabungan.unshift(trx);
  addLog(`${u.role==='admin'?'Admin':'Koordinator'} mencatat tarik ${jt(jenisId)?.nama} ${rp(jumlah)} a.n ${nasabah.nama}`);
  saveDB();
}

// PEMBIAYAAN
function ajukanPembiayaan(anggotaId, jenisId, plafon, tenor){
  plafon=Number(plafon); tenor=Number(tenor);
  const p = {id:uid('pb_'), anggota_id:anggotaId, jenis_id:jenisId, plafon, tenor, sisa:plafon, status:'pending', tanggal:nowISO()};
  DB.pembiayaan.push(p);
  _pembDirty = true;
  _pembIds.add(p.id);
  notify('admin','Pengajuan pembiayaan baru', `${userById(anggotaId)?.nama} mengajukan ${jp(jenisId)?.nama||'pembiayaan'} sebesar ${rp(plafon)}.`, 'pembiayaan');
  addLog(`${userById(anggotaId)?.nama} mengajukan pembiayaan ${rp(plafon)}`);
  saveDB();
}
function setStatusPembiayaan(id, status){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p) return;
  p.status = status;
  _pembDirty = true;
  if(status==='berjalan'){ p.tanggal_acc = nowISO(); p.sisa = p.plafon + marginNominalOf(p); }
  notify(p.anggota_id, 'Status pembiayaan diperbarui', `Pengajuan ${pembNama(p)} Anda kini: ${status}.`, 'pembiayaan');
  addLog(`Pembiayaan ${userById(p.anggota_id)?.nama} diubah menjadi ${status}`);
  saveDB();
}
// ACC pengajuan pembiayaan oleh admin — sisa kewajiban jadi plafon + margin
function accPengajuan(id){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p || p.status!=='pending') return;
  const admin = currentUser();
  p.status = 'berjalan';
  p.tanggal_acc = nowISO();
  p.disetujuiOleh = admin?admin.id:null;
  p.waktuAcc = nowISO();
  p.sisa = p.plafon + marginNominalOf(p);
  const nas = userById(p.anggota_id);
  notify(p.anggota_id, 'Pembiayaan disetujui', `Pengajuan ${pembNama(p)} Anda sebesar ${rp(p.plafon)} telah disetujui. Angsuran/bulan: ${rp(angsuranPerBulanOf(p))}.`, 'pembiayaan');
  addLog(`ACC pembiayaan ${rp(p.plafon)} a.n ${nas?.nama}`);
  _pembDirty = true;
  saveDB();
}
function tolakPengajuan(id){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p || p.status!=='pending') return;
  const admin = currentUser();
  p.status = 'ditolak';
  p.tanggal_tolak = nowISO();
  p.ditolakOleh = admin?admin.id:null;
  p.waktuTolak = nowISO();
  const nas = userById(p.anggota_id);
  notify(p.anggota_id, 'Pembiayaan ditolak', `Pengajuan ${pembNama(p)} Anda sebesar ${rp(p.plafon)} ditolak.`, 'pembiayaan');
  addLog(`Tolak pembiayaan ${rp(p.plafon)} a.n ${nas?.nama}`);
  _pembDirty = true;
  saveDB();
}
function hapusPembiayaan(id){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p) return;
  askConfirm(`Hapus pengajuan pembiayaan ${userById(p.anggota_id)?.nama} (${rp(p.plafon)})? Riwayat angsuran ikut terhapus.`, ()=>{
    DB.pembiayaan = DB.pembiayaan.filter(x=>x.id!==id);
    DB.transaksi_pembiayaan = DB.transaksi_pembiayaan.filter(t=>t.pembiayaan_id!==id);
    _pembDirty = true;
    addLog(`Hapus pembiayaan ${rp(p.plafon)} a.n ${userById(p.anggota_id)?.nama}`);
    saveDB();
    if(ROUTE==='pembiayaan_detail') go('pembiayaan'); else render();
  });
}
function bayarAngsuran(id, jumlah){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p) return;
  jumlah = Number(jumlah);
  p.sisa = Math.max(0, p.sisa - jumlah);
  if(p.sisa===0) p.status='lunas';
  _paidThisSession[id] = (_paidThisSession[id]||0) + 1;
  _pembDirty = true;
  DB.transaksi_pembiayaan.unshift({id:uid('tp_'), pembiayaan_id:id, jumlah, tanggal:nowISO()});
  addLog(`Angsuran ${rp(jumlah)} untuk pembiayaan ${userById(p.anggota_id)?.nama}`);
  saveDB();
}

// ANGGOTA: aktivasi, nonaktivasi, hapus, edit
function nonaktifkanAnggota(id){
  const a = userById(id); if(!a) return;
  a.status = 'nonaktif';
  addLog(`Menonaktifkan anggota ${a.nama}`);
  saveDB(); render();
}
function aktifkanAnggota(id){
  const a = userById(id); if(!a) return;
  a.status = 'aktif';
  addLog(`Mengaktifkan kembali anggota ${a.nama}`);
  saveDB(); render();
}
function hapusAnggota(id){
  const a = userById(id); if(!a) return;
  askConfirm(`Hapus anggota ${a.nama}? Seluruh data tabungan, saham, dan pembiayaan miliknya ikut terhapus permanen.`, ()=>{
    DB.users = DB.users.filter(u=>u.id!==id);
    DB.tabungan = DB.tabungan.filter(t=>t.anggota_id!==id);
    DB.saham = DB.saham.filter(s=>s.anggota_id!==id);
    const pembIds = DB.pembiayaan.filter(p=>p.anggota_id===id).map(p=>p.id);
    DB.pembiayaan = DB.pembiayaan.filter(p=>p.anggota_id!==id);
    DB.transaksi_pembiayaan = DB.transaksi_pembiayaan.filter(t=>!pembIds.includes(t.pembiayaan_id));
    DB.transaksi_tabungan = DB.transaksi_tabungan.filter(t=>t.anggota_id!==id);
    addLog(`Menghapus anggota ${a.nama} beserta seluruh datanya`);
    saveDB();
    if(ROUTE==='anggota_detail') go('anggota'); else render();
  });
}
function editAnggota(id, data){
  const a = userById(id); if(!a) return;
  Object.assign(a, data);
  addLog(`Memperbarui data anggota ${a.nama}`);
  saveDB();
}

/* ---------- KONFIRMASI IN-APP (pengganti window.confirm, lebih andal di preview/iframe) ---------- */
let CONFIRM_ACTION = null; // {message, callback}
function askConfirm(message, callback){ CONFIRM_ACTION = {message, callback}; MODAL = {type:'confirm'}; render(); }
function confirmYes(){
  const cb = CONFIRM_ACTION && CONFIRM_ACTION.callback;
  CONFIRM_ACTION = null; MODAL = null;
  if(cb) cb();
  else render();
}
function confirmNo(){ CONFIRM_ACTION = null; closeModal(); }
function confirmModal(){
  return `${modalHeader('Konfirmasi')}
  <div style="padding:8px 20px 20px;">
    <p style="font-size:14px; color:var(--ink); line-height:1.6; margin:0 0 18px;">${esc(CONFIRM_ACTION?.message||'')}</p>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="confirmNo()">Batal</button>
      <button class="btn btn-danger" style="flex:1;" onclick="confirmYes()">Ya, Lanjutkan</button>
    </div>
  </div>`;
}

function attachLoginEvents(){
  const btn = document.getElementById('btnLogin');
  const tryLogin = ()=>{
    const uname = document.getElementById('li_user').value.trim().toLowerCase();
    const pass = document.getElementById('li_pass').value;
    const user = DB.users.find(u=>u.username.toLowerCase()===uname && u.password===pass);
    const err = document.getElementById('loginErr');
    if(!user){ err.style.display='block'; err.textContent='Username atau password salah.'; return; }
    setSession(user); ROUTE='dashboard'; addLog(`${user.nama} masuk ke sistem`); render();
  };
  btn.onclick = tryLogin;
  document.getElementById('li_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

function statusBadge(status){

    lunas:['Lunas','badge-green'], berjalan:['Berjalan','badge-gold'], diajukan:['Diajukan','badge-grey'],

/* ---------- TABUNGAN: nasabah ---------- */
let BUKU_TABUNGAN_JENIS = null;
function bukuTabunganOf(anggotaId, jenisId){
  const saldo = (DB.tabungan.find(t=>t.anggota_id===anggotaId && t.jenis_id===jenisId)||{}).saldo||0;
  const trx = DB.transaksi_tabungan.filter(t=>t.anggota_id===anggotaId && t.jenis_id===jenisId)
    .filter(t=> t.tipe==='setor' || t.status==='selesai' || t.status==='selesai_ditalangi');
  trx.sort((a,b)=> new Date(a.tanggal)-new Date(b.tanggal));
  const net = trx.reduce((s,t)=> s + (t.tipe==='setor'? (Number(t.jumlah)||0) : -(Number(t.jumlah)||0)), 0);
  const opening = saldo - net;
  let run = opening;
  const rows = trx.map(t=>{
    const debit = t.tipe==='setor' ? (Number(t.jumlah)||0) : 0;
    const kredit = t.tipe==='tarik' ? (Number(t.jumlah)||0) : 0;
    run = run + debit - kredit;
    return { tanggal:t.tanggal,
      ket: t.keterangan || (t.tipe==='setor'? 'Setor '+jt(jenisId)?.nama : 'Tarik '+jt(jenisId)?.nama),
      debit, kredit, saldo:run, via:t.via, status:t.status };
  });
  return { saldo, opening, rows, jenis:jt(jenisId) };
}

function pageNeraca(u){
  const kasKoordinator = Object.values(DB.kas_koordinator).reduce((a,b)=>a+b,0);

  const wadiah = totalTabunganByAkad('wadiah');
  const mudharabah = totalTabunganByAkad('mudharabah');
  const hutangKoordinator = totalHutangBelumLunas();
  const ekuitasSahamRows = DB.jenis_saham.map(j=>{
    const total = DB.saham.filter(s=>s.jenis_id===j.id).reduce((a,s)=>a+s.lembar*j.nilai_lembar,0);
    return {nama:j.nama, total};
  });
  const totalEkuitasSaham = ekuitasSahamRows.reduce((a,r)=>a+r.total,0);

  const totalKewajiban = wadiah + mudharabah + hutangKoordinator;
  const totalEkuitas = totalEkuitasSaham + cadangan + shu;
  const totalPasiva = totalKewajiban + totalEkuitas;

  return `

      ${ekuitasSahamRows.map(r=>neracaRow(r.nama, r.total, {indent:true})).join('')}

function modalView(u){
  let body = '';
  if(MODAL.type==='confirm') body = confirmModal();
  else if(MODAL.type==='notif') body = notifModal(u);
  else if(MODAL.type==='setorTabungan') body = setorTabunganModal(u,false);
  else if(MODAL.type==='setorTabunganAdmin') body = setorTabunganModal(u,true,MODAL.payload&&MODAL.payload.id);
  else if(MODAL.type==='setorTabunganKoordinator') body = setorTabunganKoordinatorModal(u,MODAL.payload&&MODAL.payload.id);
  else if(MODAL.type==='tarikTabungan') body = tarikTabunganModal(u);
  else if(MODAL.type==='catatTarikTabungan') body = catatTarikTabunganModal(u,MODAL.payload&&MODAL.payload.id);
  else if(MODAL.type==='setorKeAdmin') body = setorKeAdminModal(u);
  else if(MODAL.type==='tambahAnggota') body = tambahAnggotaModal(u);
  else if(MODAL.type==='editAnggota') body = editAnggotaModal(u, MODAL.payload.id);
  else if(MODAL.type==='tambahSaham') body = tambahSahamModal(u);
  else if(MODAL.type==='ajukanPembiayaan') body = ajukanPembiayaanModal(u);
  else if(MODAL.type==='ajukanPembiayaanKoor') body = ajukanPembiayaanKoorModal(u);
  else if(MODAL.type==='editPembiayaanKoor') body = editPembiayaanKoorModal(u, MODAL.payload.id);
  else if(MODAL.type==='bayarAngsuran') body = bayarAngsuranModal(u, MODAL.payload.id);
  else if(MODAL.type==='jenisTabungan') body = jenisTabunganModal();

function updateAjukanHint(){
  const jenisEl = document.getElementById('m_jenis'); if(!jenisEl) return;
  const j = jp(jenisEl.value);
  const plafon = Number(document.getElementById('m_plafon').value)||0;

  const hintEl = document.getElementById('ajukanHint');
  if(!j || !plafon || !tenor){ hintEl.textContent = 'Isi plafon dan tenor untuk melihat estimasi angsuran.'; return; }
  const margin = Math.round(plafon * (j.margin||0) / 100);
  const perBulan = Math.ceil((plafon+margin)/tenor);
  hintEl.innerHTML = `Estimasi margin <b>${rp(margin)}</b>, angsuran <b>${rp(perBulan)}</b>/bulan.`;
}

  if(j && j.plafon_max && Number(plafon) > j.plafon_max){ alert(`Plafon melebihi maksimal ${rp(j.plafon_max)} untuk jenis ini.`); return; }
  if(j && j.tenor_max && Number(tenor) > j.tenor_max){ alert(`Tenor melebihi maksimal ${j.tenor_max} bulan untuk jenis ini.`); return; }

}

function updateAjukanKoorHint(){
  const jumlah = Number(document.getElementById('m_jumlah').value)||0;

  const margin = Number(document.getElementById('m_margin').value)||0;

  const hintEl = document.getElementById('ajukanKoorHint');
  if(margin < pMin || margin > pMax){ hintEl.innerHTML = `<span style="color:var(--danger);">Keuntungan harus antara ${rp(pMin)}–${rp(pMax)}.</span>`; return; }
  if(!jumlah || !tenor){ hintEl.textContent = 'Isi jumlah, tenor, dan keuntungan untuk melihat estimasi angsuran.'; return; }
  const total = jumlah + margin;
  const perBulan = Math.ceil(total/tenor/1000)*1000;
  hintEl.innerHTML = `Estimasi keuntungan <b>${rp(margin)}</b>, total kewajiban <b>${rp(total)}</b>, angsuran <b>${rp(perBulan)}</b>/bulan.`;
}

  const binaan = anggotaList().filter(a=>a.koordinator_id===u.id);
  const pMin = Number(DB.pengaturan.margin_min)||50000, pMax = Number(DB.pengaturan.margin_max)||200000;
  return `${modalHeader('Edit Pengajuan Pembiayaan')}
  <div style="padding:8px 20px 20px;">
    <label class="label">Anggota Binaan</label>
    <select id="m_nas" class="input" style="margin-bottom:12px;">${binaan.map(a=>`<option value="${a.id}" ${a.id===p.anggota_id?'selected':''}>${a.nama}</option>`).join('')}</select>
    <label class="label">Jumlah Pinjaman (Rp)</label>
    <input id="m_jumlah" type="number" class="input" value="${p.plafon}" style="margin-bottom:12px;" oninput="updateEditKoorHint()">
    <label class="label">Jangka Waktu (bulan)</label>
    <input id="m_tenor" type="number" class="input" value="${p.tenor}" style="margin-bottom:12px;" oninput="updateEditKoorHint()">
    <label class="label">Keuntungan Koperasi (Rp) — kisaran ${rp(pMin)} – ${rp(pMax)}</label>
    <input id="m_margin" type="number" class="input" value="${p.marginNominal||pMin}" style="margin-bottom:8px;" oninput="updateEditKoorHint()">
    <div id="editKoorHint" style="font-size:12px; color:var(--muted); margin-bottom:16px; line-height:1.6;"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="submitEditPembiayaanKoor('${p.id}')">Simpan Perubahan</button>
  </div>`;
}
function updateEditKoorHint(){
  const jumlah = Number(document.getElementById('m_jumlah').value)||0;
  const tenor = Number(document.getElementById('m_tenor').value)||0;
  const margin = Number(document.getElementById('m_margin').value)||0;
  const pMin = Number(DB.pengaturan.margin_min)||50000, pMax = Number(DB.pengaturan.margin_max)||200000;
  const hintEl = document.getElementById('editKoorHint');
  if(margin < pMin || margin > pMax){ hintEl.innerHTML = `<span style="color:var(--danger);">Keuntungan harus antara ${rp(pMin)}–${rp(pMax)}.</span>`; return; }
  if(!jumlah || !tenor){ hintEl.textContent = 'Isi jumlah, tenor, dan keuntungan untuk melihat estimasi angsuran.'; return; }
  const total = jumlah + margin;
  const perBulan = Math.ceil(total/tenor/1000)*1000;
  hintEl.innerHTML = `Estimasi keuntungan <b>${rp(margin)}</b>, total kewajiban <b>${rp(total)}</b>, angsuran <b>${rp(perBulan)}</b>/bulan.`;
}
function submitEditPembiayaanKoor(id){
  const p = DB.pembiayaan.find(x=>x.id===id); if(!p || p.status!=='pending') return;
  const nas = document.getElementById('m_nas').value;
  const jumlah = document.getElementById('m_jumlah').value;
  const tenor = document.getElementById('m_tenor').value;
  const margin = document.getElementById('m_margin').value;
  const pMin = Number(DB.pengaturan.margin_min)||50000, pMax = Number(DB.pengaturan.margin_max)||200000;
  if(!jumlah || Number(jumlah)<=0 || !tenor){ alert('Lengkapi data pengajuan.'); return; }
  const mv = Number(margin);
  if(mv < pMin || mv > pMax){ alert(`Keuntungan harus antara ${rp(pMin)}–${rp(pMax)}.`); return; }
  p.anggota_id = nas;
  p.plafon = Number(jumlah);
  p.tenor = Number(tenor);
  p.marginNominal = mv;
  p.angsuranPerBulan = Math.ceil((Number(jumlah)+mv)/Number(tenor)/1000)*1000;
  p.sisa = Number(jumlah);
  _pembDirty = true;
  addLog(`Pengajuan pembiayaan a.n ${userById(nas)?.nama} diperbarui (koordinator)`);
  saveDB(); closeModal(); render();
}
function bayarAngsuranModal(u,id){
  const p = DB.pembiayaan.find(x=>x.id===id);
  const saran = Math.min(angsuranPerBulanOf(p), p.sisa);
  return `${modalHeader('Catat Angsuran')}
  <div style="padding:8px 20px 20px;">
    <div style="font-size:13px; color:var(--muted); margin-bottom:12px;">${userById(p.anggota_id)?.nama} — sisa ${rp(p.sisa)} &middot; angsuran/bln ${rp(angsuranPerBulanOf(p))}</div>
    <label class="label">Jumlah Angsuran</label>
    <input id="m_jumlah" type="number" class="input" value="${saran}" style="margin-bottom:16px;">
    <button class="btn btn-primary" style="width:100%;" onclick="submitBayarAngsuran('${id}')">Simpan Angsuran</button>
  </div>`;
}
function submitBayarAngsuran(id){
  const jumlah = document.getElementById('m_jumlah').value;
  if(!jumlah || Number(jumlah)<=0){ alert('Masukkan jumlah yang valid.'); return; }
  bayarAngsuran(id, jumlah);
  closeModal();
  if(ROUTE==='pembiayaan_detail') render();
}

/* ---------- EXPORT EXCEL ---------- */
function sanitizeFileName(s){ return String(s||'').replace(/[\\\/:*?"<>|]/g,'').trim(); }
function exportRowsToXLS(filename, sheetName, headers, rows){
  if(typeof XLSX==='undefined'){ alert('Modul export belum siap, coba lagi sebentar.'); return; }
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  XLSX.writeFile(wb, sanitizeFileName(filename) + '.xlsx');
}
function exportAnggotaXLS(){
  const list = anggotaList();
  const headers = ['No','Nama','No. Rekening','Username','Koordinator','NIK','No HP','Alamat','Total Tabungan','Status'];
  const rows = list.map((a,i)=>[i+1, a.nama, a.no_rekening||'-', a.username, userById(a.koordinator_id)?.nama||'-', a.nik||'-', a.no_hp||'-', a.alamat||'-', tabunganNasabah(a.id).reduce((s,t)=>s+t.saldo,0), a.status||'aktif']);
  exportRowsToXLS('Data Anggota - Koperasi UB Rukun Barokah', 'Anggota', headers, rows);
}
function exportTabunganXLS(){
  const rows = DB.transaksi_tabungan.map((t,i)=>[i+1, fmtDate(t.tanggal), userById(t.anggota_id)?.nama||'-', jt(t.jenis_id)?.nama||'-', t.tipe==='setor'?'Setor':'Tarik', t.jumlah, t.via==='koordinator'?(userById(t.koordinator_id)?.nama||'Koordinator'):'Langsung', t.status]);
  exportRowsToXLS('Laporan Tabungan - Koperasi UB Rukun Barokah', 'Tabungan', ['No','Tanggal','Nasabah','Jenis','Tipe','Jumlah','Via','Status'], rows);
}
function exportPembiayaanXLS(){
  const rows = DB.pembiayaan.map((p,i)=>[i+1, userById(p.anggota_id)?.nama||'-', jp(p.jenis_id)?.nama||'-', p.plafon, p.tenor, marginNominalOf(p), angsuranPerBulanOf(p), p.sisa, pembBadge(p).label]);
  exportRowsToXLS('Laporan Pembiayaan - Koperasi UB Rukun Barokah', 'Pembiayaan', ['No','Nasabah','Jenis','Plafon','Tenor (bln)','Margin','Angsuran/Bulan','Sisa','Status'], rows);
}
function exportSHUXLS(){
  const d = computeSHUDistribution();
  const rows = d.list.map((r,i)=>[i+1, r.anggota.nama, r.nilaiSaham, r.shuSaham, r.saldoMudharabah, r.shuTabungan, r.total]);
  exportRowsToXLS('Laporan SHU - Koperasi UB Rukun Barokah', 'SHU', ['No','Nasabah','Nilai Saham','SHU Saham','Saldo Tab. Mudharabah','SHU Tabungan','Total SHU'], rows);
}

function drawDashboardChart(){
  const el = document.getElementById('chartRingkasan'); if(!el) return;

  CH1 = new Chart(el, {
    type:'doughnut',
    data:{ labels:['Tabungan','Saham','Pembiayaan Berjalan'],
      datasets:[{ data:[totalTabunganKoperasi(), totalSahamKoperasi(), totalPembiayaanOutstanding()],
      backgroundColor:['#0B3D2E','#C9A227','#145C41'], borderWidth:0 }] },
    options:{ plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}} }, cutout:'62%' }
  });
}
function drawLaporanChart(){
  const el = document.getElementById('chartLaporan'); if(!el) return;
  if(CH2) CH2.destroy();
  const data = DB.jenis_tabungan.map(j=> DB.tabungan.filter(t=>t.jenis_id===j.id).reduce((a,t)=>a+t.saldo,0));
  CH2 = new Chart(el, {
    type:'bar',
    data:{ labels: DB.jenis_tabungan.map(j=>j.nama), datasets:[{ data, backgroundColor:'#0B3D2E', borderRadius:8, maxBarThickness:46 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{callback:v=>rp(v)}, grid:{color:'#EFEBDF'} }, x:{grid:{display:false}} } }
  });
}
