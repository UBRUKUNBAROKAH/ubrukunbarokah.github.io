    example: ['2026-10001','Siti Aminah','Simpanan Pokok','25000'],
    note: 'Isi no_rekening jika tahu (lebih akurat) atau nama_anggota. jenis_simpanan harus sama persis dengan nama jenis tabungan yang sudah ada. setoran_awal boleh dikosongkan/0.'
  },
   pembiayaan: {
     label: 'Pembiayaan',
     headers: ['no_rekening','nama_anggota','jumlah_pinjaman','tenor_bulan','keuntungan','tanggal_mulai'],
     example: ['2026-10001','Siti Aminah','1000000','12','100000','2026-07-01'],
     note: 'Isi no_rekening jika tahu (lebih akurat) atau nama_anggota. tanggal_mulai opsional (format YYYY-MM-DD), jika kosong pakai tanggal hari ini.'
   },
  saham: {
    label: 'Saham',
    headers: ['nama_pemilik','kelompok','jenis_saham','jumlah_lembar'],
    example: ['Siti Aminah','Karanggede','SAHAM A','2'],
    note: 'kelompok boleh dikosongkan jika nama_pemilik adalah anggota terdaftar (otomatis pakai kelompok anggota). jenis_saham harus sama persis dengan jenis saham yang sudah ada.'
  }
};
let _importState = null;
function csvGet(row, keys){
  for(const k of keys){
    for(const rk in row){
      if(rk.toLowerCase().replace(/[\s_]/g,'') === k.toLowerCase().replace(/[\s_]/g,'')) return String(row[rk]??'').trim();
    }
  }
  return '';
}
function findAnggotaByRekOrNama(noRek, nama){
  if(noRek){
    const u = DB.users.find(u=>u.role==='nasabah' && u.noRekening===noRek);
    if(u) return {user:u};
  }
  if(nama){
    const matches = DB.users.filter(u=>u.role==='nasabah' && u.nama.toLowerCase().trim()===nama.toLowerCase().trim());
    if(matches.length>1) return {error:'Nama "'+nama+'" ganda, gunakan kolom no_rekening'};
    if(matches.length===1) return {user:matches[0]};
  }
  return {error:'Anggota tidak ditemukan (no_rekening/nama_anggota tidak cocok)'};
}
function validateAnggotaRow(row){
  const nama = csvGet(row,['nama']);
  const nik = csvGet(row,['nik']);
  const alamat = csvGet(row,['alamat']);
  const noHp = csvGet(row,['no_hp','nohp','no hp','telepon','hp']);
  const kelompokNama = csvGet(row,['kelompok']);
  if(!nama) return {ok:false, reason:'Kolom nama kosong'};
  if(!nik) return {ok:false, reason:'Kolom nik kosong'};
  if(!alamat) return {ok:false, reason:'Kolom alamat kosong'};
  if(!noHp) return {ok:false, reason:'Kolom no_hp kosong'};
  if(!kelompokNama) return {ok:false, reason:'Kolom kelompok kosong'};
  const kel = DB.koperasi.kelompok.find(k=>k.nama.toLowerCase().trim()===kelompokNama.toLowerCase().trim());
  if(!kel) return {ok:false, reason:'Kelompok "'+kelompokNama+'" tidak ditemukan'};
  if(DB.users.some(u=>u.role==='nasabah' && u.nik===nik)) return {ok:false, reason:'NIK '+nik+' sudah terdaftar'};
  return {ok:true, obj:{nama, nik, alamat, noHp, kelompokId:kel.id}};
}
function validateTabunganRow(row){
  const noRek = csvGet(row,['no_rekening','norekening']);
  const nama = csvGet(row,['nama_anggota','nama']);
  const jenisNama = csvGet(row,['jenis_simpanan','jenis']);
  const setoranAwal = parseIdr(csvGet(row,['setoran_awal','saldo_awal'])) || 0;
  if(!noRek && !nama) return {ok:false, reason:'Kolom no_rekening / nama_anggota wajib diisi'};
  const found = findAnggotaByRekOrNama(noRek, nama);
  if(found.error) return {ok:false, reason:found.error};
  const user = found.user;
  if(!jenisNama) return {ok:false, reason:'Kolom jenis_simpanan kosong'};
  const jenis = DB.koperasi.jenisTabungan.find(j=>j.nama.toLowerCase().trim()===jenisNama.toLowerCase().trim());
  if(!jenis) return {ok:false, reason:'Jenis simpanan "'+jenisNama+'" tidak ditemukan'};
  if(DB.tabunganAccounts.some(a=>a.userId===user.id && a.jenisId===jenis.id)) return {ok:false, reason:'Rekening '+jenis.nama+' sudah dibuka untuk '+user.nama};
  return {ok:true, obj:{userId:user.id, namaTampil:user.nama, jenisId:jenis.id, setoranAwal}};
}
function validatePembiayaanRow(row){
  const jumlah = parseIdr(csvGet(row,['jumlah_pinjaman','pinjaman']));
  const tenor = parseIdr(csvGet(row,['tenor_bulan','tenor','jangka_waktu']));
  const margin = parseIdr(csvGet(row,['keuntungan','margin']));
  const tglRaw = csvGet(row,['tanggal_mulai','mulai']);
  if(!noRek && !nama) return {ok:false, reason:'Kolom no_rekening / nama_anggota wajib diisi'};
  const found = findAnggotaByRekOrNama(noRek, nama);
  if(found.error) return {ok:false, reason:found.error};
  const user = found.user;
  if(!jumlah) return {ok:false, reason:'Kolom jumlah_pinjaman kosong/tidak valid'};
  if(!tenor) return {ok:false, reason:'Kolom tenor_bulan kosong/tidak valid'};
  if(!margin) return {ok:false, reason:'Kolom keuntungan kosong/tidak valid'};
  let mulai = nowISO();
  if(tglRaw){ const d = new Date(tglRaw); if(!isNaN(d)) mulai = d.toISOString(); }
  return {ok:true, obj:{userId:user.id, namaTampil:user.nama, jumlah, tenor, margin, mulai}};
}
function validateSahamRow(row){
  const nama = csvGet(row,['nama_pemilik','nama']);
  const kelompokNama = csvGet(row,['kelompok']);
  const jenisNama = csvGet(row,['jenis_saham','jenis']);
  const lembar = parseIdr(csvGet(row,['jumlah_lembar','lembar']));
  if(!nama) return {ok:false, reason:'Kolom nama_pemilik kosong'};
  if(!jenisNama) return {ok:false, reason:'Kolom jenis_saham kosong'};
  const jenis = DB.koperasi.saham.jenis.find(j=>j.nama.toLowerCase().trim()===jenisNama.toLowerCase().trim());
  if(!jenis) return {ok:false, reason:'Jenis saham "'+jenisNama+'" tidak ditemukan'};
  if(!lembar) return {ok:false, reason:'Kolom jumlah_lembar kosong/tidak valid'};
  let kelompokId = null;
  if(kelompokNama){
    const kel = DB.koperasi.kelompok.find(k=>k.nama.toLowerCase().trim()===kelompokNama.toLowerCase().trim());
    if(!kel) return {ok:false, reason:'Kelompok "'+kelompokNama+'" tidak ditemukan'};
    kelompokId = kel.id;
  }
  const anggota = DB.users.find(u=>u.role==='nasabah' && u.nama.toLowerCase().trim()===nama.toLowerCase().trim());
  return {ok:true, obj:{nama, anggotaId: anggota?anggota.id:null, jenisId:jenis.id, lembar, kelompokId: kelompokId || (anggota?anggota.kelompokId:null)}};
}
const IMPORT_VALIDATORS = {anggota:validateAnggotaRow, tabungan:validateTabunganRow, pembiayaan:validatePembiayaanRow, saham:validateSahamRow};
function openImportModal(type){
  const spec = IMPORT_SPECS[type];
  _importState = null;
  openModal(`
    <h3>Import CSV — ${spec.label}</h3>
    <div class="hint" style="margin-bottom:10px;">Kolom yang dibutuhkan: <b>${spec.headers.join(', ')}</b>. ${spec.note}</div>
    <button class="btn btn-outline" style="width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;" onclick="downloadImportTemplate('${type}')">${ICONS.download} Unduh Template CSV</button>
    <div class="form-row"><label>Pilih file CSV</label><input type="file" id="import-file-input" accept=".csv" onchange="onImportFileSelected('${type}', this)"></div>
    <div id="import-preview-area"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
    </div>
  `);
}
function downloadImportTemplate(type){
  const spec = IMPORT_SPECS[type];
  const csv = spec.headers.join(',') + '\n' + spec.example.join(',');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'template_import_'+type+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function onImportFileSelected(type, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
      if(!rows.length){ toast('File kosong atau format tidak dikenali'); return; }
      const validator = IMPORT_VALIDATORS[type];
      const results = rows.map((row,idx)=>{
        const r = validator(row);
        return {idx:idx+1, ok:r.ok, reason:r.reason||'', obj:r.obj||null};
      });
      _importState = {type, rows: results};
      renderImportPreview();
    }catch(err){
      console.error(err);
      toast('Gagal membaca file CSV. Pastikan format file benar.');
    }
  };
  reader.readAsBinaryString(file);
}
function renderImportPreview(){
  const state = _importState;
  if(!state) return;
  const area = document.getElementById('import-preview-area');
  if(!area) return;
  const okCount = state.rows.filter(r=>r.ok).length;
  const errCount = state.rows.length - okCount;
  area.innerHTML = `
    <div class="hint" style="margin:10px 0;"><b style="color:var(--primary);">${okCount} data valid</b>${errCount?` &middot; <b style="color:var(--danger);">${errCount} bermasalah</b>`:''} dari ${state.rows.length} baris.</div>
    <div class="card" style="padding:2px 14px;max-height:220px;overflow-y:auto;margin-bottom:12px;">
      ${state.rows.map(r=>`
        <div class="list-row" style="padding:8px 0;">
          <div class="info">
            <div class="title" style="font-size:13px;display:flex;align-items:center;gap:6px;">Baris ${r.idx} ${r.ok?'<span class="badge badge-green" style="font-size:9px;">OK</span>':'<span class="badge badge-red" style="font-size:9px;">Error</span>'}</div>
            ${!r.ok?`<div class="sub" style="color:var(--danger);">${r.reason}</div>`:''}
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-primary" style="width:100%;" ${okCount?'':'disabled'} onclick="commitImportRows()">Import ${okCount} Data</button>
  `;
}
function commitImportRows(){
  const state = _importState;
  if(!state) return;
  const validRows = state.rows.filter(r=>r.ok);
  if(!validRows.length){ toast('Tidak ada data valid untuk diimport'); return; }
  let count = 0;
  if(state.type==='anggota'){
    validRows.forEach(r=>{
      const o = r.obj;
      const baseUsername = o.nama.toLowerCase().replace(/[^a-z]/g,'');
      let username = baseUsername, counter = 1;
      while(DB.users.some(u=>u.username===username)){ username = baseUsername+counter; counter++; }
      const newUser = {
        id:uid('u'), username, password:'anggota123', role:'nasabah', nama:o.nama, nik:o.nik, alamat:o.alamat, noHp:o.noHp, kelompokId:o.kelompokId,
        noRekening: '2026'+String(1000+DB.users.length), saham:{s_A:0,s_B:0,s_C:0}, status:'aktif', anggotaId:uid('agg'), createdAt: nowISO()
      };
      DB.users.push(newUser);
      count++;
    });
  } else if(state.type==='tabungan'){
    const s = getSession();
    validRows.forEach(r=>{
      const o = r.obj;
      const acc = {id:uid('acc'), userId:o.userId, jenisId:o.jenisId, saldo:0, noRekening:nextAccNo()};
      DB.tabunganAccounts.push(acc);
      if(o.setoranAwal>0){
        acc.saldo = o.setoranAwal;
        DB.tabunganTx.push({id:uid('tx'), userId:o.userId, jenisId:o.jenisId, tipe:'setor', jumlah:o.setoranAwal, saldoSetelah:acc.saldo, tanggal:nowISO(), oleh:s.userId, keterangan:'Setoran awal (import CSV)'});
      }
      count++;
    });
  } else if(state.type==='pembiayaan'){
    validRows.forEach(r=>{
      const o = r.obj;
      const total = o.jumlah + o.margin;
      const p = {id:uid('pemb'), userId:o.userId, jumlahPinjaman:o.jumlah, tenor:o.tenor, marginPersen:0, marginNominal:o.margin, angsuranPerBulan:Math.ceil(total/o.tenor/1000)*1000, mulai:o.mulai, sisaAngsuran:o.tenor, status:'berjalan', riwayatAngsuran:[], statusPengajuan:'approved'};
      DB.pembiayaan.push(p);
      count++;
    });
  } else if(state.type==='saham'){
    validRows.forEach(r=>{
      const o = r.obj;
      DB.kepemilikanSaham.push({id:uid('ks'), nama:o.nama, anggotaId:o.anggotaId, jenisId:o.jenisId, lembar:o.lembar, kelompokId:o.kelompokId});

        const anggota = userById(o.anggotaId);
        if(!anggota.saham) anggota.saham = {};
        anggota.saham[o.jenisId] = (anggota.saham[o.jenisId]||0) + o.lembar;
      }
      count++;
    });
  }
  persist();
  addLog('Import CSV', 'Import '+count+' data '+IMPORT_SPECS[state.type].label.toLowerCase());
  bigSuccess(count+' data berhasil diimport');
  _importState = null;
  closeModal();
  renderContent();
}

const EXPORT_META = {
  tabungan: {
    label: 'Tabungan',
    headers: ['No','Nama','No. Rekening','Kelompok','Total Saldo'],
    rows: function(kelompokId){
      const nasabah = DB.users.filter(u=>u.role==='nasabah' && u.kelompokId===kelompokId && DB.tabunganAccounts.some(a=>a.userId===u.id));
      return nasabah.map((u,i)=>[i+1, u.nama, u.noRekening||'-', kelompokName(u.kelompokId), rupiah(totalSaldoUser(u.id))]);
    }
  },
  pembiayaan: {
    label: 'Pembiayaan',
    headers: ['No','Nama','Jumlah Pinjaman','Tenor','Sisa Angsuran','Status Pengajuan','Status'],
    rows: function(kelompokId){
      const list = DB.pembiayaan.filter(p=>userById(p.userId).kelompokId===kelompokId);
      return list.map((p,i)=>[i+1, userById(p.userId).nama, rupiah(p.jumlahPinjaman), p.tenor+' bln', p.sisaAngsuran+'/'+p.tenor,
        p.statusPengajuan==='pending'?'Menunggu ACC':(p.statusPengajuan==='approved'?'Disetujui':'Ditolak'),
        p.status==='lunas'?'Lunas':'Berjalan']);
    }
  },
  saham: {
    label: 'Saham',
    headers: ['No','Nama Pemilik','Kepemilikan','Total Nilai'],
    rows: function(kelompokId){
      const jns = DB.koperasi.saham.jenis||[];
      const ks = DB.kepemilikanSaham||[];
      const seen = {}; const names = [];
      ks.forEach(k=>{ if(!seen[k.nama]){ seen[k.nama]=true; names.push(k.nama); } });
      const filtered = names.filter(nama=>ownerKelompokId(nama)===kelompokId);
      return filtered.map((nama,i)=>{
        const holdings = ks.filter(k=>k.nama===nama);
        const total = holdings.reduce((s,k)=>{ const j=jns.find(j=>j.id===k.jenisId); return s+(j?k.lembar*nilaiSahamPerLembar(j):0); },0);
        const breakdown = holdings.map(k=>{ const j=jns.find(j=>j.id===k.jenisId); return (j?j.nama:'-')+': '+k.lembar+' lbr'; }).join(', ');
        return [i+1, nama, breakdown||'-', rupiah(total)];
      });
    }
  }
};
function sanitizeFileName(s){ return String(s||'').replace(/[\\\/:*?"<>|]/g,'').trim(); }
function exportKelompokGroups(kelompokId){
  const all = DB.koperasi.kelompok || [];
  return kelompokId ? all.filter(k=>k.id===kelompokId) : all;

function runExport(type, format){
  const sel = document.getElementById('export-kelompok');
  const kelompokId = sel ? sel.value : '';
  closeModal();
  try{
    if(format==='pdf') exportToPDF(type, kelompokId);
    else exportToXLS(type, kelompokId);
  }catch(e){
    console.error(e);
    toast('Gagal membuat file export');
  }
}
function exportToPDF(type, kelompokId){
  const meta = EXPORT_META[type];
  const groups = exportKelompokGroups(kelompokId);
  if(!groups.length){ toast('Belum ada data kelompok'); return; }
  const { jsPDF } = window.jspdf;
  const orgName = (DB.koperasi && DB.koperasi.nama) || 'UB Rukun Barokah';
  const tgl = new Date().toLocaleString('id-ID', {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  groups.forEach((k, idx)=>{
    setTimeout(()=>{
      const doc = new jsPDF();
      const rows = meta.rows(k.id);
      doc.setFontSize(13);
      doc.text(orgName, 14, 16);
      doc.setFontSize(10.5);
      doc.text('Laporan ' + meta.label + ' \u2014 Kelompok ' + k.nama, 14, 23);
      doc.setFontSize(8.5);
      doc.setTextColor(120);
      doc.text('Dicetak: ' + tgl, 14, 28.5);
      doc.setTextColor(0);
      doc.autoTable({
        head: [meta.headers],
        body: rows.length ? rows : [meta.headers.map((h,i)=> i===1 ? 'Tidak ada data' : '')],
        startY: 33,
        styles:{ fontSize:8, cellPadding:3 },
        headStyles:{ fillColor:[11,61,46], textColor:255 },
        alternateRowStyles:{ fillColor:[244,248,244] }
      });
      doc.save(sanitizeFileName(meta.label + ' Kelompok ' + k.nama) + '.pdf');
      if(idx===groups.length-1) toast(groups.length>1 ? 'Semua file PDF berhasil diunduh' : 'File PDF berhasil diunduh');
    }, idx*350);
  });
}
function exportToXLS(type, kelompokId){
  const meta = EXPORT_META[type];
  const groups = exportKelompokGroups(kelompokId);
  if(!groups.length){ toast('Belum ada data kelompok'); return; }
  const wb = XLSX.utils.book_new();
  const usedNames = {};
  groups.forEach(k=>{
    const rows = meta.rows(k.id);
    const body = rows.length ? rows : [meta.headers.map((h,i)=> i===1 ? 'Tidak ada data' : '')];
    const ws = XLSX.utils.aoa_to_sheet([meta.headers, ...body]);
    let sheetName = sanitizeFileName(k.nama).slice(0,28) || 'Kelompok';
    if(usedNames[sheetName]){ usedNames[sheetName]++; sheetName = (sheetName+'_'+usedNames[sheetName]).slice(0,31); }
    else usedNames[sheetName] = 1;
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  XLSX.writeFile(wb, sanitizeFileName(meta.label + ' ' + (kelompokId ? 'Kelompok ' + kelompokName(kelompokId) : 'Semua Kelompok')) + '.xlsx');
  toast('File Excel berhasil diunduh');
}

function downloadTabunganPDF(userId){
  const nas = userById(userId);
  const accs = userAccounts(userId);
  const allTx = txForUser(userId);
  if(!accs.length){ toast('Belum ada rekening tabungan'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const orgName = (DB.koperasi && DB.koperasi.nama) || 'UB Rukun Barokah';
  const tgl = new Date().toLocaleString('id-ID', {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  doc.setFontSize(13);
  doc.text(orgName, 14, 16);
  doc.setFontSize(10.5);
  doc.text('Buku Tabungan', 14, 23);
  doc.setFontSize(8.5);
  doc.setTextColor(120);
  doc.text('Dicetak: ' + tgl, 14, 28.5);
  doc.setTextColor(0);
  doc.autoTable({
    head:[['Identitas Nasabah','']],
    body:[
      ['Nama', nas.nama || '-'],
      ['Kelompok', kelompokName(nas.kelompokId)],
      ['No. Rekening', nas.noRekening || '-'],
    ],
    startY: 33,
    styles:{ fontSize:8, cellPadding:2.5 },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    columnStyles:{ 0:{cellWidth:34, fontStyle:'bold'}, 1:{cellWidth:70} },
    margin:{right:14,left:14}
  });
  let y = doc.lastAutoTable.finalY + 6;
  if(accs.length){
    doc.setFontSize(10.5);
    doc.setTextColor(0);
    doc.text('Rekening / Saldo', 14, y);
    doc.autoTable({
      head:[['Jenis Simpanan','No. Rekening','Saldo Akhir']],
      body: accs.map(({j,acc})=>[j.nama || '-', acc.noRekening||'-', rupiah(acc.saldo||0)]),
      startY: y+4,
      styles:{ fontSize:8, cellPadding:2.5 },
      headStyles:{ fillColor:[11,61,46], textColor:255 },
      alternateRowStyles:{ fillColor:[244,248,244] },
      margin:{right:14,left:14},
      columnStyles:{ 2:{halign:'right'} }
    });
    y = doc.lastAutoTable.finalY + 6;
  }
  doc.setFontSize(10.5);
  doc.setTextColor(0);
  doc.text('Riwayat Transaksi (' + allTx.length + ')', 14, y);
  doc.autoTable({
    head:[['No','Tanggal','Jenis','Tipe','Keterangan','Jumlah']],
    body: allTx.map((t,i)=>[String(i+1), fmtDateShort(t.tanggal), jenisName(t.jenisId), t.tipe==='setor'?'SETOR':'TARIK', t.keterangan||'-', (t.tipe==='setor'?'+':'-')+rupiah(t.jumlah)]),
    startY: y+4,
    styles:{ fontSize:8, cellPadding:2.5 },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    alternateRowStyles:{ fillColor:[244,248,244] },
    columnStyles:{ 5:{halign:'right'} },
    margin:{right:14,left:14}
  });
  doc.save(sanitizeFileName('Buku Tabungan ' + nas.nama) + '.pdf');
  toast('PDF Buku Tabungan berhasil diunduh');
}

function refreshTxPassbook(userId){
  const accs = userAccounts(userId);
  const box = document.getElementById('tx-passbook');
  if(!accs.length){
    box.innerHTML = `<div class="hint">Anggota ini belum memiliki rekening tabungan. Buka rekening dulu lewat "Tambah Rekening".</div>`;
    document.getElementById('tx-jenis-selected').value = '';
    updateTxActionsUI();
    return;
  }
  const multi = accs.length > 1;
  box.innerHTML = accs.map(({j,acc},idx)=>`
    <div class="tx-acc-row ${(!multi && idx===0)?'selected':''}" data-jenis="${j.id}" onclick="selectTxJenis('${j.id}')">
      <div><div style="font-weight:600;font-size:13px;">${j.nama}</div><div class="hint" style="margin-top:2px;">Saldo saat ini</div></div>
      <div class="mono" style="font-weight:700;">${rupiah(acc.saldo)}</div>
    </div>
  `).join('');
  document.getElementById('tx-jenis-selected').value = multi ? '' : accs[0].j.id;
  updateTxActionsUI();
}
function selectTxJenis(jenisId){
  document.getElementById('tx-jenis-selected').value = jenisId;
  document.querySelectorAll('.tx-acc-row').forEach(el=>{
    el.classList.toggle('selected', el.dataset.jenis===jenisId);
  });
  updateTxActionsUI();
}
function updateTxActionsUI(){
  const jenisEl = document.getElementById('tx-jenis-selected');
  const btn = document.getElementById('tx-submit-btn');
  const hint = document.getElementById('tx-select-hint');
  if(!jenisEl || !btn) return;
  const hasSelection = !!jenisEl.value;
  btn.style.display = hasSelection ? '' : 'none';
  if(hint) hint.style.display = hasSelection ? 'none' : '';
}
function submitTx(tipe){
  const forcedEl = document.getElementById('tx-user-forced');
  const userId = forcedEl ? forcedEl.value : document.getElementById('tx-user').value;
  const jenisId = document.getElementById('tx-jenis-selected').value;
  const jumlah = parseIdr(document.getElementById('tx-jumlah').value);
  const ket = document.getElementById('tx-ket').value;
  if(!jenisId){ toast('Pilih rekening tabungan terlebih dahulu'); return; }
  if(!jumlah || jumlah<=0){ toast('Masukkan jumlah yang valid'); return; }
  const s = getSession();
  if(tipe==='setor'){
    try {
      if(s.role==='koordinator'){
        doSetorKoordinator(userId, jenisId, jumlah, ket);
        bigSuccess('Setoran dicatat, menunggu konfirmasi admin');
      } else {
        doSetor(userId, jenisId, jumlah, ket);
        const nasabahSetor2 = userById(userId);
        notifAdminWA(waHeader('PEMBERITAHUAN SETORAN')
          + waAnggotaInfo(nasabahSetor2)
          + '\nJenis Simpanan : ' + jenisName(jenisId)
          + '\nNominal : ' + rupiah(jumlah)
          + '\nDilakukan oleh : ' + userById(s.userId).nama + ' (' + s.role + ')'
          + '\nWaktu : ' + waTanggal()
          + waFooter());
        notifKoordinatorKelompokWA(nasabahSetor2.kelompokId, waHeader('PEMBERITAHUAN SETORAN')
          + waAnggotaInfo(nasabahSetor2)
          + '\nJenis Simpanan : ' + jenisName(jenisId)
          + '\nNominal : ' + rupiah(jumlah)
          + '\nDilakukan oleh : ' + userById(s.userId).nama + ' (' + s.role + ')'
          + '\nWaktu : ' + waTanggal()
          + waFooter());
        notifUserWA(userId, waHeader('SETORAN TELAH DICATAT')
          + waAnggotaInfo(nasabahSetor2)
          + '\nJenis Simpanan : ' + jenisName(jenisId)
          + '\nNominal : ' + rupiah(jumlah)
          + '\nSaldo : ' + rupiah(waSaldoUser(userId, jenisId) || 0)
          + '\nWaktu : ' + waTanggal()
          + waFooter());
        bigSuccess('Setoran berhasil dicatat');
      }
    } catch(e) {
      toast(e.message);
      return;
    }
  } else {
    if(s.role==='koordinator'){
      const r = doTarikKoordinator(userId, jenisId, jumlah, ket);
      if(!r.ok){ toast(r.msg); return; }
      if(r.kurang > 0){
        bigSuccess('Penarikan dicatat. '+rupiah(r.kurang)+' tercatat sebagai hutang admin ke Anda');
      } else {
        bigSuccess('Penarikan berhasil dicatat');
      }
    } else {
      const r = doTarik(userId, jenisId, jumlah, ket);
      if(!r.ok){ toast(r.msg); return; }
      notifAdminWA(waHeader('PEMBERITAHUAN PENARIKAN')
        + waAnggotaInfo(userById(userId))
        + '\nJenis Simpanan : ' + jenisName(jenisId)
        + '\nNominal : ' + rupiah(jumlah)
        + '\nDilakukan oleh : ' + userById(s.userId).nama + ' (' + s.role + ')'
        + '\nWaktu : ' + waTanggal()
        + waFooter());
      notifUserWA(userId, waHeader('PENARIKAN TELAH DIPROSES')
        + waAnggotaInfo(userById(userId))
        + '\nJenis Simpanan : ' + jenisName(jenisId)
        + '\nNominal : ' + rupiah(jumlah)
        + '\nSaldo : ' + rupiah(waSaldoUser(userId, jenisId) || 0)
        + '\nWaktu : ' + waTanggal()
        + waFooter());
      bigSuccess('Penarikan berhasil dicatat');
    }
  }
  closeModal();
  renderContent();
}

function submitTambahRekening(){
  const forcedEl = document.getElementById('tr-user-forced');
  const userId = forcedEl ? forcedEl.value : document.getElementById('tr-user').value;
  const jenisId = document.getElementById('tr-jenis').value;
  const jumlah = parseIdr(document.getElementById('tr-jumlah').value) || 0;
  if(!userId || !jenisId){ toast('Pilih nasabah dan jenis simpanan'); return; }

function accPengajuan(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p || p.statusPengajuan!=='pending') return;
  const s = getSession();
  p.statusPengajuan = 'approved';
  p.status = 'berjalan';
  p.mulai = nowISO();
  p.disetujuiOleh = s.userId;
  p.waktuAcc = nowISO();
  persist();
  addLog('ACC pembiayaan', userById(p.userId).nama + ' - ' + rupiah(p.jumlahPinjaman) + ' disetujui');
  notifUserWA(p.userId, waHeader('PEMBIAYAAN DISETUJUI')
    + waAnggotaInfo(userById(p.userId))
    + '\nJumlah Pembiayaan : ' + rupiah(p.jumlahPinjaman)
    + '\nJangka Waktu : ' + p.tenor + ' bulan'
    + '\nKeuntungan : ' + rupiah(marginNominalOf(p))
    + '\nAngsuran / Bulan : ' + rupiah(p.angsuranPerBulan)
    + '\nDisetujui pada : ' + waTanggal()
    + waFooter());
  notifKoordinatorKelompokWA(userById(p.userId).kelompokId, waHeader('PEMBIAYAAN DISETUJUI')
    + waAnggotaInfo(userById(p.userId))
    + '\nJumlah Pembiayaan : ' + rupiah(p.jumlahPinjaman)
    + '\nJangka Waktu : ' + p.tenor + ' bulan'
    + '\nAngsuran / Bulan : ' + rupiah(p.angsuranPerBulan)
    + waFooter());
  bigSuccess('Pengajuan disetujui');
  renderContent();
}
function tolakPengajuan(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p || p.statusPengajuan!=='pending') return;
  confirmDialog('Tolak pengajuan?', 'Pengajuan pembiayaan '+userById(p.userId).nama+' akan ditolak.', 'danger', ()=>{
    const s = getSession();
    p.statusPengajuan = 'rejected';
    p.status = 'rejected';
    p.ditolakOleh = s.userId;
    p.waktuTolak = nowISO();
    persist();
    addLog('Tolak pembiayaan', userById(p.userId).nama + ' - ' + rupiah(p.jumlahPinjaman) + ' ditolak');
    notifUserWA(p.userId, waHeader('PEMBERITAHUAN PENOLAKAN PEMBIAYAAN')
      + waAnggotaInfo(userById(p.userId))
      + '\nJumlah Pembiayaan : ' + rupiah(p.jumlahPinjaman)
      + '\nJangka Waktu : ' + p.tenor + ' bulan'
      + '\nStatus : DITOLAK'
      + '\n\nSilakan menghubungi koordinator/admin untuk keterangan lebih lanjut.'
      + waFooter());
    notifKoordinatorKelompokWA(userById(p.userId).kelompokId, waHeader('PEMBIAYAAN DITOLAK')
      + waAnggotaInfo(userById(p.userId))
      + '\nJumlah Pembiayaan : ' + rupiah(p.jumlahPinjaman)
      + '\nJangka Waktu : ' + p.tenor + ' bulan'
      + waFooter());
    bigSuccess('Pengajuan ditolak');
    renderContent();
  });
}
function hapusPembiayaan(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p) return;
  confirmDialog('Hapus pembiayaan?', 'Data pembiayaan '+userById(p.userId).nama+' ('+rupiah(p.jumlahPinjaman)+') akan dihapus permanen, termasuk riwayat angsuran.', 'danger', ()=>{
    confirmDialog('Konfirmasi lagi', 'Yakin ingin menghapus pembiayaan ini? Data tidak bisa dikembalikan.', 'danger', ()=>{
      DB.pembiayaan = DB.pembiayaan.filter(x=>x.id!==pembId);
      DB.setoran = DB.setoran.filter(s=>s.pembiayaanId!==pembId);
      DB.angsuran = DB.angsuran.filter(a=>a.pembiayaanId!==pembId);
      persist();
      supabaseClient.from(TABLES.pembiayaan).delete().eq('id', pembId).then();
      supabaseClient.from(TABLES.setoran).delete().eq('pembiayaan_id', pembId).then();
      supabaseClient.from(TABLES.angsuran).delete().eq('pembiayaan_id', pembId).then();
      addLog('Hapus pembiayaan', userById(p.userId).nama + ' - ' + rupiah(p.jumlahPinjaman));
      bigSuccess('Pembiayaan berhasil dihapus');
      if(currentPage.includes('detail')) go('admin_pembiayaan');
      else renderContent();
    });
  });
}

function downloadAngsuranPDF(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p) return;
  const nas = userById(p.userId);
  const totalKew = (p.jumlahPinjaman||0) + marginNominalOf(p);
  const totalDibayar = (p.riwayatAngsuran||[]).reduce((s,a)=>s+a.jumlah,0);
  const sisaTagihan = Math.max(totalKew - totalDibayar, 0);
  const riwayat = (p.riwayatAngsuran || []).slice().reverse();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const orgName = (DB.koperasi && DB.koperasi.nama) || 'UB Rukun Barokah';
  const tgl = new Date().toLocaleString('id-ID', {day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  doc.setFontSize(13);
  doc.text(orgName, 14, 16);
  doc.setFontSize(10.5);
  doc.text('Buku Angsuran Pembiayaan', 14, 23);
  doc.setFontSize(8.5);
  doc.setTextColor(120);
  doc.text('Dicetak: ' + tgl, 14, 28.5);
  doc.setTextColor(0);
  doc.autoTable({
    head:[['Identitas Nasabah','']],
    body:[
      ['Nama', nas.nama || '-'],
      ['Kelompok', kelompokName(nas.kelompokId)],
      ['No. Rekening', nas.noRekening || '-'],
      ['Pokok Pinjaman', rupiah(p.jumlahPinjaman)],
      ['Jangka Waktu', (p.tenor||0) + ' bulan'],
      ['Keuntungan', rupiah(marginNominalOf(p))],
      ['Angsuran / Bulan', rupiah(p.angsuranPerBulan)],
    ],
    startY: 33,
    styles:{ fontSize:8, cellPadding:2.5 },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    columnStyles:{ 0:{cellWidth:38, fontStyle:'bold'}, 1:{cellWidth:66} },
    margin:{right:14,left:14}
  });
  let y = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(10.5);
  doc.setTextColor(0);
  doc.text('Rekapitulasi', 14, y);
  doc.autoTable({
    head:[['Total Kewajiban','Total Dibayar','Sisa Tagihan']],
    body:[[rupiah(totalKew), rupiah(totalDibayar), rupiah(sisaTagihan)]],
    startY: y+4,
    styles:{ fontSize:8, cellPadding:3, halign:'center' },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    alternateRowStyles:{ fillColor:[244,248,244] },
    margin:{right:14,left:14}
  });
  y = doc.lastAutoTable.finalY + 6;
  doc.setFontSize(10.5);
  doc.setTextColor(0);
  doc.text('Riwayat Angsuran (' + riwayat.length + ')', 14, y);
  doc.autoTable({
    head:[['No','Tanggal','Angsuran ke','Jumlah']],
    body: riwayat.map((a,i)=>[String(i+1), fmtDateShort(a.tanggal), 'Ke-' + a.angsuranKe, rupiah(a.jumlah)]),
    startY: y+4,
    styles:{ fontSize:8, cellPadding:2.5 },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    alternateRowStyles:{ fillColor:[244,248,244] },
    columnStyles:{ 3:{halign:'right'} },
    margin:{right:14,left:14}
  });
  doc.save(sanitizeFileName('Buku Angsuran ' + nas.nama) + '.pdf');
  toast('PDF Buku Angsuran berhasil diunduh');
}

async function submitPengajuan(){
  const forced = document.getElementById('pemb-user-forced');
  const userId = forced ? forced.value : document.getElementById('pemb-user').value;
  const jumlah = parseIdr(document.getElementById('pemb-jumlah').value);
  const tenor = parseIdr(document.getElementById('pemb-tenor').value);
  const atur = DB.koperasi.aturKeuangan||{};
  const mMin = atur.marginNominal||50000, mMax = atur.marginMaxNominal||200000;
   const mp = parseIdr(document.getElementById('pemb-margin').value)||mMin;
   if(!jumlah || !tenor){ toast('Lengkapi jumlah dan jangka waktu'); return; }
   if(mp < mMin || mp > mMax){ toast('Keuntungan harus antara '+rupiah(mMin)+'-'+rupiah(mMax)); return; }
   const total = jumlah + mp;
   const p = {id:uid('pemb'), userId, jumlahPinjaman:jumlah, tenor, marginPersen:0, marginNominal:mp, angsuranPerBulan: Math.ceil(total/tenor/1000)*1000, mulai: nowISO(), sisaAngsuran:tenor, status:'berjalan', riwayatAngsuran:[], statusPengajuan:'approved'};
  DB.pembiayaan.push(p);
  const btn = document.querySelector('button[onclick="submitPengajuan()"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const result = await persistNow();
  if(!result.ok){
    // Gagal simpan ke server -> batalkan biar tidak "hilang" pas refresh & user tau ada masalah
    DB.pembiayaan = DB.pembiayaan.filter(x=>x.id!==p.id);
    toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek koneksi internet, lalu coba lagi'));
    if(btn){ btn.disabled = false; btn.textContent = 'Ajukan'; }
    renderContent();
    return;
  }
   addLog('Buat pengajuan pembiayaan', userById(userId).nama + ' - ' + rupiah(jumlah) + ' / ' + tenor + ' bulan (keuntungan '+rupiah(mp)+')');
  bigSuccess('Pengajuan berhasil dibuat');
  closeModal();
  renderContent();
}

function submitEditPengajuan(pembId){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p) return;
  const userId = document.getElementById('edit-pemb-user').value;
  const jumlah = parseIdr(document.getElementById('edit-pemb-jumlah').value);
  const tenor = parseIdr(document.getElementById('edit-pemb-tenor').value);
  const atur = DB.koperasi.aturKeuangan||{};
  const mMin = atur.marginNominal||50000, mMax = atur.marginMaxNominal||200000;
   const mp = parseIdr(document.getElementById('edit-pemb-margin').value)||mMin;
   if(!jumlah || !tenor){ toast('Lengkapi jumlah dan jangka waktu'); return; }
   if(mp < mMin || mp > mMax){ toast('Keuntungan harus antara '+rupiah(mMin)+'-'+rupiah(mMax)); return; }
   const total = jumlah + mp;
   const angsuranBaru = Math.ceil(total/tenor/1000)*1000;
   const sudahBayar = p.riwayatAngsuran.length;
   p.userId = userId;
   p.jumlahPinjaman = jumlah;
   p.tenor = tenor;
   p.marginPersen = 0;
   p.marginNominal = mp;
   p.angsuranPerBulan = angsuranBaru;
   if(sudahBayar>0 && p.statusPengajuan==='approved'){
     p.sisaAngsuran = Math.max(tenor - sudahBayar, 0);
   } else {
     p.sisaAngsuran = tenor;
   }
   if(p.statusPengajuan==='pending' && sudahBayar===0){
     if(tenor>0) p.status = 'pending';
   } else if(p.statusPengajuan==='approved'){
     p.status = p.sisaAngsuran<=0 ? 'lunas' : 'berjalan';
   }
   persist();
   addLog('Edit pengajuan pembiayaan', userById(userId).nama + ' - ' + rupiah(jumlah) + ' / ' + tenor + ' bulan (keuntungan '+rupiah(mp)+')');

  renderContent();
}

async function syncKoorKelompok(userId, newKelompokId){
  // Lepaskan koordinator dari kelompok lama (jika ada) yang masih menunjuk ke dia
  const oldKel = DB.koperasi.kelompok.find(k=>(k.koorId||k.koor_id)===userId && k.id!==newKelompokId);
  const newKel = DB.koperasi.kelompok.find(k=>k.id===newKelompokId);
  const toSave = [];
  if(oldKel){ oldKel.koorId = null; oldKel.koor_id = null; toSave.push(oldKel); }
  if(newKel){ newKel.koorId = userId; toSave.push(newKel); }
  if(SUPABASE_ENABLED){
    for(const kel of toSave){
      const { error } = await upsertToSupabase(TABLES.kelompok, toSnake(kel));
      if(error) console.error('Supabase upsert kelompok error:', error);
    }
  }
}
async function submitUser(existingId){
  const role = document.getElementById('um-role').value;
  const username = document.getElementById('um-username').value.trim();
  const password = document.getElementById('um-password').value;
  const kelompokEl = document.getElementById('um-kelompok');
  const kelompokId = kelompokEl ? kelompokEl.value : null;

  // Buat / perbarui akun login nasabah (pilih kelompok -> pilih nasabah di form)
  if(!existingId && role==='nasabah'){
    const memberId = document.getElementById('um-member') ? document.getElementById('um-member').value : '';
    const target = DB.users.find(u=>u.id===memberId && u.role==='nasabah');
    if(!target){ toast('Pilih nasabah dari daftar terlebih dahulu'); return; }
    if(!username || !password){ toast('Lengkapi username & kata sandi'); return; }
    if(DB.users.some(u=>u.username===username && u.id!==target.id)){ toast('Nama pengguna sudah dipakai'); return; }
    // Kasus 1: nasabah belum punya akun login (_noAkun) -> buat akun baru resmi
    if(target._noAkun){
      const newId = uid('u');
      const newUser = {
        id: newId, username, password, role: 'nasabah', nama: target.nama,
        anggotaId: target.id, kelompokId: target.kelompokId, noRekening: target.noRekening,
        noHp: target.noHp || '', saham: target.saham || {s_A:0,s_B:0,s_C:0},
        status: target.status || 'aktif', createdAt: nowISO()
      };
      DB.users = DB.users.filter(u=>u.id!==target.id); // ganti entri sementara (_noAkun), hubungi anggota lama
      DB.users.push(newUser);
      if(SUPABASE_ENABLED){
        upsertToSupabase(TABLES.users, toSnake(newUser)).then(r=>{ if(r.error) console.error('Supabase user err', r.error); });
        upsertToSupabase(TABLES.anggota, { id: target.id, nama: target.nama, no_rekening: target.noRekening, kelompok_id: target.kelompokId, no_hp: target.noHp || null, status: 'aktif' }).then(r=>{ if(r.error) console.error('Supabase anggota err', r.error); });
      }
      addLog('Tambah pengguna', 'Membuat akun login untuk nasabah: ' + target.nama);
      bigSuccess('Akun login untuk ' + target.nama + ' berhasil dibuat');
    }
    // Kasus 2: nasabah sudah punya akun -> perbarui username & kata sandi
    else {
      const prevUn = target.username;
      target.username = username; target.password = password;
      if(SUPABASE_ENABLED){
        upsertToSupabase(TABLES.users, { id: target.id, username, password }).then(r=>{ if(r.error) console.error('Supabase user err', r.error); });
      }
      addLog('Ubah pengguna', 'Memperbarui akun login nasabah: ' + target.nama + (prevUn!==username?' (username ' + prevUn + ' -> ' + username + ')':''));
      bigSuccess('Akun login untuk ' + target.nama + ' telah diperbarui');
    }
    persist();
    closeModal();
    renderContent();
    return;
  }

  const nama = existingId
    ? document.getElementById('um-nama').value.trim()
    : document.getElementById('um-nama').value.trim();
  if(!nama || !username || !password){ toast('Lengkapi semua data'); return; }
  if(!existingId && DB.users.some(u=>u.username===username)){ toast('Nama pengguna sudah dipakai'); return; }
  if(existingId && DB.users.some(u=>u.username===username && u.id!==existingId)){ toast('Nama pengguna sudah dipakai'); return; }

  const btn = document.querySelector('button[onclick^="submitUser("]');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }

  if(existingId){
    const u = userById(existingId);
    const noHp = document.getElementById('um-nohp') ? document.getElementById('um-nohp').value.trim() : u.noHp;
    const tgChat = document.getElementById('um-tgchat') ? document.getElementById('um-tgchat').value.trim() : u.telegramChatId;
    // Simpan nilai lama untuk rollback kalau gagal simpan ke server
    const prev = { nama: u.nama, username: u.username, password: u.password, kelompokId: u.kelompokId, noHp: u.noHp, telegramChatId: u.telegramChatId };
    u.nama = nama; u.password = password; u.noHp = noHp; u.telegramChatId = tgChat;
    if(u.id!=='u_admin') u.username = username;
    if(u.role!=='admin') u.kelompokId = kelompokId;
    if(u.role==='koordinator') await syncKoorKelompok(u.id, kelompokId);
    const result = await persistNow();
    if(!result.ok){
      // Gagal simpan ke server -> kembalikan nilai lama biar tidak bohong soal status "sukses"
      u.nama = prev.nama; u.username = prev.username; u.password = prev.password; u.kelompokId = prev.kelompokId; u.noHp = prev.noHp; u.telegramChatId = prev.telegramChatId;
      toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek koneksi internet, lalu coba lagi'));
      if(btn){ btn.disabled = false; btn.textContent = 'Simpan'; }
      renderContent();
      return;
    }
    addLog('Ubah pengguna', 'Memperbarui data ' + nama);
  } else {
    const newUser = {id:uid('u'), username, password, role, nama, noHp: document.getElementById('um-nohp') ? document.getElementById('um-nohp').value.trim() : '', telegramChatId: document.getElementById('um-tgchat') ? document.getElementById('um-tgchat').value.trim() : '', createdAt: nowISO()};
    if(role!=='admin') newUser.kelompokId = kelompokId;
    DB.users.push(newUser);
    if(role==='koordinator') await syncKoorKelompok(newUser.id, kelompokId);
    const result = await persistNow();
    if(!result.ok){
      DB.users = DB.users.filter(x=>x.id!==newUser.id);
      toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek koneksi internet, lalu coba lagi'));
      if(btn){ btn.disabled = false; btn.textContent = 'Simpan'; }
      renderContent();
      return;
    }
    addLog('Tambah pengguna', 'Menambahkan ' + roleLabel(role).toLowerCase() + ': ' + nama);
  }
  bigSuccess('Data pengguna disimpan');
  closeModal();
  renderContent();
}

function computeLapModalData(){
  const pemb = DB.pembiayaan || [];
  const setoran = DB.setoran || [];
  const tx = DB.tabunganTx || [];
  function marginPerAngsuran(p){
    if(!p || !p.tenor) return 0;
    return Math.round(marginNominalOf(p) / p.tenor);
  }
  const now = new Date();
  let minDate = now;
  [].concat(pemb.map(p=>p.mulai), setoran.map(s=>s.tanggal), tx.map(t=>t.tanggal)).forEach(d=>{
    if(!d) return;
    const dt = new Date(d);
    if(!isNaN(dt) && dt < minDate) minDate = dt;
  });
  const startY = minDate.getFullYear(), startM = minDate.getMonth();
  const endY = now.getFullYear(), endM = now.getMonth();
  const months = [];
  let y = startY, m = startM;
  while(y < endY || (y===endY && m<=endM)){
    months.push({y,m});
    m++; if(m>11){ m=0; y++; }
  }
  if(!months.length) return [];
  let cumPokokRealisasi = 0, cumPokokTerbayar = 0, cumTabMasuk = 0, cumTabKeluar = 0, cumKas = 0;
  const totalSahamSaatIni = totalNilaiSahamSemua();
  const byYear = {};
  months.forEach(({y,m})=>{
    const pembBulanIni = pemb.filter(p=>{ const d=new Date(p.mulai); return !isNaN(d) && d.getFullYear()===y && d.getMonth()===m; });
    const pokokRealisasi = pembBulanIni.reduce((s,p)=>s+(p.jumlahPinjaman||0),0);
    const marginRealisasi = pembBulanIni.reduce((s,p)=>s+marginNominalOf(p),0);
    const angsuranBulanIni = setoran.filter(s=>{ if(s.jenis!=='angsuran') return false; const d=new Date(s.tanggal); return !isNaN(d) && d.getFullYear()===y && d.getMonth()===m; });
    const totalAngsuran = angsuranBulanIni.reduce((s,a)=>s+(a.jumlah||0),0);
    let keuntungan = 0, pokokTerbayarBulanIni = 0;
    angsuranBulanIni.forEach(a=>{
      const p = pemb.find(pp=>pp.id===a.pembiayaanId);
      const marginBagian = p ? Math.min(marginPerAngsuran(p), a.jumlah||0) : 0;
      keuntungan += marginBagian;
      pokokTerbayarBulanIni += Math.max(0, (a.jumlah||0) - marginBagian);
    });
    const txBulanIni = tx.filter(t=>{ const d=new Date(t.tanggal); return !isNaN(d) && d.getFullYear()===y && d.getMonth()===m; });
    const tabMasuk = txBulanIni.filter(t=>t.tipe==='setor').reduce((s,t)=>s+(t.jumlah||0),0);
    const tabKeluar = txBulanIni.filter(t=>t.tipe==='tarik').reduce((s,t)=>s+(t.jumlah||0),0);
    cumPokokRealisasi += pokokRealisasi;
    cumPokokTerbayar += pokokTerbayarBulanIni;
    cumTabMasuk += tabMasuk;
    cumTabKeluar += tabKeluar;
    cumKas += (tabMasuk + totalAngsuran) - (tabKeluar + pokokRealisasi);
    const piutang = Math.max(0, cumPokokRealisasi - cumPokokTerbayar);
    const tabSaldo = cumTabMasuk - cumTabKeluar;
    if(!byYear[y]) byYear[y] = { tahun:String(y), rows:[], total:{pokok:0,margin:0,totalAngsuran:0,keuntungan:0,tabMasuk:0,tabPenarikan:0} };
    byYear[y].rows.push({
      bulan: m+1, piutang, pokok: pokokRealisasi, margin: marginRealisasi,
      totalAngsuran, keuntungan, tabMasuk, tabPenarikan: tabKeluar, tabSaldo,
      saham: totalSahamSaatIni, kas: cumKas
    });
    byYear[y].total.pokok += pokokRealisasi;
    byYear[y].total.margin += marginRealisasi;
    byYear[y].total.totalAngsuran += totalAngsuran;
    byYear[y].total.keuntungan += keuntungan;
    byYear[y].total.tabMasuk += tabMasuk;
    byYear[y].total.tabPenarikan += tabKeluar;
  });
  return Object.keys(byYear).sort().map(k=>byYear[k]);
}
const LAP_MODAL_BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function totalNilaiSaham(u){
  const uname = String(u.nama||'').trim().toLowerCase();
  const holdings = (DB.kepemilikanSaham||[]).filter(k=>String(k.nama||'').trim().toLowerCase()===uname);
  const jns = DB.koperasi.saham.jenis||[];
  return holdings.reduce((s,k)=>{ const j=jns.find(jj=>jj.id===k.jenisId); return s+(j?k.lembar*nilaiSahamPerLembar(j):0); },0);
}
function nilaiSahamPerLembar(j){
  if(!j || !j.nominalPerLembar) return 0;
  var pct = (DB.koperasi.saham.pemupukanPersen||0);
  return Math.round(j.nominalPerLembar * (1 + pct/100));
}
// Hitung SHU per pemilik saham, berbobot per JENIS saham (mis. SAHAM A 50%, SAHAM B 30%, SAHAM C 20%).
// Pool SHU Saham dipecah dulu ke tiap jenis sesuai persennya (j.shuPersen), lalu di dalam
// satu jenis dibagi lagi ke pemiliknya secara proporsional terhadap nilai kepemilikan (lembar x harga/lembar)
// di jenis itu saja. Pemilik yang hanya punya jenis dgn 0% tidak dapat SHU dari jenis itu.
function hitungShuSahamOwners(poolSHUSaham, jns, ks){
  var owners = {}; // nama -> total shu
  (ks||[]).forEach(function(k){ if(!(k.nama in owners)) owners[k.nama] = 0; });
  (jns||[]).forEach(function(j){
    var poolJenis = poolSHUSaham * (j.shuPersen||0) / 100;
    if(poolJenis<=0) return;
    var totalNilaiJenis = (ks||[]).filter(function(k){ return k.jenisId===j.id; })
      .reduce(function(s,k){ return s+k.lembar*nilaiSahamPerLembar(j); },0);
    if(totalNilaiJenis<=0) return;
    (ks||[]).forEach(function(k){
      if(k.jenisId!==j.id) return;
      var nilaiOwner = k.lembar*nilaiSahamPerLembar(j);
      owners[k.nama] = (owners[k.nama]||0) + poolJenis * nilaiOwner/totalNilaiJenis;
    });
  });
  return owners;
}

function cetakLapModal(tahun){
  const data = computeLapModalData();
  const yd = data.find(y=>y.tahun===tahun);
  if(!yd){ toast('Data tidak ditemukan'); return; }
  const { jsPDF } = window.jspdf;
  const fmt = v => (v===null || v===undefined) ? '-' : rupiah(v);
  const cols = LAP_MODAL_COLS, totalKeys = LAP_MODAL_TOTAL_KEYS;
  const tgl = new Date().toLocaleDateString('id-ID',{year:'numeric',month:'long',day:'numeric'});
  const orgName = (DB.koperasi && DB.koperasi.nama) || 'Koperasi';
  const doc = new jsPDF({ orientation:'landscape' });
  doc.setFontSize(13);
  doc.text(orgName.toUpperCase(), 14, 14);
  doc.setFontSize(10.5);
  doc.text('POSISI MODAL BERJALAN \u2014 TAHUN ' + yd.tahun, 14, 20.5);
  doc.setFontSize(8.5);
  doc.setTextColor(120);
  doc.text('Dicetak: ' + tgl, 14, 26);
  doc.setTextColor(0);
  const body = yd.rows.map(r=>[LAP_MODAL_BULAN[r.bulan-1], ...cols.map(c=>fmt(r[c.k]))]);
  if(yd.total){
    body.push(['Total', ...cols.map(c=>{
      const v = totalKeys.includes(c.k) ? yd.total[c.k] : (yd.rows[yd.rows.length-1]||{})[c.k];
      return fmt(v);
    })]);
  }
  doc.autoTable({
    head: [['Bln', ...cols.map(c=>c.l)]],
    body,
    startY: 31,
    styles:{ fontSize:7.5, cellPadding:2.5, halign:'right' },
    headStyles:{ fillColor:[11,61,46], textColor:255, halign:'center' },
    columnStyles:{ 0:{ halign:'center', fontStyle:'bold' } },
    alternateRowStyles:{ fillColor:[244,248,244] },
    didParseCell: function(d){
      if(yd.total && d.row.index===body.length-1 && d.section==='body'){ d.cell.styles.fillColor=[218,232,222]; d.cell.styles.fontStyle='bold'; }
    }
  });
  const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) || 40;
  doc.setFontSize(7.5);
  doc.setTextColor(100);
  const catatan = LAP_MODAL_CATATAN.replace(/&minus;/g, '-');
  doc.text(doc.splitTextToSize(catatan, 270), 14, finalY + 8);
  doc.save(sanitizeFileName('Posisi Modal Berjalan ' + yd.tahun) + '.pdf');
  toast('File PDF berhasil diunduh');
}
function exportLapModalXLS(tahun){

function totalNilaiSahamSemua(){
  const jns = (DB.koperasi && DB.koperasi.saham && DB.koperasi.saham.jenis)||[];
  return (DB.kepemilikanSaham||[]).reduce((s,k)=>{ const j=jns.find(jj=>jj.id===k.jenisId); return s+(j?k.lembar*nilaiSahamPerLembar(j):0); },0);
}
function computeNeraca(){
  const simpananByJenis = {};
  (DB.tabunganAccounts||[]).forEach(a=>{ const id=a.jenisId||a.jenis_id; simpananByJenis[id]=(simpananByJenis[id]||0)+a.saldo; });
  const jenisSimpanan = (DB.koperasi.jenisTabungan||[]).map(j=>({id:j.id, nama:j.nama, saldo: simpananByJenis[j.id]||0})).filter(x=>x.saldo>0);
  const totalSimpanan = jenisSimpanan.reduce((s,x)=>s+x.saldo,0);
  let pokok = 0, bayar = 0, piutang = 0;
  (DB.pembiayaan||[]).forEach(p=>{
    pokok += p.jumlahPinjaman||0;
    const kew = (p.jumlahPinjaman||0)+marginNominalOf(p);
    const tp = (p.riwayatAngsuran||[]).reduce((s,a)=>s+a.jumlah,0);
    bayar += tp;
    piutang += Math.max(kew-tp,0);
  });
  const kas = totalSimpanan - pokok + bayar;
  const saham = totalNilaiSahamSemua();
  const totalAset = kas + piutang;
  const shu = totalAset - totalSimpanan - saham;
  return { simpanan: jenisSimpanan, totalSimpanan, pokok, bayar, kas, piutang, saham, shu, totalAset };
}

const LAP_LABA_RUGI_CATATAN = 'Laporan Laba Rugi dihitung berbasis realisasi: pendapatan margin diakui setiap ada pembayaran angsuran (margin per angsuran = total margin dibagi tenor). Beban (bagi hasil tabungan, operasional, cadangan resiko, penyusutan, zakat, dana sosial) adalah alokasi dari margin yang tercatat di pool dana; SHU Saham diperlakukan sebagai alokasi laba untuk anggota, bukan beban. Sisa Laba / Cadangan Koperasi = Laba Bersih &minus; alokasi SHU Saham.';
function computeLapLabaRugiData(){
  const pemb = DB.pembiayaan || [];
  const atur = DB.koperasi.aturKeuangan || {};
  const pools = atur.pools || [];
  const dana = atur.dana || {};
  function marginPerAngsuran(p){
    if(!p || !p.tenor) return 0;
    return Math.round(marginNominalOf(p) / p.tenor);
  }
  // Sumber angsuran dibaca dari riwayatAngsuran pembiayaan (berlaku untuk semua
  // jalur bayar), karena tabel setoran bisa kosong meski pembayaran tercatat.
  const angsurans = [];
  pemb.forEach(p=>(p.riwayatAngsuran||[]).forEach(a=>{
    if(!a.tanggal) return;
    angsurans.push({pembiayaanId:p.id, jumlah:a.jumlah||0, tanggal:a.tanggal});
  }));
  // Ringkasan total (semua waktu): pendapatan dihitung ulang dari angsuran,
  // beban memakai nilai pool dana aktual yang terakumulasi saat angsuran dibayar.
  const totalPendapatan = angsurans.reduce((s,a)=>{
    const p = pemb.find(pp=>pp.id===a.pembiayaanId);
    return s + (p ? Math.min(marginPerAngsuran(p), a.jumlah||0) : 0);
  },0);
  const totalBeban = pools.reduce((s,p)=> p.id==='shu_saham' ? s : s+(dana[p.id]||0), 0);
  const shuSaham = dana.shu_saham||0;
  const labaBersih = totalPendapatan - totalBeban;
  const sisaLaba = labaBersih - shuSaham;
  // Rincian per bulan (rekomputasi alokasi pool memakai persentase saat ini)
  const now = new Date();
  let minDate = now;
  angsurans.forEach(a=>{ if(!a.tanggal) return; const dt=new Date(a.tanggal); if(!isNaN(dt) && dt<minDate) minDate=dt; });
  const startY = minDate.getFullYear(), startM = minDate.getMonth();
  const endY = now.getFullYear(), endM = now.getMonth();
  const months = [];
  let yy = startY, mm = startM;
  while(yy < endY || (yy===endY && mm<=endM)){
    months.push({y:yy,m:mm});
    mm++; if(mm>11){ mm=0; yy++; }
  }
  if(!months.length) months.push({y:now.getFullYear(), m:now.getMonth()});
  const byYear = {};
  let kumLaba = 0;
  months.forEach(o=>{
    const y = o.y, m = o.m;
    const bulanIni = angsurans.filter(a=>{ const d=new Date(a.tanggal); return !isNaN(d) && d.getFullYear()===y && d.getMonth()===m; });
    let pendapatan = 0;
    const bebanBulan = {};
    pools.forEach(p=>bebanBulan[p.id]=0);
    bulanIni.forEach(a=>{
      const p = pemb.find(pp=>pp.id===a.pembiayaanId);
      if(!p) return;
      const marginBagian = Math.min(marginPerAngsuran(p), a.jumlah||0);
      pendapatan += marginBagian;
      pools.forEach(pool=>{ bebanBulan[pool.id] += Math.round(marginBagian * (pool.persen||0) / 100); });
    });
    const totalBebanBulan = pools.reduce((s,p)=> p.id==='shu_saham' ? s : s+(bebanBulan[p.id]||0), 0);
    const laba = pendapatan - totalBebanBulan;
    kumLaba += laba;
    if(!byYear[y]) byYear[y] = {tahun:String(y), rows:[], total:{pendapatan:0, beban:0, laba:0, shuSaham:0}, bebanPools:{}};
    byYear[y].rows.push({bulan:m+1, pendapatan, bebanBulan, totalBeban: totalBebanBulan, laba, kumLaba});
    byYear[y].total.pendapatan += pendapatan;
    byYear[y].total.beban += totalBebanBulan;
    byYear[y].total.laba += laba;
    pools.forEach(p=>{
      if(p.id==='shu_saham'){ byYear[y].total.shuSaham += bebanBulan[p.id]||0; return; }
      byYear[y].bebanPools[p.id] = (byYear[y].bebanPools[p.id]||0) + (bebanBulan[p.id]||0);
    });
  });
  return {
    pools, dana,
    byYear: Object.keys(byYear).sort().map(k=>byYear[k]),
    totalPendapatan, totalBeban, shuSaham, labaBersih, sisaLaba
  };
}

/* =========================================================
   LAPORAN RINGKAS (menu terpisah)
   Angsuran Masuk, Angsuran Macet (real-time, sama seperti dashboard),
   SHU Tabungan, SHU Saham, dan tiap pool ATURAN KEUANGAN, per bulan/tahun.
========================================================= */
function computeLapRingkasData(){
  const base = computeLapLabaRugiData();
  // Baca angsuran masuk dari riwayatAngsuran pembiayaan (berlaku untuk semua
  // jalur bayar), bukan hanya dari tabel setoran.
  const pemb = DB.pembiayaan || [];
  const riwayat = [];
  pemb.forEach(p=>(p.riwayatAngsuran||[]).forEach(a=>riwayat.push({tanggal:a.tanggal, jumlah:a.jumlah||0})));
  // total angsuran masuk (nominal penuh yg dibayar, bukan cuma bagian margin) per tahun+bulan
  const masukMap = {};
  riwayat.forEach(a=>{
    const d = new Date(a.tanggal);
    if(isNaN(d)) return;
    const y = d.getFullYear(), m = d.getMonth();
    if(!masukMap[y]) masukMap[y] = {};
    masukMap[y][m] = (masukMap[y][m]||0) + (a.jumlah||0);
  });
  // Pastikan bulan yang hanya punya catatan riwayatAngsuran (tanpa baris setoran)
  // tetap muncul di grid tahunan.
  const bulanSet = {};
  base.byYear.forEach(yd=>yd.rows.forEach(r=>bulanSet[yd.tahun+'-'+r.bulan]=true));
  riwayat.forEach(a=>{ const d=new Date(a.tanggal); if(!isNaN(d)) bulanSet[d.getFullYear()+'-'+(d.getMonth()+1)] = true; });
  // Gabungkan bulan tambahan dari riwayatAngsuran ke grid byYear (basis = setoran),
  // agar bulan yang hanya punya catatan riwayatAngsuran tetap muncul.
  const byYear = {};
  base.byYear.forEach(yd=>{
    byYear[yd.tahun] = JSON.parse(JSON.stringify({
      tahun: yd.tahun, rows: yd.rows, total: yd.total, bebanPools: yd.bebanPools||{}
    }));
    byYear[yd.tahun].rows.forEach(r=>r.angsuranMasuk = (r.angsuranMasuk||0));
  });
  Object.keys(bulanSet).forEach(k=>{
    const [yStr,mStr] = k.split('-'); const y = Number(yStr), m = Number(mStr);
    if(!byYear[y]) byYear[y] = {tahun:String(y), rows:[], total:{angsuranMasuk:0, pendapatan:0, beban:0, shuSaham:0}, bebanPools:{}};
    const row = byYear[y].rows.find(r=>r.bulan===m);
    if(!row) byYear[y].rows.push({bulan:m, pendapatan:0, bebanBulan:{}, totalBeban:0, laba:0, kumLaba:0, angsuranMasuk:0});
  });
  Object.keys(byYear).forEach(y=>{
    byYear[y].rows.sort((a,b)=>a.bulan-b.bulan);
    byYear[y].rows.forEach(r=>r.angsuranMasuk = (masukMap[y]&&masukMap[y][r.bulan-1])||0);
    byYear[y].total.angsuranMasuk = byYear[y].rows.reduce((s,r)=>s+r.angsuranMasuk,0);
  });
  base.byYear = Object.keys(byYear).sort().map(k=>byYear[k]);
  // Pecah pool "Bagi Hasil" (shu) jadi SHU Saham + Bagi Hasil Tabungan menurut
  // persentase aturan keuangan (bagiHasilTabunganPersen / default 100).
  const atur = DB.koperasi.aturKeuangan || {};
  const bhTabPersen = Math.max(0, Math.min(100, atur.bagiHasilTabunganPersen!=null?atur.bagiHasilTabunganPersen:(atur.bagiHasilPersen!=null?atur.bagiHasilPersen:100)));
  const bhSahamPersen = 100 - bhTabPersen;
  const splitPool = (val)=>({ bagiHasilTabungan: Math.round((val||0)*bhTabPersen/100), shuSaham: Math.round((val||0)*bhSahamPersen/100) });
  base.byYear.forEach(yd=>{
    (yd.rows||[]).forEach(r=>{
      const sp = splitPool((r.bebanBulan&&r.bebanBulan['shu'])||0);
      if(r.bebanBulan){ r.bebanBulan['bagiHasilTabungan'] = sp.bagiHasilTabungan; r.bebanBulan['shuSaham'] = sp.shuSaham; }
    });
    const tsp = splitPool((yd.bebanPools&&yd.bebanPools['shu'])||0);
    if(yd.bebanPools){ yd.bebanPools['bagiHasilTabungan'] = tsp.bagiHasilTabungan; yd.bebanPools['shuSaham'] = tsp.shuSaham; }
    if(yd.total) yd.total.shuSaham = tsp.shuSaham;
  });
  const pools = (base.pools||[]).filter(p=>p.id!=='shu').map(p=>p);
  pools.push({id:'shuSaham', label:'SHU Saham', persen:bhSahamPersen});
  pools.push({id:'bagiHasilTabungan', label:'Bagi Hasil Tabungan', persen:bhTabPersen});
  const overdue = computeOverdueLoans();
  const totalTertunggak = overdue.reduce((s,o)=>s+o.telat*(o.p.angsuranPerBulan||0),0);
  const totalSimpanan = DB.tabunganAccounts.reduce((s,a)=>s+a.saldo,0);
  const totalPembiayaanAktif = DB.pembiayaan.filter(p=>p.status==='berjalan' && p.statusPengajuan==='approved').reduce((s,p)=>{const tp=(p.riwayatAngsuran||[]).reduce((a,x)=>a+x.jumlah,0);return s+(tp>0?p.jumlahPinjaman+marginNominalOf(p)-tp:p.angsuranPerBulan*p.sisaAngsuran);},0);
  const poolSHUTabungan = (base.dana && base.dana.bagi_hasil_tabungan) || 0;
  return { pools: pools, byYear: base.byYear, overdue, totalTertunggak, totalSimpanan, totalPembiayaanAktif, poolSHUTabungan };
}

async function testNotifWA(){
  const resultEl = document.getElementById('wa-test-result');
  if(resultEl) resultEl.innerHTML = '';
  const cfg = DB.koperasi.info.notifWA || {};
  const token = (document.getElementById('wa-token').value.trim()) || cfg.token || '';
  if(!token){ toast('Isi token API Fonnte dulu, lalu simpan'); return; }
  const no = (document.getElementById('wa-test-number').value.trim()) || (cfg.adminNumbers||[])[0] || '';
  if(!no){ toast('Isi nomor tujuan tes'); return; }
  const target = normalizeNoHp(no);
  if(!target){ toast('Nomor tidak valid'); return; }
  if(resultEl){ resultEl.innerHTML = '<span style="color:var(--muted);">Mengirim ke <b>'+no+'</b>...</span>'; }
  try {
    const res = await fetch('https://api.fonnte.com/send', {
      method: 'POST',
      headers: { 'Authorization': token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ target, message: '🔔 [Tes Notifikasi] Aplikasi Koperasi '+DB.koperasi.nama+' berhasil terhubung ke Fonnte. Pesan uji dari Pengaturan WhatsApp.' })
    });
    const data = await res.json();
    if(data && data.status){
      if(resultEl) resultEl.innerHTML = '<span style="color:#1B7F3B;">✔ Pesan tes terkirim ke '+no+'.</span>';
      bigSuccess('WA tes terkirim');
    } else {
      const detail = data && (data.detail || data.msg || data.message) ? (data.detail || data.msg || data.message) : JSON.stringify(data);
      if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger);">✘ Gagal: '+detail+'</span>';
      toast('Gagal kirim WA tes');
    }
  } catch(e){
    if(resultEl) resultEl.innerHTML = '<span style="color:var(--danger);">✘ Gagal: '+e.message+'</span>';
    toast('Gagal kirim WA tes');
  }
}

let _pendingIconImage = null;
function handleIconFileChange(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const img = new Image();
  img.onload = function(){
    const MAX = 300;
    let w = img.width, h = img.height;
    if(w>MAX || h>MAX){ const r=Math.min(MAX/w,MAX/h); w=Math.round(w*r); h=Math.round(h*r); }
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    _pendingIconImage = c.toDataURL('image/png');
    document.getElementById('set-icon-preview').innerHTML = '<img src="'+_pendingIconImage+'" alt="logo" style="width:100%;height:100%;object-fit:cover;">';
    ev.target.value = '';
  };
  img.onerror = function(){ toast('Gagal membaca file gambar'); URL.revokeObjectURL(img.src); ev.target.value=''; };
  const url = URL.createObjectURL(file);
  img.src = url;
}

function syncBagiHasilTabungan(v){
  v = Math.max(0, Math.min(100, parseInt(v)||0));
  const saham = document.getElementById('atur-bh-saham');
  if(saham){ saham.value = 100 - v; }
  const hint = document.getElementById('hint-bagi-hasil');
  if(hint){ hint.innerHTML = 'Total Saham + Tabungan harus = 100%. Saat ini Tabungan <span id="val-bh-tabungan">'+v+'</span>% + Saham <span id="val-bh-saham">'+(100-v)+'</span>%'; }
}
function syncBagiHasilSaham(v){
  v = Math.max(0, Math.min(100, parseInt(v)||0));
  const tabungan = document.getElementById('atur-bh-tabungan');
  if(tabungan){ tabungan.value = 100 - v; }
  const hint = document.getElementById('hint-bagi-hasil');
  if(hint){ hint.innerHTML = 'Total Saham + Tabungan harus = 100%. Saat ini Tabungan <span id="val-bh-tabungan">'+(100-v)+'</span>% + Saham <span id="val-bh-saham">'+v+'</span>%'; }
}

async function simpanAturKeuangan(){
  const marginNominal = Math.max(0, parseIdr(document.getElementById('atur-margin').value)||0);
  const marginMaxNominal = Math.max(0, parseIdr(document.getElementById('atur-margin-max').value)||0);
  if(marginMaxNominal < marginNominal){ toast('Keuntungan maksimum tidak boleh lebih kecil dari minimum'); return; }
  const pools = (DB.koperasi.aturKeuangan.pools||[]).map(p=>({...p, persen: Math.max(0, parseIdr(document.getElementById('pool-'+p.id).value)||0)}));
  const total = pools.reduce((s,p)=>s+p.persen,0);
  if(Math.abs(total-100)>0.01){ toast('Total alokasi pool harus = 100% (sekarang '+total+'%)'); return; }
  const bhTabEl = document.getElementById('atur-bh-tabungan');
  const bhSahamEl = document.getElementById('atur-bh-saham');
  if(bhTabEl){
    const bhTab = Math.max(0, Math.min(100, parseInt(bhTabEl.value)||0));
    const bhSaham = Math.max(0, Math.min(100, parseInt(bhSahamEl.value)||0));
    if(bhTab + bhSaham !== 100){ toast('Total Bagi Hasil (Saham + Tabungan) harus = 100%'); return; }
  }
  if(!DB.koperasi.aturKeuangan) DB.koperasi.aturKeuangan = {};
  // Simpan backup nilai lama untuk rollback kalau gagal
  const backup = JSON.parse(JSON.stringify(DB.koperasi.aturKeuangan));
  DB.koperasi.aturKeuangan.marginNominal = marginNominal;
  DB.koperasi.aturKeuangan.marginMaxNominal = marginMaxNominal;
  DB.koperasi.aturKeuangan.pools = pools;
  if(bhTabEl){
    DB.koperasi.aturKeuangan.bagiHasilTabunganPersen = Math.max(0, Math.min(100, parseInt(bhTabEl.value)||0));
    DB.koperasi.aturKeuangan.bagiHasilSahamPersen = Math.max(0, Math.min(100, parseInt(bhSahamEl.value)||0));
  }
  if(!DB.koperasi.aturKeuangan.dana) DB.koperasi.aturKeuangan.dana = {};
  const btn = document.querySelector('button[onclick="simpanAturKeuangan()"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const result = await persistNow();
  if(!result.ok){
    // Gagal simpan ke Supabase -> rollback biar UI gak menyesatkan
    DB.koperasi.aturKeuangan = backup;
    toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek konsol untuk detail'));
    renderContent();
    return;
  }
  addLog('Atur keuangan', 'Memperbarui keuntungan (min-maks) dan alokasi pool');
  bigSuccess('Aturan keuangan disimpan');
  renderContent();
}

async function submitKelompok(){
  const nama = document.getElementById('kel-nama').value.trim();
  const koorId = document.getElementById('kel-koor').value || null;
  if(!nama){ toast('Nama wajib diisi'); return; }
  const newKel = {id:uid('kel'), nama, koorId: koorId};
  DB.koperasi.kelompok.push(newKel);
  addLog('Ubah pengaturan', 'Menambahkan kelompok: ' + nama);
  if(SUPABASE_ENABLED){
    const { error } = await upsertToSupabase(TABLES.kelompok, toSnake(newKel));
    if(error) console.error('Supabase upsert kelompok error:', error);
  }
  persist();
  bigSuccess('Kelompok ditambahkan');
  closeModal(); renderContent();

function deleteKelompok(id){
  confirmDialog('Hapus kelompok?', 'Anggota dalam kelompok ini tetap tersimpan.', 'danger', async ()=>{
    const idx = DB.koperasi.kelompok.findIndex(k=>k.id===id);
    if(idx===-1) return;
    DB.koperasi.kelompok.splice(idx,1);
    addLog('Ubah pengaturan', 'Menghapus kelompok: ' + id);
    if(SUPABASE_ENABLED){
      const { error } = await deleteFromSupabase(TABLES.kelompok, id);
      if(error) console.error('Supabase delete kelompok error:', error);
    }
    persist();
    bigSuccess('Kelompok dihapus');
    renderContent();
  });
}

async function submitSahamBaru(){
  const nama = document.getElementById('sh-nama').value.trim();
  const nominal = parseIdr(document.getElementById('sh-nominal').value)||0;
  const shuPersen = parseIdr(document.getElementById('sh-shu').value)||0;
  if(!nama || !nominal){ toast('Lengkapi nama dan nominal'); return; }
  const id = 's_'+nama.replace(/[^A-Za-z0-9]/g,'_').toUpperCase();
  DB.koperasi.saham.jenis.push({id, nama, nominalPerLembar:nominal, shuPersen});
  DB.users.forEach(u=>{ if(!u.saham) u.saham={}; u.saham[id]=0; });
  const result = await persistNow();
  if(!result.ok){
    DB.koperasi.saham.jenis = DB.koperasi.saham.jenis.filter(j=>j.id!==id);
    toast('Gagal menyimpan ke server: ' + (result.err && result.err.message ? result.err.message : 'cek konsol untuk detail'));
    renderContent();
    return;
  }
  addLog('Tambah saham', 'Menambahkan jenis saham: '+nama);
  bigSuccess('Jenis saham ditambahkan');
  closeModal(); renderContent();
}

async function simpanEditSahamJenis(id){
  const j = DB.koperasi.saham.jenis.find(j=>j.id===id);
  if(!j) return;
  const backup = {...j};
  j.nama = document.getElementById('sh-nama').value.trim() || j.nama;
  j.nominalPerLembar = parseIdr(document.getElementById('sh-nominal').value)||j.nominalPerLembar;
  j.shuPersen = parseIdr(document.getElementById('sh-shu').value)||0;
  const result = await persistNow();
  if(!result.ok){

}

// Susun daftar penerima SHU (baik SHU Saham maupun Bagi Hasil Tabungan) menjadi
// baris-baris [nama, jumlah] untuk dipakai bersama oleh unduh PDF & Excel.
function dataDaftarSHU(){
  const tab = currentSubState.shuTab||'saham';
  const atur = DB.koperasi.aturKeuangan || {};
  const dana = atur.dana || {};
  const jns = DB.koperasi.saham.jenis||[];
  const label = tab==='saham' ? 'SHU SAHAM' : 'BAGI HASIL TABUNGAN';
  const kolomNama = tab==='saham' ? 'Nama Pemilik Saham' : 'Nama';
  let rows = [];
  if(tab==='saham'){
    const ks = DB.kepemilikanSaham||[];
    const poolSHUSaham = dana.shu_saham||0;
    const owners = hitungShuSahamOwners(poolSHUSaham, jns, ks);
    rows = Object.keys(owners).map(n=>[n, Math.round(owners[n]||0)]);
  } else {
    const nasabah = DB.users.filter(u=>u.role==='nasabah');
    const totalMudharabah = DB.tabunganAccounts.reduce((s,a)=>s+a.saldo,0);
    const poolBHT = dana.bagi_hasil_tabungan||0;
    function ctkSaldoUser(u){ return DB.tabunganAccounts.filter(function(a){ return a.userId===u.id; }).reduce(function(s,a){ return s+a.saldo; },0); }
    var m = nasabah.filter(function(u){ return ctkSaldoUser(u)>0; });
    if(m.length===0) m = nasabah.filter(function(u){ return DB.tabunganAccounts.some(function(a){ return a.userId===u.id; }); });
    rows = m.map(function(u){
      var saldo = ctkSaldoUser(u);
      var porsi = totalMudharabah>0 ? saldo/totalMudharabah*100 : 0;
      var shu = poolBHT * porsi/100;
      return [u.nama, Math.round(shu)];
    });
  }
  return { label, kolomNama, rows };
}
function unduhPdfSHU(){
  const { label, kolomNama, rows } = dataDaftarSHU();
  if(!rows.length){ toast('Tidak ada data untuk diunduh'); return; }
  const { jsPDF } = window.jspdf;
  const tgl = new Date().toLocaleDateString('id-ID',{year:'numeric',month:'long',day:'numeric'});
  const doc = new jsPDF({ orientation:'portrait' });
  doc.setFontSize(13);
  doc.text((DB.koperasi.nama||'Koperasi').toUpperCase(), 14, 14);
  doc.setFontSize(10.5);
  doc.text(label, 14, 20.5);
  doc.setFontSize(8.5);
  doc.setTextColor(120);
  doc.text('Diunduh: ' + tgl, 14, 26);
  doc.setTextColor(0);
  doc.autoTable({
    head: [['No', kolomNama, 'SHU']],
    body: rows.map((r,i)=>[i+1, r[0], rupiah(r[1])]),
    startY: 31,
    styles:{ fontSize:9, cellPadding:3 },
    headStyles:{ fillColor:[11,61,46], textColor:255 },
    columnStyles:{ 0:{ halign:'center', cellWidth:12 }, 2:{ halign:'right' } }
  });
  doc.save(sanitizeFileName('Daftar ' + label) + '.pdf');
  toast('File PDF berhasil diunduh');
}
function unduhExcelSHU(){
  const { label, kolomNama, rows } = dataDaftarSHU();
  if(!rows.length){ toast('Tidak ada data untuk diunduh'); return; }
  const header = ['No', kolomNama, 'SHU'];
  const body = rows.map((r,i)=>[i+1, r[0], r[1]]);
  const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, label.slice(0,31));
  XLSX.writeFile(wb, sanitizeFileName('Daftar ' + label) + '.xlsx');
  toast('File Excel berhasil diunduh');
}

function cornerFlourish(color){
  return `<svg width="100%" height="100%" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 16 L2 2 L16 2" stroke="${color}" stroke-width="1.4" fill="none"/>
    <path d="M2 22 Q2 2 22 2" stroke="${color}" stroke-width="0.8" fill="none" opacity=".55"/>
    <circle cx="2" cy="2" r="2.3" fill="${color}"/>
    <circle cx="12" cy="2" r="1.1" fill="${color}" opacity=".6"/>
    <circle cx="2" cy="12" r="1.1" fill="${color}" opacity=".6"/>
  </svg>`;
}
function serialRangeForHolding(jenisId, holdingId){
  const all = (DB.kepemilikanSaham||[]).filter(k=>k.jenisId===jenisId).slice().sort((a,b)=> a.id<b.id?-1:(a.id>b.id?1:0));
  let cum = 0;
  for(const k of all){
    const start = cum + 1;
    const end = cum + (k.lembar||0);
    if(k.id===holdingId) return { start, end };
    cum = end;
  }
  return { start: 1, end: 1 };
}
function sertifikatNomor(nama, kode){
  let h = 0;
  for(let i=0;i<nama.length;i++){ h = (h*31 + nama.charCodeAt(i)) >>> 0; }
  const num = String((h % 9000) + 1000);
  const tahun = new Date().getFullYear();
  return `${kode}/SHM/${tahun}/${num}`;
}

function fitSertifikatPreview(){
  const el = document.getElementById('sertifikat-saham');
  if(!el || currentPage!=='admin_saham_certificate') return;
  const wrap = el.parentElement;
  const baseW = 794;
  const availW = (wrap ? wrap.clientWidth : window.innerWidth) - 2;
  const scale = Math.min(1, Math.max(availW, 0) / baseW) || 1;
  el.style.transformOrigin = 'top center';
  el.style.transform = 'translateX(-50%) scale(' + scale + ')';
  const applyHeight = function(){
    const el2 = document.getElementById('sertifikat-saham');
    const wrap2 = el2 ? el2.parentElement : null;
    if(el2 && wrap2){ wrap2.style.height = Math.ceil(el2.offsetHeight * scale + 30) + 'px'; }
  };
  applyHeight();
  setTimeout(applyHeight, 150);
  setTimeout(applyHeight, 500);
  setTimeout(applyHeight, 1000);
}
window.addEventListener('resize', function(){ fitSertifikatPreview(); });
window.addEventListener('orientationchange', function(){ setTimeout(fitSertifikatPreview, 200); });
function cetakSertifikatSaham(nama){
  const el = document.getElementById('sertifikat-saham');
  if(!el){ toast('Sertifikat tidak ditemukan'); return; }
  const wrap = el.parentElement;
  const prevTransform = el.style.transform;
  const prevWrapHeight = wrap ? wrap.style.height : '';
  el.style.transform = 'translateX(-50%)';
  if(wrap){ wrap.style.overflow = ''; wrap.style.height = ''; }
  toast('Menyiapkan file PDF...');
  html2canvas(el, { scale:2.5, useCORS:true, backgroundColor:'#ffffff', windowWidth:el.offsetWidth }).then(function(canvas){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const imgW = pageW;
    const imgH = canvas.height * imgW / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.95);
    const y = imgH < pageH ? (pageH - imgH) / 2 : 0;
    doc.addImage(imgData, 'JPEG', 0, y, imgW, Math.min(imgH, pageH));
    doc.save(sanitizeFileName('Sertifikat Saham ' + nama) + '.pdf');
    restoreCert();
    bigSuccess('File PDF berhasil diunduh');
  }).catch(function(err){
    console.error(err);
    restoreCert();
    toast('Gagal membuat file PDF');
  });
  function restoreCert(){
    el.style.transform = prevTransform;
    if(wrap){ wrap.style.overflow = 'hidden'; wrap.style.height = prevWrapHeight; }
  }
}

function tambahLembarSaham(nama){
  const jenisId = document.getElementById('ks-tambah-jenis').value;
  const lembar = parseIdr(document.getElementById('ks-tambah-lembar').value)||0;
  if(!lembar){ toast('Isi jumlah lembar'); return; }
  const kelEl = document.getElementById('ks-edit-kelompok');
  const kelompokId = (kelEl ? kelEl.value : '') || ownerKelompokId(nama) || null;
  let k = DB.kepemilikanSaham.find(x=>x.nama===nama&&x.jenisId===jenisId);
  let existingId;
  if(k){
    k.lembar += lembar;
    existingId = k.id;
  } else {
    const id = uid('ks');
    DB.kepemilikanSaham.push({id, nama, anggotaId:null, jenisId, lembar, kelompokId});
    existingId = id;
  }
  document.getElementById('ks-tambah-lembar').value = '0';
  const el = document.getElementById('ks-edit-'+existingId);
  if(el) el.value = DB.kepemilikanSaham.find(x=>x.id===existingId).lembar;
  else editKepemilikanSaham(nama);
  toast(lembar+' lembar '+jnsName(jenisId)+' ditambahkan');
}

  const kelompokId = document.getElementById('ks-edit-kelompok').value || null;
  holdings.forEach(k=>{
    const v = Math.max(0, parseIdr(document.getElementById('ks-edit-'+k.id).value)||0);
    if(v===0){
      DB.kepemilikanSaham = DB.kepemilikanSaham.filter(x=>x.id!==k.id);
      supabaseClient.from(TABLES.kepemilikan_saham).delete().eq('id', k.id).then();
    } else {
      k.lembar = v;
      k.kelompokId = kelompokId;
    }
  });
  // sync back to user.saham
  const u = findUserByNama(nama);
  if(u){
    if(!u.saham) u.saham={};
    (DB.koperasi.saham.jenis||[]).forEach(j=>{ u.saham[j.id] = (DB.kepemilikanSaham||[]).filter(k=>String(k.nama||'').trim().toLowerCase()===String(nama).trim().toLowerCase()&&k.jenisId===j.id).reduce((s,k)=>s+k.lembar,0); });
  }
  persist();
  addLog('Edit kepemilikan saham', 'Memperbarui saham '+nama);
  bigSuccess('Saham diperbarui');
  closeModal();
  renderContent();
}
function hapusKepemilikanSaham(nama){
  confirmDialog('Hapus semua kepemilikan saham?', 'Semua saham atas nama '+nama+' akan dihapus.', 'danger', ()=>{
    DB.kepemilikanSaham = DB.kepemilikanSaham.filter(k=>k.nama!==nama);
    const u = findUserByNama(nama);
    if(u){ (DB.koperasi.saham.jenis||[]).forEach(j=>{ if(u.saham) u.saham[j.id]=0; }); }
    persist();
    supabaseClient.from(TABLES.kepemilikan_saham).delete().eq('nama', nama).then();
    addLog('Hapus kepemilikan saham', 'Menghapus saham '+nama);
    bigSuccess('Kepemilikan saham dihapus');
    renderContent();
  });
}

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

}

function suratSPRupiah(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID',{maximumFractionDigits:0}); }
function suratSPTanggal(d){

}

function suratSPOverdue(){
  return computeOverdueLoans().map(o=>{
    const u = userById(o.p.userId);
    const pokok = o.p.jumlahPinjaman||0;
    const laba = marginNominalOf(o.p);
    const jumlah = pokok + laba;
    const sudah = (o.p.riwayatAngsuran||[]).reduce((s,a)=>s+(a.jumlah||0),0);
    return {
      pembId: o.p.id,
      nama: u.nama || '-',
      alamat: u.alamat || '',
      kelompok: u.kelompokId ? kelompokName(u.kelompokId) : '-',
      nomorAkad: u.noRekening || '-',
      tglAkad: o.p.mulai,
      jatuhTempo: o.tglJatuh,
      hariTelat: o.telat,
      pokok, laba, jumlah, sudahDiangsur: sudah,
      sisaKewajiban: Math.max(jumlah - sudah, 0),
      angsuranPerBulan: o.p.angsuranPerBulan||0
    };
  }).sort((a,b)=> b.hariTelat - a.hariTelat);
}
