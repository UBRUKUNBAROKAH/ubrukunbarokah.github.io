<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>UB Rukun Barokah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F1F6F0;
  --surface:#FFFFFF;
  --primary:#0B3D2E;
  --primary-2:#124F3C;
  --primary-soft:#E4EEE6;
  --gold:#B98F33;
  --gold-soft:#F1E3C2;
  --text:#182620;
  --muted:#5C6E64;
  --border:#DEE7DD;
  --danger:#B3402A;
  --danger-soft:#F7E4DE;
  --ok:#2E7D4F;
  --info:#2E6F8E;
  --info-soft:#DCEAF0;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow: 0 8px 24px -12px rgba(11,61,46,.25);
  /* neumorphic (embossed) shadow system, tuned to --bg's green-white hue */
  --neu-d: rgba(148,164,146,.55);
  --neu-l: rgba(255,255,255,.95);
  --shadow-neu: 7px 7px 16px var(--neu-d), -7px -7px 16px var(--neu-l);
  --shadow-neu-sm: 5px 5px 11px var(--neu-d), -5px -5px 11px var(--neu-l);
  --shadow-neu-xs: 3px 3px 7px var(--neu-d), -3px -3px 7px var(--neu-l);
  --shadow-neu-in: inset 4px 4px 9px var(--neu-d), inset -4px -4px 9px var(--neu-l);
  --shadow-neu-in-lg: inset 6px 6px 13px var(--neu-d), inset -6px -6px 13px var(--neu-l);
  --shadow-neu-dark: 4px 4px 9px rgba(0,0,0,.28), -3px -3px 8px rgba(255,255,255,.05);
  --shadow-neu-dark-in: inset 3px 3px 7px rgba(0,0,0,.35), inset -2px -2px 6px rgba(255,255,255,.06);
  --border-neu: rgba(92,110,100,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  font-family:'Plus Jakarta Sans', sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Sora',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--gold-soft);}

.phone-wrap{
  width:100%;
  min-height:100vh;
  background:var(--bg);
  position:relative;
  display:flex;
  flex-direction:column;
}

/* batik-inspired signature pattern */
.batik-bg{
  background-color:var(--primary);
  background-image:
    radial-gradient(circle at 10px 10px, rgba(185,143,51,.35) 2px, transparent 2.5px),
    radial-gradient(circle at 30px 30px, rgba(185,143,51,.22) 2px, transparent 2.5px);
  background-size:40px 40px;
}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  position:relative;
  overflow:hidden;
  color:#062f1d;
  background-color:#ffffff;
  background-image:
    radial-gradient(circle at 10% 15%, rgba(16,185,129,.85) 0%, rgba(4,120,87,.75) 30%, transparent 70%),
    radial-gradient(circle at 90% 85%, rgba(5,150,105,.85) 0%, rgba(6,78,59,.8) 35%, transparent 70%);
  background-size:160% 160%;
  animation:gerakCahaya 14s ease-in-out infinite alternate;
}
@keyframes gerakCahaya{
  0%{background-position:0% 10%;}
  50%{background-position:100% 90%;}
  100%{background-position:20% 100%;}
}
#login-screen::before{
  content:'';
  position:absolute; inset:0;
  background-image:radial-gradient(circle at 12px 12px, rgba(6,47,29,.04) 2px, transparent 2.5px);
  background-size:36px 36px;
  pointer-events:none;
}
.login-card{
  position:relative; z-index:1;
  width:100%; max-width:360px;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(255,255,255,.5);
  border-radius:32px;
  padding:34px 26px 28px;
  display:flex;
  flex-direction:column;
  gap:16px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:0 30px 60px -18px rgba(4,120,87,.25);
  animation:loginSlideUp .45s cubic-bezier(.22,1,.36,1);
}
.login-illustration{
  position:relative;
  height:128px;
  display:flex; align-items:center; justify-content:center;
  margin-bottom:2px;
}
.login-illustration .badge-circle{
  width:104px;height:104px;border-radius:50%;
  background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;
  position:relative; z-index:2;
}
.login-illustration .icon-badge{
  width:66px;height:66px;border-radius:18px;
  background:var(--primary);
  color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 10px 22px -8px rgba(11,61,46,.55);
  overflow:hidden;
  animation:loginPop .5s cubic-bezier(.22,1,.36,1);
}
.login-illustration .coin{
  position:absolute;
  border-radius:50%;
  background:var(--gold);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-family:'Sora',sans-serif;
  border:2px solid var(--gold-soft);
  box-shadow:0 8px 16px -6px rgba(185,143,51,.6);
  animation:coinFloat 3s ease-in-out infinite;
  z-index:3;
}
.login-illustration .coin.c1{ width:32px;height:32px;font-size:12px; top:0; left:20%; animation-delay:0s; }
.login-illustration .coin.c2{ width:26px;height:26px;font-size:10.5px; top:16px; right:16%; animation-delay:.5s; }
.login-illustration .coin.c3{ width:22px;height:22px;font-size:9.5px; bottom:6px; left:10%; animation-delay:1s; }
@keyframes coinFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-9px);}
}
.login-title{text-align:center;}
.login-title h1{margin:0 0 4px;font-size:19px;font-weight:800;color:var(--text);}
.login-title p{margin:0;font-size:12.5px;color:var(--muted);}
.field-pill{position:relative;}
.field-pill > svg{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  color:var(--muted); pointer-events:none;
}
.field-pill input{
  width:100%;
  border:1.5px solid var(--border);
  background:var(--bg);
  border-radius:999px;
  padding:13px 16px 13px 42px;
  font-size:14px;
  outline:none;
  transition:border-color .15s, background .15s;
}
.field-pill input:focus{border-color:var(--primary); background:var(--surface);}
.field-pill .field-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none;border:none;padding:8px;border-radius:50%;
  color:var(--muted); display:flex; align-items:center; justify-content:center;
  width:33px; height:33px;
}
.field-pill .field-toggle svg{ display:block; }
.field-pill .field-toggle:active{background:var(--primary-soft);}
.btn-pill{
  width:100%;
  border:none; border-radius:999px; padding:14px 16px;
  font-weight:700; font-size:14.5px;
  background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 14px 26px -10px rgba(11,61,46,.55), inset 0 1px 0 rgba(255,255,255,.2);
  margin-top:4px;
  transition:box-shadow .12s;
}
.btn-pill:active{background:var(--primary-2);box-shadow:inset 3px 3px 8px rgba(0,0,0,.4), inset -2px -2px 6px rgba(255,255,255,.08);}
.login-footer-link{
  text-align:center; font-size:11.5px; color:var(--muted);
  text-decoration:underline; text-underline-offset:2px; cursor:pointer;
}
.login-footer-note{
  text-align:center; font-size:11px; color:var(--muted); margin-top:2px;
}
@keyframes loginPop{
  0%{transform:scale(.6) rotate(-8deg); opacity:0;}
  100%{transform:scale(1) rotate(0); opacity:1;}
}
@keyframes loginSlideUp{
  0%{transform:translateY(24px); opacity:0;}
  100%{transform:translateY(0); opacity:1;}
}
.btn-loading{position:relative; color:transparent !important;}
.btn-loading::after{
  content:''; position:absolute; width:16px;height:16px;
  border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff;
  animation:btnSpin .7s linear infinite;
}
@keyframes btnSpin{to{transform:rotate(360deg);}}

/* ---- Desktop: card slightly larger, more breathing room ---- */
@media (min-width: 900px){
  .login-card{
    max-width:400px;
    padding:42px 36px 34px;
    border-radius:36px;
  }
  .login-illustration{height:150px;}
  .login-illustration .badge-circle{width:120px;height:120px;}
  .login-illustration .icon-badge{width:76px;height:76px;font-size:34px;}
  .login-title h1{font-size:22px;}
  .login-title p{font-size:13px;}
}


.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:600;color:var(--muted);}
.field input, .field select, .field textarea{
  border:1px solid var(--border-neu);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  font-size:14.5px;
  background:var(--bg);
  outline:none;
  box-shadow:var(--shadow-neu-in);
  transition:box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{box-shadow:var(--shadow-neu-in), 0 0 0 2px var(--primary-soft);}
.btn{
  border:none;
  border-radius:var(--radius-sm);
  padding:13px 16px;
  font-weight:700;
  font-size:14.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:box-shadow .12s, transform .12s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:4px 4px 10px rgba(11,61,46,.4), -3px -3px 9px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.2);}
.btn-primary:active{background:var(--primary-2);box-shadow:inset 3px 3px 7px rgba(0,0,0,.4), inset -2px -2px 5px rgba(255,255,255,.08);}
.btn-gold{background:var(--gold);color:#fff;box-shadow:4px 4px 10px rgba(138,106,31,.4), -3px -3px 9px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.2);}
.btn-gold:active{box-shadow:inset 3px 3px 7px rgba(90,68,15,.45), inset -2px -2px 5px rgba(255,255,255,.1);}
.btn-outline{background:var(--bg);border:1px solid var(--border-neu);color:var(--text);box-shadow:var(--shadow-neu-xs);}
.btn-outline:active{box-shadow:var(--shadow-neu-in);}
.btn-danger{background:var(--danger-soft);color:var(--danger);box-shadow:var(--shadow-neu-xs);}
.btn-danger:active{box-shadow:var(--shadow-neu-in);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;}
.icon-btn-sm{width:32px;height:32px;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:var(--shadow-neu-xs);transition:box-shadow .12s;}
.icon-btn-sm:active{box-shadow:var(--shadow-neu-in);}
.ic-danger{background:var(--danger-soft);color:var(--danger);}
.ic-primary{background:var(--primary-soft);color:var(--primary);}
.login-error{background:var(--danger-soft);color:var(--danger);font-size:13px;padding:10px 12px;border-radius:10px;display:none;}
.demo-box{background:var(--primary-soft);border-radius:var(--radius-sm);padding:12px 14px;font-size:11.5px;color:var(--primary);line-height:1.6;}
.demo-box b{font-family:'IBM Plex Mono',monospace;}

/* ---------- APP SHELL ---------- */
#app-screen{display:none;flex-direction:column;min-height:100vh;}
.app-header{
  background:var(--primary);
  color:#fff;
  padding:18px 18px 20px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 8px 18px -6px rgba(11,61,46,.55), inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,0,0,.18);
  /* force its own compositing layer so mobile browsers (esp. iOS Safari)
     don't clip/mis-paint the sticky header while the URL bar collapses
     or expands during scroll */
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  will-change:transform;
}
.app-header .left{display:flex;align-items:center;gap:10px;}
.app-header .koperasi-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;box-shadow:var(--shadow-neu-dark);}
.app-header .titles .name{font-weight:700;font-size:14.5px;line-height:1.2;font-family:'Sora',sans-serif;}
.app-header .titles .role{font-size:11px;color:var(--gold-soft);text-transform:uppercase;letter-spacing:.6px;}
.icon-btn{background:rgba(255,255,255,.14);border:none;color:#fff;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-neu-dark);transition:box-shadow .12s;}
.icon-btn:active{box-shadow:var(--shadow-neu-dark-in);}

.profile-dropdown{position:relative;}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:.2s;box-shadow:var(--shadow-neu-dark);}
.profile-avatar:hover{background:rgba(255,255,255,.28);}
.profile-avatar:active{box-shadow:var(--shadow-neu-dark-in);}
.dropdown-menu{position:absolute;right:0;top:44px;min-width:170px;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:6px;display:none;z-index:999;}
.dropdown-menu.show{display:block;}
.dropdown-item{padding:10px 14px;border-radius:8px;font-size:13px;color:#222;cursor:pointer;transition:.15s;}
.dropdown-item:hover{background:#f5f5f5;}
.dropdown-item.logout{color:#e74c3c;}
.dropdown-item.logout:hover{background:#fee;}
.dropdown-divider{height:1px;background:#eee;margin:4px 8px;}

#content{flex:1;min-width:0;padding:18px 18px 90px;}
.page-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin:2px 0 16px;display:flex;align-items:center;justify-content:space-between;}
.page-title span.sub{display:block;font-family:'Plus Jakarta Sans';font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;}

.card{background:var(--bg);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-neu);margin-bottom:14px;border:1px solid var(--border-neu);}
.balance-card{background:linear-gradient(135deg,var(--primary) 0%, var(--primary-2) 100%);color:#fff;border:none;position:relative;overflow:hidden;box-shadow:8px 8px 18px rgba(11,61,46,.4), -5px -5px 16px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.12);}
.balance-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);}
.balance-card .label{font-size:12px;color:rgba(255,255,255,.75);}
.balance-card .amount{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
.balance-card .rekening{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--gold-soft);margin-top:10px;letter-spacing:.5px;}

.grid-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.grid-menu .item{background:var(--bg);border:1px solid var(--border-neu);border-radius:var(--radius-md);padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--shadow-neu-sm);transition:box-shadow .12s;}
.grid-menu .item:active{box-shadow:var(--shadow-neu-in);}
.grid-menu .item .ic{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-neu-xs);}
.grid-menu .item span{font-size:11.5px;font-weight:600;line-height:1.25;}

/* ---------- MBANKING-STYLE NASABAH DASHBOARD (Qita-inspired) ---------- */
.hero-balance{background:linear-gradient(135deg,var(--primary) 0%, var(--primary-2) 55%, #0d4536 100%);color:#fff;border:none;border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden;box-shadow:9px 9px 20px rgba(11,61,46,.4), -5px -5px 18px rgba(255,255,255,.55), inset 0 1px 0 rgba(255,255,255,.12);margin-bottom:14px;}
.hero-balance::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);}
.hero-balance::after{content:"";position:absolute;left:-30px;bottom:-55px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);}
.hero-balance .greet{font-size:12.5px;color:rgba(255,255,255,.75);position:relative;z-index:1;}
.hero-balance .greet b{color:#fff;}
.hero-balance .amount{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;margin-top:6px;position:relative;z-index:1;}
.hero-balance .rekening{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold-soft);margin-top:8px;position:relative;z-index:1;letter-spacing:.5px;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;position:relative;z-index:1;}
.quick-actions button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600;line-height:1.2;box-shadow:3px 3px 7px rgba(0,0,0,.2), -2px -2px 6px rgba(255,255,255,.08);}
.quick-actions button .qa-ic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.quick-actions button:active{background:rgba(255,255,255,.1);box-shadow:inset 2px 2px 6px rgba(0,0,0,.3), inset -2px -2px 5px rgba(255,255,255,.05);}

.due-banner{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:none;border-radius:var(--radius-md);padding:12px 14px;margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow-neu-sm);}
.due-banner .ic{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:2px 2px 6px rgba(138,106,31,.4), -1px -1px 4px rgba(255,255,255,.4);}
.due-banner .t{font-size:12.5px;font-weight:700;color:#5c4413;}
.due-banner .s{font-size:11px;color:#7a5c22;margin-top:1px;}

.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.portfolio-box{background:var(--bg);border:1px solid var(--border-neu);border-radius:var(--radius-md);padding:12px 10px;text-align:center;box-shadow:var(--shadow-neu-sm);}
.portfolio-box .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.portfolio-box .v{font-family:'Sora',sans-serif;font-weight:700;font-size:12px;color:var(--text);overflow-wrap:anywhere;}
.portfolio-box .l{font-size:9.5px;color:var(--muted);margin-top:2px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;}
.section-head .section-label{margin:0;}
.section-head .see-all{font-size:11px;color:var(--primary);font-weight:700;cursor:pointer;}

.tx-list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.tx-list-item:last-child{border-bottom:none;}
.tx-list-item .tx-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-neu-xs);}
.tx-list-item .tx-ic.in{background:var(--primary-soft);color:var(--ok);}
.tx-list-item .tx-ic.out{background:var(--danger-soft);color:var(--danger);}
.tx-list-item .tx-info{flex:1;min-width:0;}
.tx-list-item .tx-info .t{font-weight:600;font-size:13px;}
.tx-list-item .tx-info .s{font-size:11px;color:var(--muted);margin-top:1px;}
.tx-list-item .tx-amt{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;white-space:nowrap;}
.tx-list-item .tx-amt.plus{color:var(--ok);}

.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;letter-spacing:.3px;}

.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border-neu);border-radius:12px;padding:9px 12px;margin-bottom:14px;flex:1;min-width:0;box-shadow:var(--shadow-neu-in);}

.btn-compact{padding:9px 14px;font-size:12.5px;white-space:nowrap;flex-shrink:0;border-radius:10px;}

.empty-state{text-align:center;padding:40px 10px;color:var(--muted);}
.empty-state .ic{font-size:34px;margin-bottom:10px;}
.empty-state .t{font-weight:700;color:var(--text);font-size:14px;}
.empty-state .d{font-size:12.5px;margin-top:4px;}

/* install prompt */
#install-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;}
#install-card{background:#fff;border-radius:var(--radius-lg);padding:36px 28px 28px;width:340px;max-width:88vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);}
#install-icon{width:64px;height:64px;border-radius:18px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;}
#install-title{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;color:var(--text);margin-bottom:6px;}
#install-desc{font-size:13px;color:var(--muted);line-height:1.5;}
/* passbook ledger */
.ledger{border:1px solid var(--border-neu);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-neu);}
.ledger-head{background:var(--primary);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:grid;grid-template-columns:.35fr 1fr 1.2fr 1fr;padding:10px 14px;}
.ledger-row{display:grid;grid-template-columns:.35fr 1fr 1.2fr 1fr;padding:11px 14px;border-top:1px solid var(--border);align-items:center;}
.ledger-row:nth-child(even){background:rgba(255,255,255,.5);}
.ledger-row .d{font-size:11px;color:var(--muted);}
.ledger-row .k{font-size:12px;}
.ledger-row .j{font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;font-weight:600;}

/* bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);
  border-top:1px solid var(--border-neu);
  display:flex;
  gap:3px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  padding:7px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -7px 16px -8px var(--neu-d), 0 -1px 0 var(--neu-l);
}
.bottom-nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;color:var(--muted);font-size:10px;font-weight:600;border-radius:12px;white-space:nowrap;min-width:56px;transition:color .12s, box-shadow .15s, background .15s;}
.bottom-nav button.active{background:var(--bg);box-shadow:var(--shadow-neu-in);color:var(--primary);}
.bottom-nav .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:box-shadow .15s;font-size:18px;}

/* sidebar for desktop */
.sidebar{
  display:none;
  width:220px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:18px 12px;
  flex-shrink:0;
}
.sidebar button{
  width:100%;
  background:none;
  border:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  color:var(--muted);
  font-size:13px;
  font-weight:500;
  border-radius:10px;
  margin-bottom:4px;
  cursor:pointer;
  transition:background .15s, color .15s;
}
.sidebar button:hover{background:var(--primary-soft);color:var(--primary);}
.sidebar button.active{background:var(--primary-soft);color:var(--primary);font-weight:600;}
.sidebar button .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:17px;}

.app-body{
  display:flex;
  min-height:calc(100vh - 56px);
}
.app-body #content{
  flex:1;
  min-width:0;
  padding:18px;
  padding-bottom:80px;
}

/* desktop layout */
@media (min-width: 769px){
  .bottom-nav{display:none !important;}
  .sidebar{display:block;}
  .app-header{padding:12px 24px;}
  .app-body #content{padding:24px 32px 24px 24px;}
  .page-title{font-size:22px;}
  .page-title .sub{font-size:13px;}
  .stat-grid{grid-template-columns:1fr 1fr 1fr;}
}

/* tablet: tetap 3 kolom biar hemat tempat */
@media (min-width: 560px) and (max-width: 768px){
  .stat-grid{grid-template-columns:1fr 1fr 1fr;}
}

/* mobile layout */
@media (max-width: 768px){
  .bottom-nav{display:flex !important;}
  .sidebar{display:none !important;}
  .app-body #content{padding-bottom:80px;}
}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,25,18,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);width:100%;max-width:420px;border-radius:22px;padding:22px 22px 26px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px -12px rgba(0,0,0,.4);animation:modalIn .2s ease;}
@keyframes modalIn{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal h3{margin:0 0 16px;font-size:16px;}
.modal-close{position:absolute;}
.confirm-overlay{position:fixed;inset:0;background:rgba(10,25,18,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;}
.confirm-overlay.show{display:flex;}
.confirm-box{background:var(--surface);border-radius:18px;padding:24px 22px 18px;width:100%;max-width:320px;box-shadow:0 20px 50px -12px rgba(0,0,0,.4);animation:confirmIn .2s ease;}
@keyframes confirmIn{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
.confirm-box .icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
.confirm-box .icon.danger{background:var(--danger-soft);color:var(--danger);}
.confirm-box .icon.warning{background:var(--gold-soft);color:#8a6a1f;}
.confirm-box .msg{text-align:center;font-size:14px;line-height:1.5;margin-bottom:20px;color:var(--text);}
.confirm-box .msg b{display:block;font-size:15px;margin-bottom:4px;}
.confirm-actions{display:flex;gap:10px;}
.confirm-actions .btn{flex:1;padding:12px;font-size:14px;}
.form-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.form-row label{font-size:12px;font-weight:600;color:var(--muted);}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--border-neu);border-radius:10px;padding:11px 12px;font-size:13.5px;outline:none;background:var(--bg);box-shadow:var(--shadow-neu-in);resize:vertical;transition:box-shadow .15s;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{box-shadow:var(--shadow-neu-in), 0 0 0 2px var(--primary-soft);}
.tx-acc-row{cursor:pointer;border:1px solid var(--border-neu);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:var(--bg);box-shadow:var(--shadow-neu-xs);transition:box-shadow .15s, color .15s;}
.tx-acc-row:last-child{margin-bottom:0;}
.tx-acc-row.selected{box-shadow:var(--shadow-neu-in-lg);color:var(--primary);}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions .btn{flex:1;}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;z-index:100;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;}

.section-label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px;}
.section-label:first-child{margin-top:0;}
.bar-row{margin-bottom:12px;}
.bar-row .lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.bar-track{background:var(--primary-soft);border-radius:20px;height:9px;overflow:hidden;}
.bar-fill{background:var(--gold);height:100%;border-radius:20px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat-grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width: 768px){.stat-grid.cols-4{grid-template-columns:repeat(2,1fr);}}
.stat-box{background:var(--bg);border:1px solid var(--border-neu);border-left:3px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;box-shadow:var(--shadow-neu-sm);}
.stat-box .ic-badge{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;box-shadow:var(--shadow-neu-xs);}
.stat-box .ic-badge svg{width:13px;height:13px;}
.stat-box .n{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:var(--primary);line-height:1.15;overflow-wrap:anywhere;}
.stat-box .l{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3;}
.stat-box.stat-primary{border-left-color:var(--primary);}
.stat-box.stat-primary .ic-badge{background:var(--primary-soft);color:var(--primary);}
.stat-box.stat-info{border-left-color:var(--info);}
.stat-box.stat-info .ic-badge{background:var(--info-soft);color:var(--info);}
.stat-box.stat-gold{border-left-color:var(--gold);}
.stat-box.stat-gold .ic-badge{background:var(--gold-soft);color:var(--gold);}
.stat-box.stat-gold .n{color:var(--text);}
.stat-box.stat-danger{border-left-color:var(--danger);}
.stat-box.stat-danger .ic-badge{background:var(--danger-soft);color:var(--danger);}
.stat-box.stat-danger .n{color:var(--danger);}
.stat-box.stat-info .n{color:var(--text);}

.avatar{width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.row-num{width:22px;flex-shrink:0;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);}
.flex{display:flex;align-items:center;gap:10px;}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
a.linklike{color:var(--primary);font-size:12.5px;font-weight:700;text-decoration:none;}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

/* ============ CUSTOM SEARCHABLE SELECT ============ */
.csel{position:relative;width:100%;}
.csel-native{position:absolute!important;width:0!important;height:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0;pointer-events:none;overflow:hidden;}
.csel-trigger{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;
  font-size:13.5px;font-family:inherit;background:#FBFCFA;color:var(--text);
  min-height:44px;text-align:left;transition:border-color .12s, background .12s;
}
.csel-trigger:active{background:var(--primary-soft);}
.csel-trigger.csel-open{border-color:var(--primary);}
.csel-trigger.csel-disabled{opacity:.55;pointer-events:none;background:var(--bg);}
.csel-trigger-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.csel-trigger.csel-placeholder .csel-trigger-text{color:var(--muted);}
.csel-chevron{flex-shrink:0;width:16px;height:16px;color:var(--muted);transition:transform .15s;}
.csel-trigger.csel-open .csel-chevron{transform:rotate(180deg);color:var(--primary);}

.csel-overlay{position:fixed;inset:0;background:rgba(11,20,16,.45);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:cselFade .15s ease-out;}
@keyframes cselFade{from{opacity:0;}to{opacity:1;}}
.csel-sheet{
  width:100%;max-width:520px;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:80vh;display:flex;flex-direction:column;box-shadow:0 -10px 30px -8px rgba(11,61,46,.35);
  animation:cselUp .18s cubic-bezier(.22,.9,.32,1);
  padding-bottom:env(safe-area-inset-bottom,0);
}
@keyframes cselUp{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
.csel-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.csel-sheet-title{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:var(--primary);}
.csel-close{width:30px;height:30px;border-radius:50%;border:none;background:var(--primary-soft);color:var(--primary);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.csel-search-wrap{position:relative;padding:12px 16px;flex-shrink:0;border-bottom:1px solid var(--border);}
.csel-search-wrap svg{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none;}
.csel-search{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 12px 11px 36px;font-size:13.5px;font-family:inherit;background:#FBFCFA;outline:none;}
.csel-search:focus{border-color:var(--primary);}
.csel-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;flex:1;}
.csel-item{padding:13px 12px;border-radius:12px;font-size:13.5px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.csel-item:active{background:var(--primary-soft);}
.csel-item-active{background:var(--primary-soft);color:var(--primary);font-weight:700;}
.csel-item-disabled{color:var(--muted);opacity:.6;cursor:default;}
.csel-empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;}
.csel-check{width:15px;height:15px;flex-shrink:0;color:var(--primary);}

/* ============ NOTIFIKASI SUKSES BESAR (di tengah layar) ============ */
.success-overlay{position:fixed;inset:0;z-index:600;display:none;align-items:center;justify-content:center;background:rgba(11,20,16,.45);padding:24px;}
.success-overlay.show{display:flex;}
.success-card{background:var(--surface);border-radius:22px;padding:34px 30px 30px;max-width:300px;width:100%;text-align:center;box-shadow:0 24px 60px -14px rgba(0,0,0,.45);animation:successPop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes successPop{from{transform:scale(.72);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-icon{width:68px;height:68px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.success-icon svg{width:36px;height:36px;}
.success-icon svg path{stroke-dasharray:32;stroke-dashoffset:32;animation:successCheck .4s .12s ease forwards;}
@keyframes successCheck{to{stroke-dashoffset:0;}}
.success-text{font-family:'Sora',sans-serif;font-weight:700;font-size:15.5px;color:var(--text);line-height:1.45;}
</style>
</head>

<script>
/* =========================================================

// Ambil SEMUA baris tabel (Supabase default cuma 1000 baris; tabel besar perlu dipaginasi)
async function fetchAllRows(table, select = '*') {
  const pageSize = 1000;
  const out = [];
  let from = 0;
  while (true) {
    const { data, error } = await supabaseClient.from(table).select(select).range(from, from + pageSize - 1);
    if (error) throw error;
    const rows = data || [];
    out.push(...rows);
    if (rows.length < pageSize) break;
    from += pageSize;
  }
  return { data: out, error: null };
}

function parseIdr(v){ if(typeof v==='number') return v; if(!v) return 0; return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0; }
// Daftar pembiayaan berjalan yang telat bayar (kondisi saat ini/real-time).
// Dipakai bersama oleh dashboard ("Perlu Tindakan") dan Laporan Ringkas,
// supaya definisi "macet" selalu konsisten di seluruh aplikasi.
function computeOverdueLoans(){
  const overdue = [];
  const skrg = new Date();
  DB.pembiayaan.forEach(function(p){
    if(p.status!=='berjalan'||p.statusPengajuan!=='approved') return;
    const mulai = new Date(p.mulai);
    var blnBerjalan = (skrg.getFullYear()-mulai.getFullYear())*12 + (skrg.getMonth()-mulai.getMonth());
    var hrsDibayar = Math.min(blnBerjalan, p.tenor);
    var sdhDibayar = p.tenor - p.sisaAngsuran;
    if(sdhDibayar < hrsDibayar){
      var tglJatuh = new Date(p.mulai);
      tglJatuh.setMonth(tglJatuh.getMonth() + sdhDibayar + 1);
      overdue.push({p, telat:hrsDibayar-sdhDibayar, tglJatuh});
    }
  });
  return overdue;
}
function marginNominalOf(p){
  if(p.marginNominal) return p.marginNominal;
  if(p.marginPersen) return Math.round(p.jumlahPinjaman * p.marginPersen / 100);

}

// ---- Transform snake_case (DB) to camelCase (JS) ----
function toCamel(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toCamel);
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    const ck = k.replace(/_([a-z])/g, (_, l) => l.toUpperCase());
    out[ck] = toCamel(v);
  }
  return out;
}

// ---- Transform camelCase (JS) to snake_case (DB) ----
function toSnake(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(toSnake);
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    const sk = k.replace(/[A-Z]/g, l => '_' + l.toLowerCase());
    out[sk] = toSnake(v);
  }
  return out;
}

async function initSupabaseDB() {
  if (DB_LOADED) return DB;
  
  try {
    // Load all tables in parallel
    const [
      users, anggota, kelompok, jenisTabungan, tabunganAccounts, tabunganTx,
      pembiayaan, angsuran, jenisSaham, kepemilikanSaham,
      pengaturan, setoran, logs, kasPenarikanKoor, hutangKoordinator
    ] = await Promise.all([
      fetchAllRows(TABLES.users),
      fetchAllRows(TABLES.anggota),
      fetchAllRows(TABLES.kelompok),
      fetchAllRows(TABLES.jenis_tabungan),
      fetchAllRows(TABLES.tabungan_accounts),
      fetchAllRows(TABLES.tabungan_tx),
      fetchAllRows(TABLES.pembiayaan),
      fetchAllRows(TABLES.angsuran),
      fetchAllRows(TABLES.jenis_saham),
      fetchAllRows(TABLES.kepemilikan_saham),
      supabaseClient.from(TABLES.pengaturan_koperasi).select('*').eq('id', 'koperasi').single(),
      fetchAllRows(TABLES.setoran),
      supabaseClient.from(TABLES.logs).select('*').order('created_at', {ascending: false}).limit(100),
      fetchAllRows(TABLES.kas_penarikan_koor),
      fetchAllRows(TABLES.hutang_koordinator)
    ]);

    // Transform to camelCase
    const u = toCamel(users.data || []);
    const a = toCamel(anggota.data || []);
    const k = toCamel(kelompok.data || []);
    const jt = toCamel(jenisTabungan.data || []);
    const ta = toCamel(tabunganAccounts.data || []);
    const ttx = toCamel(tabunganTx.data || []);
    const pb = toCamel(pembiayaan.data || []);
    const an = toCamel(angsuran.data || []);
    const js = toCamel(jenisSaham.data || []);
    const ks = toCamel(kepemilikanSaham.data || []);
    const pg = toCamel(pengaturan.data);
    const st = toCamel(setoran.data || []);
    const lg = toCamel(logs.data || []);
    const kpk = toCamel(kasPenarikanKoor.data || []);
    const hk = toCamel(hutangKoordinator.data || []);

    // Merge: untuk nasabah, gabung data anggota ke user
    const matchedAggIds = new Set();
    const mergedUsers = u.map(user => {
      if (user.role === 'nasabah' && user.anggotaId) {
        const agg = a.find(x => x.id === user.anggotaId);
        if (agg) { matchedAggIds.add(agg.id); return { ...user, ...agg, id: user.id, createdAt: user.createdAt }; }
      }
      // Koordinator: cari kelompokId dari tabel kelompok
      if (user.role === 'koordinator') {
        const kel = k.find(x => (x.koorId || x.koor_id) === user.id);
        if (kel) user.kelompokId = kel.id;
      }
      return user;
    });
    // Anggota yang ada di tabel "anggota" tapi belum punya akun login di tabel "users"
    // (mis. diinput langsung lewat Supabase, atau sinkronisasi user sempat gagal)
    // tetap ditampilkan di daftar supaya tidak "hilang".
    a.forEach(agg => {
      if (!matchedAggIds.has(agg.id)) {
        mergedUsers.push({
          id: agg.id, role: 'nasabah', anggotaId: agg.id,
          nama: agg.nama, nik: agg.nik, alamat: agg.alamat, noHp: agg.noHp,
          kelompokId: agg.kelompokId, noRekening: agg.noRekening, saham: agg.saham || {},
          status: agg.status || 'aktif', createdAt: agg.createdAt,
          username: null, password: null, _noAkun: true
        });
      }
    });

    // Build DB object
    DB = {
      users: mergedUsers,
      koperasi: {
        kelompok: k,
        jenisTabungan: jt,
        info: {},
        sertifikat: {},
        saham: { 
          pemupukanPersen: 35, 
          jenis: js 
        },
        aturKeuangan: {
          marginNominal: 50000,
          marginMaxNominal: 200000,
          pools: [
            {id:'operasional', label:'Operasional', persen:5},
            {id:'cadangan_resiko', label:'Cadangan Resiko', persen:5},
            {id:'bagi_hasil_tabungan', label:'Bagi Hasil Tabungan', persen:2},

            {id:'cad_zakat', label:'Cad. Zakat', persen:2},
            {id:'dana_sosial', label:'Dana Sosial', persen:2},
            {id:'penyusutan', label:'Penyusutan', persen:2}
          ],
          dana: {operasional:0, cadangan_resiko:0, bagi_hasil_tabungan:0, shu_saham:0, cad_zakat:0, dana_sosial:0, penyusutan:0}
        }
      },
      tabunganAccounts: ta,
      tabunganTx: ttx,
      pembiayaan: pb,
      angsuran: an,
      kepemilikanSaham: ks,
      setoran: st,
      logs: lg,
      kasPenarikan: kpk,
      hutangKoor: hk
    };

    // Merge pengaturan koperasi (deep merge biar nested object gak ketimpa kosong)
    if (pg) {
      if (pg.nama) DB.koperasi.nama = pg.nama;
      if (pg.icon) DB.koperasi.icon = pg.icon;
      if (pg.iconImage) DB.koperasi.iconImage = pg.iconImage;
      if (!DB.koperasi.info) DB.koperasi.info = {};
      if (pg.info && Object.keys(pg.info).length) Object.assign(DB.koperasi.info, pg.info);
      if (!DB.koperasi.sertifikat) DB.koperasi.sertifikat = {};
      if (pg.sertifikat && Object.keys(pg.sertifikat).length) Object.assign(DB.koperasi.sertifikat, pg.sertifikat);
      if (pg.aturKeuangan && Object.keys(pg.aturKeuangan).length) Object.assign(DB.koperasi.aturKeuangan, pg.aturKeuangan);
      if (pg.saham && Object.keys(pg.saham).length) {
        if (pg.saham.pemupukanPersen !== undefined) DB.koperasi.saham.pemupukanPersen = pg.saham.pemupukanPersen;
      }
      // Kembalikan data dari tabel dedicated
      DB.koperasi.kelompok = k;
      DB.koperasi.jenisTabungan = jt;
      DB.koperasi.saham.jenis = js;
    }

    // Ensure defaults
    ensureDefaults();
    DB_LOADED = true;
    
    return DB;
    
  } catch (err) {
    console.error('Gagal load dari Supabase:', err);
    throw err;
  }
}

    const legacyMap = {
      cadanganResiko: 'cadangan_resiko',
      bagiHasilTabungan: 'bagi_hasil_tabungan',
      shuSaham: 'shu_saham',
      cadZakat: 'cad_zakat',
      danaSosial: 'dana_sosial'
    };
    let berubah = false;
    Object.keys(legacyMap).forEach(oldKey=>{
      if(d.hasOwnProperty(oldKey)){
        const newKey = legacyMap[oldKey];
        d[newKey] = (d[newKey]||0) + (d[oldKey]||0);
        delete d[oldKey];
        berubah = true;
      }
    });
    if(berubah && typeof syncAllToSupabase === 'function') syncAllToSupabase();
  })();
  if(!DB.koperasi.info || typeof DB.koperasi.info !== 'object' || Object.keys(DB.koperasi.info).length===0) DB.koperasi.info = {};

// ---- Persist to Supabase ----
async function persistToSupabase(table, data, id = null) {
  try {
    if (id) {
      return await supabaseClient.from(table).update(data).eq('id', id);
    }
    return await supabaseClient.from(table).insert(data);
  } catch (err) {
    console.error(`Supabase persist error (${table}):`, err);
    return { error: err };
  }
}

async function deleteFromSupabase(table, id) {
  try {
    return await supabaseClient.from(table).delete().eq('id', id);
  } catch (err) {
    console.error(`Supabase delete error (${table}):`, err);
    return { error: err };
  }
}

// ---- Upsert a single row/table directly, isolated from other tables ----
async function upsertToSupabase(table, data) {
  try {
    return await supabaseClient.from(table).upsert(data, { onConflict: 'id' });
  } catch (err) {
    console.error(`Supabase upsert error (${table}):`, err);
    return { error: err };
  }
}

// ---- Persist: simpan langsung ke Supabase (tanpa localStorage) ----
let _syncTimeout = null;
function persist() {
  if (_syncTimeout) clearTimeout(_syncTimeout);
  _syncTimeout = setTimeout(() => {
    syncAllToSupabase().catch(err => console.error('Auto-sync error:', err));
  }, 2000);
}

// ---- Immediate persist (bypasses debounce, waits for confirmation) ----
async function persistNow() {
  if (_syncTimeout) { clearTimeout(_syncTimeout); _syncTimeout = null; }
  try {
    await syncAllToSupabase();
    return { ok: true };
  } catch (err) {
    console.error('persistNow sync error:', err);
    return { ok: false, err };
  }
}

async function syncAllToSupabase() {
  if (!DB_LOADED) return;

  const errors = [];
  async function safeUpsert(table, data, label){
    if (!data || (Array.isArray(data) && data.length===0)) return;
    try {
      const { error } = await supabaseClient.from(table).upsert(data, { onConflict: 'id' });
      if (error) { console.error(`Supabase sync error (${label||table}):`, error); errors.push({table: label||table, error}); }
    } catch (err) {
      console.error(`Supabase sync exception (${label||table}):`, err);
      errors.push({table: label||table, error: err});
    }
  }

  // Sync users (tabel login) + anggota (tabel data nasabah)
  const usersTable = [];
  const anggotaTable = [];
  (DB.users||[]).forEach(u => {
    if (u._noAkun) return; // entri sementara (anggota tanpa akun login), jangan disinkron ke tabel users
    const userRec = { id: u.id, username: u.username, password: u.password, role: u.role, nama: u.nama, created_at: u.createdAt };
    const aggId = u.anggotaId || (u.role === 'nasabah' ? uid('agg') : null);
    if (u.role === 'nasabah' && aggId) {
      u.anggotaId = aggId;
      userRec.anggota_id = aggId;
      anggotaTable.push({
        id: aggId, nama: u.nama, nik: u.nik||null, alamat: u.alamat||null,
        no_hp: u.noHp||null, kelompok_id: u.kelompokId||null,
        no_rekening: u.noRekening||null, saham: u.saham||{},
        status: u.status||'aktif', created_at: u.createdAt
      });
    }
    usersTable.push(userRec);
  });
  await safeUpsert(TABLES.users, usersTable);
  await safeUpsert(TABLES.anggota, anggotaTable, 'anggota');
  // Sync kelompok
  await safeUpsert(TABLES.kelompok, toSnake(DB.koperasi?.kelompok));
  // Sync jenis tabungan
  await safeUpsert(TABLES.jenis_tabungan, toSnake(DB.koperasi?.jenisTabungan));
  // Sync tabungan accounts
  await safeUpsert(TABLES.tabungan_accounts, toSnake(DB.tabunganAccounts));
  // Sync tabungan tx
  const txSnake = DB.tabunganTx?.map(t => {
    const s = toSnake(t);
    if (t.tanggal) s.tanggal = t.tanggal;
    return s;
  });
  await safeUpsert(TABLES.tabungan_tx, txSnake);
  // Sync pembiayaan
  const pSnake = DB.pembiayaan?.map(p => {
    const s = toSnake(p);
    if (p.mulai) s.mulai = p.mulai.split('T')[0]; // YYYY-MM-DD
    if (p.riwayatAngsuran) {
      s.riwayat_angsuran = p.riwayatAngsuran;
    }
    return s;
  });
  await safeUpsert(TABLES.pembiayaan, pSnake);
  // Sync angsuran
  await safeUpsert(TABLES.angsuran, toSnake(DB.angsuran));
  // Sync jenis saham
  await safeUpsert(TABLES.jenis_saham, toSnake(DB.koperasi?.saham?.jenis));
  // Sync kepemilikan saham
  await safeUpsert(TABLES.kepemilikan_saham, toSnake(DB.kepemilikanSaham));
  // Sync setoran (hanya record tabungan ber-jenisId; setoran angsuran punya properti jenis/pembiayaanId yang tidak ada sebagai kolom di tabel setoran Supabase)
  const setoranSync = (DB.setoran||[]).filter(s => s.jenisId && !s.jenis).map(toSnake);
  await safeUpsert(TABLES.setoran, setoranSync, 'setoran');
  // Sync kas penarikan koordinator (penarikan yang mengurangi dana yang dipegang koordinator)
  await safeUpsert(TABLES.kas_penarikan_koor, toSnake(DB.kasPenarikan), 'kas_penarikan_koor');
  // Sync hutang admin ke koordinator (kekurangan kas saat penarikan melebihi dana yang dipegang koordinator)
  await safeUpsert(TABLES.hutang_koordinator, toSnake(DB.hutangKoor), 'hutang_koordinator');
  // Sync logs + cleanup (keep max 500 row)
  await safeUpsert(TABLES.logs, toSnake(DB.logs));
  try {
    const { count } = await supabaseClient.from(TABLES.logs).select('*', { count: 'exact', head: true });
    if (count && count > 500) {
      const { data: old } = await supabaseClient.from(TABLES.logs).select('id').order('created_at', {ascending: true}).limit(count - 500);
      if (old && old.length) {
        const ids = old.map(r=>r.id);
        for (let i = 0; i < ids.length; i += 100) {
          await supabaseClient.from(TABLES.logs).delete().in('id', ids.slice(i, i + 100));
        }
      }
    }
  } catch(e){} // cleanup error aman diabaikan
  // Sync pengaturan koperasi (single row) - JSONB fields jangan di-toSnake
  const pg = {
    id: 'koperasi',
    nama: DB.koperasi.nama,
    icon: DB.koperasi.icon,
    icon_image: DB.koperasi.iconImage || null,
    info: DB.koperasi.info || {},
    sertifikat: DB.koperasi.sertifikat || {},
    saham: { pemupukanPersen: DB.koperasi.saham?.pemupukanPersen || 35 },
    atur_keuangan: DB.koperasi.aturKeuangan || {}
  };
  await safeUpsert(TABLES.pengaturan_koperasi, [pg], 'pengaturan_koperasi');

  if (errors.length) {
    const detail = errors.map(e => {
      const msg = e.error && (e.error.message || e.error.msg) || 'unknown error';
      const extra = e.error && (e.error.details || e.error.hint) ? ' — ' + (e.error.details || e.error.hint) : '';
      return e.table + ': ' + msg + extra;
    }).join(' | ');
    console.error('Auto-sync selesai dengan error pada tabel:', detail);
    throw new Error(detail);
  }
  console.log('Auto-sync to Supabase berhasil');
}

function normalizeNoHp(no){
  if(!no) return '';
  no = String(no).trim().replace(/[\s-]/g, '');
  if(no.startsWith('0')) return '62' + no.slice(1);
  if(no.startsWith('62')) return no;
  return '62' + no;
}
async function kirimWA(nomor, pesan){

  try {
    const res = await fetch('https://api.fonnte.com/send', {
      method: 'POST',

function userAccounts(userId) { return (DB.tabunganAccounts||[]).filter(a=>a.user_id===userId || a.userId===userId).map(a=>({j: DB.koperasi.jenisTabungan.find(j=>j.id===(a.jenis_id||a.jenisId)), acc:a})); }
function txForUser(userId) { return (DB.tabunganTx||[]).filter(t=>t.user_id===userId || t.userId===userId).sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal)); }
function totalSaldoUser(userId) { return userAccounts(userId).reduce((s,a)=>s+(a.acc?.saldo||0),0); }
function pembiayaanForUser(userId) { return (DB.pembiayaan||[]).filter(p=>p.user_id===userId || p.userId===userId); }
function jenisName(jid) { const j = DB.koperasi?.jenisTabungan?.find(x=>x.id===jid); return j?j.nama:'-'; }
function koordinatorForKelompok(kid) { const k = DB.koperasi?.kelompok?.find(x=>x.id===kid); return k?userById(k.koor_id||k.koorId||k.koordinatorId):null; }

// ---- Boot ----
async function boot() {
  await initSupabaseDB();
  applyKoperasiBranding();
  const user = currentUser();
  if(!user){
    document.getElementById('login-screen').style.display='flex';
    document.getElementById('app-screen').style.display='none';
    try{ history.replaceState(null, ''); }catch(e){}
    return;
  }
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  document.getElementById('header-role').textContent = roleLabel(user.role);
  currentPage = defaultPageFor(user.role);
  currentSubState = {};
  renderNav();
  renderContent();
  pushNavHistory(true);
}


function addLog(aksi, detail){
  const s = getSession();
  DB.logs.unshift({id:uid('log'), waktu:nowISO(), oleh: s? s.userId : 'system', peran: s? s.role : '-', aksi, detail});
  persist();
}

/* =========================================================
   SESSION / AUTH
========================================================= */
function getSession(){
  const raw = sessionStorage.getItem(SESSION_KEY);
  return raw ? JSON.parse(raw) : null;
}
function setSession(user){
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({userId:user.id, role:user.role}));
}
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }
function currentUser(){
  const s = getSession();
  if(!s) return null;
  return DB.users.find(u=>u.id===s.userId) || null;
}

async function handleLogin(){
  const submitBtn = document.getElementById('login-submit-btn');
  submitBtn.classList.add('btn-loading');
  submitBtn.disabled = true;
  try{
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errBox = document.getElementById('login-error');
    if(!DB || !Array.isArray(DB.users)){
      console.warn('DB tidak valid saat login, mencoba memuat ulang DB');
      await loadDB();
    }
    const user = (DB.users||[]).find(u=>u.username===username && u.password===password);
    if(!user){
      errBox.textContent = 'Nama pengguna atau kata sandi salah.';
      errBox.style.display = 'block';
      return;
    }
  if(user.status==='nonaktif'){
    errBox.textContent = 'Akun ini telah dinonaktifkan. Hubungi administrator.';
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';
    setSession(user);
    addLog('Masuk aplikasi', user.nama + ' (' + user.role + ') masuk ke aplikasi');
    boot();
  }catch(err){
    console.error('Error saat proses login:', err);
    const errBox = document.getElementById('login-error');
    errBox.textContent = 'Terjadi kesalahan saat login. Cek konsol untuk detail.';
    errBox.style.display = 'block';
  }finally{
    submitBtn.classList.remove('btn-loading');
    submitBtn.disabled = false;
  }
}
function togglePasswordVisibility(){
  const input = document.getElementById('login-password');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
}
function handleLogout(){
  const u = currentUser();
  if(u) addLog('Keluar aplikasi', u.nama + ' keluar dari aplikasi');
  clearSession();
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
  boot();
}

function closeProfileDropdown(){

function applyKoperasiBranding(){
  if(!DB.koperasi){
    console.warn('DB.koperasi belum tersedia saat applyKoperasiBranding dipanggil');
    return;
  }
  document.getElementById('login-koperasi-name').textContent = DB.koperasi.nama;
  document.getElementById('header-koperasi-name').textContent = DB.koperasi.nama;
  document.title = DB.koperasi.nama;

    headerIcon.innerHTML = '<img src="'+DB.koperasi.iconImage+'" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">';
  } else {
    loginIcon.textContent = DB.koperasi.icon;
    headerIcon.textContent = DB.koperasi.icon;
  }
}

function roleLabel(r){ return r==='admin'?'Administrator':(r==='koordinator'?'Koordinator':'Nasabah'); }
function defaultPageFor(role){
  if(role==='admin') return 'admin_beranda';
  if(role==='koordinator') return 'koor_beranda';
  return 'nas_beranda';
}

// Menu tambahan admin: langsung tampil di sidebar (desktop),
// tapi dikumpulkan di popup "Lainnya" pada bottom-nav (mobile)
const ADMIN_MORE_ITEMS = [
  {p:'admin_usermgmt', ic:'user_cog', label:'User Management'},
  {p:'admin_shu', ic:'percent', label:'SHU'},
  {p:'admin_laporan', ic:'report', label:'Laporan'},
  {p:'admin_laporan_ringkas', ic:'ringkas', label:'Laporan Ringkas'},
  {p:'admin_suratsp', ic:'report', label:'Surat SP'},
  {p:'admin_pengaturan', ic:'settings', label:'Pengaturan'},
  {p:'admin_log', ic:'log', label:'Log Transaksi'}
];

function renderNav(){
  const user = currentUser();
  if(!user) return;
  const hasMyTab = user.role==='admin'||user.role==='koordinator' ? true : DB.tabunganAccounts.some(a=>a.userId===user.id);
  const hasMyPem = user.role==='admin'||user.role==='koordinator' ? true : DB.pembiayaan.some(p=>p.userId===user.id);
  const hasMySah = user.role==='admin'||user.role==='koordinator' ? true : DB.kepemilikanSaham.some(k=>k.userId===user.id);
  let items = [];
  let moreItems = [];
  if(user.role==='admin'){
    items = [
      {p:'admin_beranda', ic:'home', label:'Beranda'},
      {p:'admin_anggota', ic:'users', label:'Anggota'},
      {p:'admin_tabungan', ic:'wallet', label:'Tabungan'},
      {p:'admin_pembiayaan', ic:'finance', label:'Pembiayaan'},
      {p:'admin_saham', ic:'coin', label:'Saham'}
    ];
    moreItems = ADMIN_MORE_ITEMS;
  } else if(user.role==='koordinator'){
    items = [
      {p:'koor_beranda', ic:'home', label:'Beranda'},
      {p:'koor_anggota', ic:'users', label:'Anggota'},
      {p:'koor_tabungan', ic:'wallet', label:'Tabungan'},
      {p:'koor_pembiayaan', ic:'finance', label:'Pembiayaan'},
      {p:'koor_saham', ic:'coin', label:'Saham'}
    ];
  } else {
    items = [
      {p:'nas_beranda', ic:'home', label:'Beranda'},
      {p:'nas_info', ic:'report', label:'Info Koperasi'}
    ];
    if(hasMyTab) items.push({p:'nas_tabungan', ic:'wallet', label:'Tabungan'});
    if(hasMyPem) items.push({p:'nas_pembiayaan', ic:'finance', label:'Pembiayaan'});
  }
  const renderBtn = (it, active) => {
    const ic = NAV_ICONS[it.ic] || ICONS[it.ic] || '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>';
    return '<button class="'+(active?'active':'')+'" onclick="go(\''+it.p+'\')"><span class="ic">'+ic+'</span>'+it.label+'</button>';
  };
  const moreIcon = '⋯';
  const moreActive = moreItems.some(it=>currentPage===it.p);
  const moreBtn = '<button class="'+(moreActive?'active':'')+'" onclick="openMoreMenu()"><span class="ic">'+moreIcon+'</span>Lainnya</button>';

  // Render bottom nav (mobile): menu inti + tombol "Lainnya" (kalau ada menu tambahan)
  const bottomNav = document.getElementById('bottom-nav');
  bottomNav.innerHTML = items.map(it=>renderBtn(it, currentPage===it.p)).join('') + (moreItems.length ? moreBtn : '');

  // Render sidebar (desktop): semua menu langsung ditampilkan, tanpa "Lainnya"
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = items.concat(moreItems).map(it=>renderBtn(it, currentPage===it.p)).join('');
}
function openMoreMenu(){
  const items = ADMIN_MORE_ITEMS;
  openModal(`
    <h3 style="margin-bottom:12px;">Menu lain</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      ${items.map(m=>`
        <div class="tx-acc-row" style="cursor:pointer;justify-content:center;padding:16px 8px;flex-direction:column;gap:6px;text-align:center;" onclick="closeModal();go('${m.p}')">
          <span style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:24px;">${NAV_ICONS[m.ic]||ICONS[m.ic]}</span>
          <span style="font-size:12px;font-weight:600;">${m.label}</span>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn btn-outline btn-block" onclick="closeModal()">Tutup</button>
    </div>
  `);
}

/* =========================================================
   NOTIFIKASI SUKSES BESAR — muncul di tengah layar tiap kali
   input/simpan data berhasil.
========================================================= */
let successTimer = null;
function bigSuccess(msg){
  let el = document.getElementById('success-overlay');
  if(!el){
    el = document.createElement('div');
    el.id = 'success-overlay';
    el.className = 'success-overlay';
    el.innerHTML = '<div class="success-card"><div class="success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div><div class="success-text" id="success-text"></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', hideBigSuccess);
  }
  document.getElementById('success-text').textContent = msg;
  const path = el.querySelector('.success-icon path');
  if(path){ path.style.animation = 'none'; void path.offsetWidth; path.style.animation = ''; }
  el.classList.add('show');
  if(navigator.vibrate) navigator.vibrate(30);
  clearTimeout(successTimer);
  successTimer = setTimeout(hideBigSuccess, 1800);
}
function hideBigSuccess(){
  const el = document.getElementById('success-overlay');
  if(el) el.classList.remove('show');
  clearTimeout(successTimer);
}

/* =========================================================
   TOMBOL KEMBALI (Android back button) — pakai riwayat browser
   supaya tekan "kembali" di HP menutup modal / kembali ke
   halaman sebelumnya, bukan langsung keluar dari aplikasi.
========================================================= */
let isSyncingFromHistory = false;

function pushNavHistory(replace){
  if(isSyncingFromHistory) return;
  const modalOverlay = document.getElementById('modal-overlay');
  const state = {
    page: currentPage,
    sub: currentSubState,
    modal: !!(modalOverlay && modalOverlay.classList.contains('show'))
  };
  try{
    if(replace) history.replaceState(state, '');
    else history.pushState(state, '');
  }catch(e){ /* abaikan kalau browser membatasi history API */ }
}

window.addEventListener('popstate', function(e){
  const user = (typeof currentUser==='function') ? currentUser() : null;
  if(!user) return; // di layar login, biarkan perilaku bawaan
  isSyncingFromHistory = true;
  const modalOverlay = document.getElementById('modal-overlay');
  const state = e.state;
  if(state && state.page){
    currentPage = state.page;
    currentSubState = state.sub || {};
    if(modalOverlay) modalOverlay.classList.toggle('show', !!state.modal);
  } else {
    if(modalOverlay) modalOverlay.classList.remove('show');
    currentPage = defaultPageFor(user.role);
    currentSubState = {};
  }
  renderContent();
  renderNav();
  isSyncingFromHistory = false;
});
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});

function confirmDialog(msg, sub, type, onConfirm, btnLabel){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay show';
  overlay.innerHTML = `
    <div class="confirm-box">
      <div class="icon ${type||'danger'}">
        ${type==='warning'?'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h0"/></svg>':'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-14"/></svg>'}
      </div>
      <div class="msg"><b>${msg}</b>${sub?'<span style="color:var(--muted);font-size:13px;">'+sub+'</span>':''}</div>
      <div class="confirm-actions">
        <button class="btn btn-outline" id="confirm-batal">Batal</button>
        <button class="btn ${type==='warning'?'btn-gold':'btn-danger'}" id="confirm-ya">${btnLabel||(type==='warning'?'Ya, aktifkan':'Ya, hapus')}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('confirm-batal').onclick = ()=>{ overlay.remove(); };
  document.getElementById('confirm-ya').onclick = ()=>{ overlay.remove(); onConfirm(); };
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
}

/* =========================================================
   DATA HELPERS
========================================================= */
function userAccounts(userId){
  return DB.tabunganAccounts
    .filter(a=>a.userId===userId)
    .map(a=>({acc:a, j: DB.koperasi.jenisTabungan.find(j=>j.id===a.jenisId)}))
    .filter(x=>x.j);
}
function jenisBelumDibuka(userId){
  const opened = DB.tabunganAccounts.filter(a=>a.userId===userId).map(a=>a.jenisId);
  return DB.koperasi.jenisTabungan.filter(j=>!opened.includes(j.id));
}
function nextAccNo(){
  const max = DB.tabunganAccounts.reduce((m,a)=>{
    const n = parseInt((a.noRekening||'0').split('-').pop(), 10);
    return n>m ? n : m;
  }, 0);
  return '2026-'+String(10001+max).slice(-5);
}
function getAccount(userId, jenisId){
  let acc = DB.tabunganAccounts.find(a=>a.userId===userId && a.jenisId===jenisId);
  if(!acc) return null;
  if(!acc.noRekening) acc.noRekening = nextAccNo();
  return acc;
}
function hapusSemuaRekening(userId){
  const user = userById(userId);
  if(!user) return;
  const jml = DB.tabunganAccounts.filter(a=>a.userId===userId).length;
  if(!jml) return;
  confirmDialog('Hapus semua rekening?', 'Semua rekening tabungan milik ' + user.nama + ' (' + jml + ' rekening) beserta transaksinya akan dihapus.', 'danger', ()=>{
    const ids = DB.tabunganAccounts.filter(a=>a.userId===userId).map(a=>a.id);
    DB.tabunganAccounts = DB.tabunganAccounts.filter(a=>!ids.includes(a.id));
    DB.tabunganTx = DB.tabunganTx.filter(t=>t.userId!==userId);
    persist();
    ids.forEach(id => supabaseClient.from(TABLES.tabungan_accounts).delete().eq('id', id).then());
    supabaseClient.from(TABLES.tabungan_tx).delete().eq('user_id', userId).then();
    addLog('Hapus semua rekening', user.nama);
    bigSuccess('Semua rekening berhasil dihapus');
    renderContent();
  });
}
function totalSaldoUser(userId){
  return DB.tabunganAccounts.filter(a=>a.userId===userId).reduce((s,a)=>s+a.saldo,0);
}
function txForUser(userId){
  return DB.tabunganTx.filter(t=>t.userId===userId).sort((a,b)=> new Date(b.tanggal)-new Date(a.tanggal));
}
function jenisName(jenisId){
  const j = DB.koperasi.jenisTabungan.find(j=>j.id===jenisId);
  return j ? j.nama : '-';
}
function kelompokName(kelompokId){
  const k = DB.koperasi.kelompok.find(k=>k.id===kelompokId);
  return k ? k.nama : '-';
}
function groupByKelompok(items, getUserIdFn){
  const groups = {};
  items.forEach(item=>{
    const u = userById(getUserIdFn(item));
    const nama = kelompokName(u ? u.kelompokId : null);
    if(!groups[nama]) groups[nama] = [];
    groups[nama].push(item);
  });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'id')).map(nama=>({nama, items:groups[nama]}));
}
function groupByKelompokId(items, getKelompokIdFn){
  const groups = {};
  items.forEach(item=>{
    const nama = kelompokName(getKelompokIdFn(item));
    if(!groups[nama]) groups[nama] = [];
    groups[nama].push(item);
  });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,'id')).map(nama=>({nama, items:groups[nama]}));
}
function userById(id){ return DB.users?.find(u=>u.id===id) || { nama:'-', kelompokId:null, role:'-', noRekening:'-' }; }
function findUserByNama(nama){
  if(!nama) return null;
  const n = String(nama).trim().toLowerCase();
  return DB.users.find(u=>u.role==='nasabah' && String(u.nama||'').trim().toLowerCase()===n) || null;
}
function nasabahOfKelompok(kelompokId){ return DB.users.filter(u=>u.role==='nasabah' && u.kelompokId===kelompokId); }
function pembiayaanForUser(userId){ return DB.pembiayaan.filter(p=>p.userId===userId).sort((a,b)=>new Date(b.mulai)-new Date(a.mulai)); }
function koordinatorForKelompok(kelompokId){
  const k = DB.koperasi.kelompok.find(k=>k.id===kelompokId);
  return k && k.koordinatorId ? userById(k.koordinatorId) : null;
}

function doSetor(userId, jenisId, jumlah, keterangan){
  const acc = getAccount(userId, jenisId);
  if(!acc) throw new Error('Rekening tabungan belum dibuka untuk jenis ini.');
  acc.saldo += jumlah;
  const s = getSession();
  DB.tabunganTx.push({id:uid('tx'), userId, jenisId, tipe:'setor', jumlah, saldoSetelah:acc.saldo, tanggal:nowISO(), oleh:s.userId, keterangan: keterangan||'Setoran tunai'});
  persist();
  addLog('Setor tabungan', userById(userId).nama + ' - ' + jenisName(jenisId) + ' - ' + rupiah(jumlah));
}
function doSetorKoordinator(userId, jenisId, jumlah, keterangan){
  const s = getSession();
  doSetor(userId, jenisId, jumlah, keterangan);
  DB.setoran.push({id:uid('st'), userId, jenisId, jumlah, keterangan: keterangan||'Setoran tunai', tanggal:nowISO(), dibuatOleh:s.userId, status:'di_koordinator'});
  autoLunasiHutangDariSetoran(s.userId);
  persist();
  const nasabahSetor = userById(userId);
  notifAdminWA(waHeader('PEMBERITAHUAN SETORAN')
    + waAnggotaInfo(nasabahSetor)
    + '\nJenis Simpanan : ' + jenisName(jenisId)
    + '\nNominal : ' + rupiah(jumlah)
    + '\nDiterima oleh Koordinator : ' + userById(s.userId).nama
    + '\nWaktu : ' + waTanggal()
    + waFooter());
  notifKoordinatorKelompokWA(nasabahSetor.kelompokId, waHeader('SETORAN DICATAT OLEH KOORDINATOR')
    + waAnggotaInfo(nasabahSetor)
    + '\nJenis Simpanan : ' + jenisName(jenisId)
    + '\nNominal : ' + rupiah(jumlah)
    + '\nDiterima oleh Koordinator : ' + userById(s.userId).nama
    + '\nWaktu : ' + waTanggal()
    + waFooter());
  notifUserWA(userId, waHeader('SETORAN TELAH DICATAT')
    + waAnggotaInfo(nasabahSetor)
    + '\nJenis Simpanan : ' + jenisName(jenisId)
    + '\nNominal : ' + rupiah(jumlah)
    + '\nDiterima oleh Koordinator : ' + userById(s.userId).nama
    + '\nWaktu : ' + waTanggal()
    + waFooter());
}
async function confirmSetoran(setoranId){
  const st = DB.setoran.find(s=>s.id===setoranId);
  if(!st || st.status!=='di_koordinator') return {ok:false, msg:'Setoran tidak ditemukan atau sudah dikonfirmasi.'};
  const s = getSession();
  if(s.role!=='admin') return {ok:false, msg:'Hanya admin yang bisa konfirmasi setoran.'};
  st.status = 'sudah_di_admin';
  st.dikonfirmasiOleh = s.userId;
  st.waktuKonfirmasi = nowISO();
  if(SUPABASE_ENABLED){
    if(st.jenisId && !st.jenis){
      const { error } = await upsertToSupabase(TABLES.setoran, toSnake(st));
      if(error) console.error('Gagal konfirmasi setoran di Supabase:', error);
    }
  }
  persist();

function doTarik(userId, jenisId, jumlah, keterangan){
  const acc = getAccount(userId, jenisId);
  if(!acc) return {ok:false, msg:'Rekening tabungan belum dibuka untuk jenis ini.'};
  if(acc.saldo < jumlah) return {ok:false, msg:'Saldo tidak mencukupi.'};

/* =========================================================
   KAS KOORDINATOR & HUTANG ADMIN KE KOORDINATOR
   Dana yang dipegang koordinator (dari setoran yg belum disetor
   ke admin) berkurang duluan saat ada penarikan lewat koordinator.
   Jika penarikan > dana yang dipegang, selisihnya jadi hutang
   admin ke koordinator.
========================================================= */
function totalSetoranPendingKoor(koorId){
  return DB.setoran.filter(s=>s.dibuatOleh===koorId && s.status==='di_koordinator').reduce((s,x)=>s+x.jumlah,0);
}
function totalPenarikanDariKasKoor(koorId){
  return (DB.kasPenarikan||[]).filter(p=>p.koorId===koorId).reduce((s,x)=>s+x.jumlah,0);
}
function kasKoordinator(koorId){
  return Math.max(0, totalSetoranPendingKoor(koorId) - totalPenarikanDariKasKoor(koorId));
}
function totalHutangKoor(koorId){
  return (DB.hutangKoor||[]).filter(h=>h.koorId===koorId && h.status==='belum_lunas').reduce((s,x)=>s+(x.jumlah-(x.dibayar||0)),0);
}
// Setoran pending (belum disetor ke admin) dikurangi FIFO oleh penarikan yang sudah
// memakai kas koordinator, supaya antrian/notifikasi konfirmasi admin ikut berkurang.
function pendingSetoranNetForKoor(koorId){
  const items = DB.setoran.filter(s=>s.dibuatOleh===koorId && s.status==='di_koordinator')
    .slice().sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal));
  let dipakai = totalPenarikanDariKasKoor(koorId);
  const out = [];
  for(const s of items){
    if(dipakai <= 0){ out.push({...s, sisa:s.jumlah}); continue; }
    if(dipakai >= s.jumlah){ dipakai -= s.jumlah; continue; } // sudah habis dipakai penarikan, hilang dari antrian
    out.push({...s, sisa:s.jumlah - dipakai});
    dipakai = 0;
  }
  return out;
}
function pendingSetoranNetAll(){
  const koorIds = [...new Set(DB.setoran.filter(s=>s.status==='di_koordinator').map(s=>s.dibuatOleh))];
  let out = [];
  koorIds.forEach(kid=>{ out = out.concat(pendingSetoranNetForKoor(kid)); });
  return out;
}
function sisaSetoran(setoranId){
  const st = DB.setoran.find(s=>s.id===setoranId);
  if(!st) return 0;
  const net = pendingSetoranNetForKoor(st.dibuatOleh).find(x=>x.id===setoranId);
  return net ? net.sisa : 0;
}
// Ringkasan per koordinator: total saldo yg dipegang (belum disetor ke admin)
// + sisa saldo setelah dipakai penarikan (kalau ada) + daftar setoran yg
// menunggu diterima + hutang admin ke koordinator ybs. Untuk notifikasi
// simple & mudah dibaca (semua info soal 1 koordinator jadi 1 kartu).
function ringkasanSaldoKoordinator(){
  const setoranKoorIds = DB.setoran.filter(s=>s.status==='di_koordinator').map(s=>s.dibuatOleh);
  const hutangKoorIds = (DB.hutangKoor||[]).filter(h=>h.status==='belum_lunas').map(h=>h.koorId);
  const koorIds = [...new Set([...setoranKoorIds, ...hutangKoorIds])];
  return koorIds.map(kid=>{
    const koor = userById(kid);
    const totalSetoran = totalSetoranPendingKoor(kid);
    const dipakaiTarik = totalPenarikanDariKasKoor(kid);
    const sisaKas = kasKoordinator(kid);
    const pendingItems = pendingSetoranNetForKoor(kid);
    const hutangItems = (DB.hutangKoor||[]).filter(h=>h.koorId===kid && h.status==='belum_lunas');
    const totalHutang = hutangItems.reduce((s,h)=>s+(h.jumlah-(h.dibayar||0)),0);
    const penarikanItems = (DB.kasPenarikan||[]).filter(p=>p.koorId===kid).slice().sort((a,b)=>new Date(b.tanggal)-new Date(a.tanggal));
    return {koorId:kid, koor, totalSetoran, dipakaiTarik, sisaKas, jumlahItem:pendingItems.length, pendingItems, hutangItems, totalHutang, penarikanItems};
  }).filter(r=>r.totalSetoran>0 || r.totalHutang>0)
    .sort((a,b)=>(b.sisaKas+b.totalHutang)-(a.sisaKas+a.totalHutang));
}
// Kalau admin masih punya hutang ke koordinator, dan koordinator itu baru
// menerima saldo (setoran baru), pakai dulu saldo yang tersedia utk melunasi
// hutang (sebagian/semua) sebelum koordinator perlu menyetor ke admin.
// Dicatat sebagai "penarikan" dari kas koordinator (memakai mekanisme yang
// sama dgn penarikan nasabah) supaya jumlah yg dipakai tidak lagi dihitung
// sbg kas yg masih harus disetor ke admin.
function autoLunasiHutangDariSetoran(koorId){
  let tersedia = kasKoordinator(koorId);
  if(tersedia<=0) return 0;
  const hutangAktif = (DB.hutangKoor||[]).filter(h=>h.koorId===koorId && h.status==='belum_lunas')
    .slice().sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal));
  if(!hutangAktif.length) return 0;
  let totalDilunasi = 0;
  for(const h of hutangAktif){
    if(tersedia<=0) break;
    const sisaHutang = h.jumlah - (h.dibayar||0);
    if(sisaHutang<=0) continue;
    const bayar = Math.min(tersedia, sisaHutang);
    h.dibayar = (h.dibayar||0) + bayar;
    if(h.dibayar >= h.jumlah){ h.status = 'lunas'; h.waktuLunas = nowISO(); }
    DB.kasPenarikan.push({id:uid('kp'), koorId, userId:h.userId||null, jumlah:bayar, tanggal:nowISO(), keterangan:'Pelunasan hutang admin (otomatis dari setoran baru)'});
    tersedia -= bayar;
    totalDilunasi += bayar;
  }
  if(totalDilunasi>0){
    addLog('Pelunasan hutang koordinator (otomatis)', rupiah(totalDilunasi)+' ke '+userById(koorId).nama+' dipakai dari setoran baru yang masuk');
  }
  return totalDilunasi;
}
function doTarikKoordinator(userId, jenisId, jumlah, keterangan){
  const r = doTarik(userId, jenisId, jumlah, keterangan);
  if(!r.ok) return r;
  const s = getSession();
  const koorId = s.userId;
  const kasTersedia = kasKoordinator(koorId);
  const dariKas = Math.min(kasTersedia, jumlah);
  const kurang = jumlah - dariKas;
  if(dariKas > 0){
    DB.kasPenarikan.push({id:uid('kp'), koorId, userId, jumlah:dariKas, tanggal:nowISO(), keterangan:'Penarikan tunai '+userById(userId).nama});
  }
  if(kurang > 0){
    DB.hutangKoor.push({id:uid('hu'), koorId, userId, jumlah:kurang, dibayar:0, status:'belum_lunas', tanggal:nowISO(), keterangan:'Kekurangan kas penarikan '+userById(userId).nama});
    addLog('Hutang admin ke koordinator', rupiah(kurang)+' - '+userById(koorId).nama+' (kekurangan kas penarikan '+userById(userId).nama+')');
  }
  persist();
  notifAdminWA(waHeader('PEMBERITAHUAN PENARIKAN')
    + waAnggotaInfo(userById(userId))
    + '\nJenis Simpanan : ' + jenisName(jenisId)
    + '\nNominal : ' + rupiah(jumlah)
    + (kurang>0 ? '\nKekurangan Kas (Hutang ke Koordinator) : ' + rupiah(kurang) : '')
    + '\nDilakukan oleh Koordinator : ' + userById(koorId).nama
    + '\nWaktu : ' + waTanggal()
    + waFooter());
  return {ok:true, dariKas, kurang};
}

function doBayarAngsuran(pembId, oleh, jumlah, tanggal){
  const p = DB.pembiayaan.find(p=>p.id===pembId);
  if(!p || p.status==='lunas') return {ok:false, msg:'Pembiayaan tidak ditemukan atau sudah lunas.'};
  if(p.statusPengajuan!=='approved') return {ok:false, msg:'Pembiayaan belum disetujui admin.'};
  if(!jumlah || jumlah<=0) return {ok:false, msg:'Jumlah tidak valid.'};
  const tgl = tanggal || nowISO();
  const angsuranKe = p.tenor - p.sisaAngsuran + 1;
  p.riwayatAngsuran.push({id:uid('ang'), tanggal:tgl, jumlah, oleh, angsuranKe});
  p.sisaAngsuran--;
  const totalKew = p.jumlahPinjaman + marginNominalOf(p);
  const totalDibayar = p.riwayatAngsuran.reduce((s,a)=>s+a.jumlah, 0);
  if(totalDibayar >= totalKew || p.sisaAngsuran<=0) p.status='lunas';
  const olehUser = userById(oleh);
  const isAdmin = olehUser && olehUser.role==='admin';
  const st = {id:uid('st'), userId:p.userId, jenis:'angsuran', pembiayaanId:p.id, jumlah, keterangan:'Angsuran ke-'+angsuranKe, tanggal:tgl, dibuatOleh:oleh, status: isAdmin ? 'sudah_di_admin' : 'di_koordinator'};
  if(isAdmin){ st.dikonfirmasiOleh = oleh; st.waktuKonfirmasi = nowISO(); }
  DB.setoran.push(st);
  if(!isAdmin) autoLunasiHutangDariSetoran(oleh);
  const atur = DB.koperasi.aturKeuangan;
  if(atur && atur.pools && atur.dana && marginNominalOf(p)){
    const marginPerAngsuran = Math.round(marginNominalOf(p) / p.tenor);
    atur.pools.forEach(pool=>{
      const alokasi = Math.round(marginPerAngsuran * pool.persen / 100);
      atur.dana[pool.id] = (atur.dana[pool.id]||0) + alokasi;
    });
  }
  persist();
  addLog('Bayar angsuran', userById(p.userId).nama + ' - Angsuran ke-'+angsuranKe+' - '+rupiah(jumlah));
  const sisaPokok = Math.max(0, p.jumlahPinjaman - p.riwayatAngsuran.reduce((s,a)=>s+a.jumlah,0));
  if(isAdmin){
    notifUserWA(p.userId, waHeader('PEMBAYARAN ANGSURAN DICATAT')
      + waAnggotaInfo(userById(p.userId))
      + '\nAngsuran ke-' + angsuranKe + ' dari ' + p.tenor + ' bulan'
      + '\nNominal : ' + rupiah(jumlah)
      + '\nSisa Angsuran : ' + p.sisaAngsuran + ' bulan'
      + '\nSisa Pokok : ' + rupiah(sisaPokok)
      + (p.status==='lunas' ? '\nStatus : LUNAS' : '')
      + '\nWaktu : ' + waTanggal()
      + waFooter());
  } else {
    notifAdminWA(waHeader('PEMBERITAHUAN ANGSURAN')
      + waAnggotaInfo(userById(p.userId))
      + '\nAngsuran ke-' + angsuranKe + ' dari ' + p.tenor + ' bulan'
      + '\nNominal : ' + rupiah(jumlah)
      + '\nDiterima oleh Koordinator : ' + olehUser.nama
      + '\nWaktu : ' + waTanggal()
      + waFooter());
  }
  return {ok:true};
}

    admin_beranda: renderAdminBeranda,
    admin_anggota: renderAdminAnggota,
    admin_tabungan: renderAdminTabungan,

    koor_pembiayaan: renderKoorPembiayaan,

    nas_beranda: renderNasBeranda,
    nas_info: renderNasInfo,
    nas_tabungan: renderNasTabungan,
    nas_pembiayaan: renderNasPembiayaan,
    profil_saya: renderProfilSaya
  };
  const fn = routes[currentPage] || routes[defaultPageFor(user.role)];
  el.innerHTML = fn(user);
  if(currentPage==='admin_saham_certificate'){ requestAnimationFrame(fitSertifikatPreview); }
  if(activeId){
    const toFocus = document.getElementById(activeId);
    if(toFocus){
      toFocus.focus();
      if(selStart!=null && toFocus.setSelectionRange){
        try{ toFocus.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  } else {
    el.scrollTop = 0;
  }
}

const IMPORT_SPECS = {
  anggota: {
    label: 'Anggota',
    headers: ['nama','nik','alamat','no_hp','kelompok'],
    example: ['Siti Aminah','3273011234567890','Jl. Melati No. 5','081234567890','Karanggede'],

  },
